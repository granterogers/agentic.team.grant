/* --- Cost -----------------------------------------------------------------
   Grant: *"Cost per outcome. Yes. This is... I want this for sure. You can
   show it graphically as well as numerically on the front end."*

   Two figures, never added together, and §11 is the reason the page is shaped
   this way rather than showing one big number:

     * SPENT is measured. It is what a provider charged. It is currently $0.00
       across the board, because layer 4 of the router throws on any call a
       provider prices above zero, so a paid call cannot complete. That zero is
       a fact and the page says so in words — a reader who does not know the
       free-tier rule reads $0.00 as a broken query.
     * MODELLED is what the same tokens would have cost on a paid model, from
       the published prices in `model_prices`. It was never charged, and the
       badge says ESTIMATED on every block that carries it.

   The coverage card is not decoration either. Until the router fix in this
   same change, `inference_usage.job_id` was written by two avatar scripts and
   nothing else, so most calls cannot be attributed to a finished job at all.
   A cost-per-outcome page that quietly divides by the jobs it happens to know
   about would report a cost far too low and look completely healthy doing it.
*/
function cost(d) {
  const money = (v) => '$' + Number(v ?? 0).toFixed(2)
  // Four decimals for a per-item figure: at these volumes two decimals round
  // every row to $0.00 and the chart becomes a row of empty tracks.
  const fine = (v) => '$' + Number(v ?? 0).toFixed(4)
  const cov = d.coverage || {}
  const tot = d.totals || {}
  const kinds = d.by_kind || []
  const staff = d.by_staff || []

  const bars = (rows, label, value, format) => {
    if (!rows.length) return '<div class="empty">Nothing finished in this window yet.</div>'
    const max = Math.max(...rows.map((r) => Number(value(r)) || 0), 0)
    return `<div class="bars">${rows.map((r) => {
      const v = Number(value(r)) || 0
      // Width against the largest row, not against the total: the question a
      // reader has here is "which of these costs most", and a share-of-total
      // bar answers a different one and answers it badly when one row
      // dominates.
      const pct = max === 0 ? 0 : Math.max(2, Math.round((v / max) * 100))
      return `<div class="barrow">
        <span class="barlabel">${esc(label(r))}</span>
        <span class="bartrack"><span class="barfill${v === 0 ? ' zero' : ''}" style="width:${pct}%"></span></span>
        <span class="barval">${esc(format(v))}</span>
      </div>`
    }).join('')}</div>`
  }

  const kindRows = kinds.map((k) => `<tr>
      <td>${esc(k.kind)}</td>
      <td>${k.outcomes}</td>
      <td>${k.calls}</td>
      <td>${Number(k.tokens ?? 0).toLocaleString()}</td>
      <td>${k.avg_secs === null || k.avg_secs === undefined ? '—' : k.avg_secs + 's'}</td>
      <td>${esc(money(k.spent_usd))}</td>
      <td>${esc(fine(k.modelled_usd))}</td>
      <td>${esc(fine(k.modelled_usd_each))}</td>
    </tr>`).join('')

  const staffRows = staff.map((x) => `<tr>
      <td>${esc(x.name)}</td>
      <td>${x.outcomes}</td>
      <td>${esc(money(x.spent_usd))}</td>
      <td>${esc(fine(x.modelled_usd))}</td>
    </tr>`).join('')

  const pct = cov.attributed_pct ?? 0
  const gap = pct >= 90 ? '' : `
    <div class="meta" style="margin-top:10px">
      ${cov.unattributed_calls ?? 0} of ${cov.total_calls ?? 0} model calls in this window
      cannot be tied to a finished job, so the per-kind figures below are lower than the
      truth by roughly ${esc(fine(cov.unattributed_modelled_usd))}. Calls made before
      job attribution was fixed have no job recorded; this figure should climb on its own
      as new work runs.
    </div>`

  return `
    <section class="card wide" data-card="cost-totals">
      <span class="drag" title="Move up">⌃</span>
      <h2>Last ${esc(String(d.window_days ?? 30))} days</h2>
      <div class="body">
        <div class="tiles">
          <div class="tile"><b>${tot.outcomes ?? 0}</b><span>finished</span></div>
          <div class="tile"><b>${tot.calls ?? 0}</b><span>model calls</span></div>
          <div class="tile"><b>${Number(tot.tokens ?? 0).toLocaleString()}</b><span>tokens</span></div>
          <div class="tile"><b>${esc(money(tot.spent_usd))}</b><span>spent</span></div>
          <div class="tile"><b>${esc(fine(tot.modelled_usd))}</b><span>modelled</span></div>
        </div>
        <div class="meta" style="margin-top:10px">${esc(d.measured_note ?? '')}</div>
        <div class="meta" style="margin-top:6px">${esc(d.modelled_note ?? '')}</div>
        ${gap}
      </div>
    </section>

    <section class="card wide" data-card="cost-by-kind">
      <span class="drag" title="Move up">⌃</span>
      <h2>Cost per outcome, by kind of work<span class="est">ESTIMATED</span></h2>
      <div class="body">
        ${bars(kinds, (k) => k.kind, (k) => k.modelled_usd_each, fine)}
        <div class="meta" style="margin-top:10px">Modelled cost of one finished item of each kind.</div>
      </div>
    </section>

    <section class="card wide" data-card="cost-volume">
      <span class="drag" title="Move up">⌃</span>
      <h2>How much of each got finished</h2>
      <div class="body">
        ${bars(kinds, (k) => k.kind, (k) => k.outcomes, (v) => String(v))}
      </div>
    </section>

    <section class="card wide" data-card="cost-by-staff">
      <span class="drag" title="Move up">⌃</span>
      <h2>By who produced it<span class="est">ESTIMATED</span></h2>
      <div class="body">
        ${bars(staff, (x) => x.name, (x) => x.modelled_usd, fine)}
        ${staffRows ? `<div class="tablewrap"><table class="grid">
          <thead><tr><th>Who</th><th>Finished</th><th>Spent</th><th>Modelled</th></tr></thead>
          <tbody>${staffRows}</tbody></table></div>` : ''}
      </div>
    </section>

    <section class="card wide" data-card="cost-table">
      <span class="drag" title="Move up">⌃</span>
      <h2>The numbers</h2>
      <div class="body">
        ${kindRows ? `<div class="tablewrap"><table class="grid">
          <thead><tr><th>Kind of work</th><th>Finished</th><th>Calls</th><th>Tokens</th>
            <th>Avg time</th><th>Spent</th><th>Modelled</th><th>Modelled each</th></tr></thead>
          <tbody>${kindRows}</tbody></table></div>`
          : '<div class="empty">Nothing finished in this window yet.</div>'}
      </div>
    </section>`
}

const VIEWS = { setup, help, talk, build, routing, overview, trends, staff, activity, usage, cost, connections, projects, output, settings }

/*
  The Projects tab's buttons.
  
  Wired after render rather than with inline handlers, because the markup is
  built from server data and an onclick attribute in a template string is an
  injection waiting for a project named after a quote character.
*/
function wireProjects() {
  const fail = (e) => { const box = document.getElementById('np-err'); if (box) { box.textContent = e.message; box.hidden = false } else { alert(e.message) } }

  for (const b of document.querySelectorAll('[data-attach]')) {
    b.onclick = async () => {
      const slug = b.dataset.attach
      const conn = document.querySelector(`[data-conn="${slug}"]`).value
      const ref = document.querySelector(`[data-ref="${slug}"]`).value.trim()
      const role = document.querySelector(`[data-role="${slug}"]`).value
      if (!ref) return
      b.disabled = true
      try {
        // A home must say what it is the home for. Notion stores documents and
        // NotebookLM generates artifacts — Grant's own distinction — so the
        // kind follows the connector rather than asking a question with one
        // sensible answer.
        await act('attach', { p_slug: slug, p_connector: conn, p_ref: ref, p_role: role,
                              p_kind: role === 'home' ? (conn === 'notion' ? 'document' : 'artifact') : null })
        show('projects')
      } catch (e) { fail(e); b.disabled = false }
    }
  }

  for (const b of document.querySelectorAll('[data-detach]')) {
    b.onclick = async () => {
      // No confirmation: detaching disables a row and keeps every document the
      // connector fed (ADR-0013). It is undone by attaching again.
      b.disabled = true
      try { await act('detach', { p_attachment_id: b.dataset.detach }); show('projects') }
      catch (e) { fail(e); b.disabled = false }
    }
  }

  /*
    "Not now", and "Reconsider".

    §3's fifth option: *"deliberately leave it disconnected."* Without somewhere
    to put that answer the only way to stop being asked about a connector is to
    connect something you do not want, and the interface nags forever about a
    decision already made.

    No confirmation either way. Both directions are one click to undo, and
    neither touches a document.
  */
  for (const b of document.querySelectorAll('[data-choose]')) {
    b.onclick = async () => {
      const [slug, connector, choice] = b.dataset.choose.split('|')
      b.disabled = true
      try {
        // A reason only when declining. "Reconsider" is not a decision that
        // needs explaining, and a prompt on it would be friction for nothing.
        const why = choice === 'declined'
          ? prompt('Why leave this one disconnected? (optional — it is shown later)') ?? ''
          : ''
        await act('connection_choose', {
          p_slug: slug, p_connector: connector, p_choice: choice,
          ...(why.trim() === '' ? {} : { p_reason: why.trim() }),
        })
        show('projects')
      } catch (e) { fail(e); b.disabled = false }
    }
  }

  for (const b of document.querySelectorAll('[data-rename]')) {
    b.onclick = async () => {
      const next = prompt('New name for this project', b.dataset.name)
      if (!next || next === b.dataset.name) return
      try { await act('rename_project', { p_slug: b.dataset.rename, p_name: next }); show('projects') }
      catch (e) { fail(e) }
    }
  }

  const go = document.getElementById('np-go')
  if (go) {
    go.onclick = async () => {
      const name = document.getElementById('np-name').value.trim()
      const ref = document.getElementById('np-ref').value.trim()
      const conn = document.getElementById('np-conn').value
      const box = document.getElementById('np-err')
      box.hidden = true
      if (!name || !ref) { box.textContent = 'A name and a source are both required.'; box.hidden = false; return }
      go.disabled = true
      try {
        const r = await act('create_project', { p_name: name, p_connector: conn, p_ref: ref })
        // 0153: the create path no longer absorbs a name collision by
        // appending a number. When something already answers to this name it
        // says so and creates nothing, and the choice is Grant's.
        if (r && r.needs_confirmation) { askWhichProject(r, { name, conn, ref, go }); return }
        show('projects')
      }
      catch (e) { fail(e); go.disabled = false }
    }
  }
}

/*
  "There is already something by that name."

  The half of §4 Grant can see. The database now refuses to make a second
  project quietly (0153) and hands back the candidates instead; this is where a
  person meets that refusal, and it has to offer a way forward or it is just an
  error message with extra steps.

  Three answers, and all three are real:

    - it IS that one          → attach the source to it, which is what he meant
    - it is genuinely new     → create it, with p_force
    - neither                 → close, change the name, try again

  Attaching rather than creating is the whole point. His words: *"Do not
  automatically create duplicates simply because a connection is currently
  missing."* The inverse holds too — when the project exists and the source is
  the new thing, the source is what should be added.
*/
function askWhichProject(answer, ctx) {
  const box = document.getElementById('np-err')
  if (!box) return
  const candidates = answer.candidates || []

  box.hidden = false
  box.innerHTML =
    `<p style="margin:0 0 10px;color:var(--ink)">${esc(answer.question ||
      'There is already something by that name.')}</p>` +
    `<div class="row" style="flex-wrap:wrap;gap:8px">` +
    candidates.map((c, i) =>
      `<button class="mini" data-pick="${i}">Use “${esc(c.name)}”</button>`).join('') +
    `<button class="mini" data-pick="new">No — “${esc(ctx.name)}” is new</button>` +
    `</div>`

  const finish = () => { ctx.go.disabled = false; show('projects') }

  for (const b of box.querySelectorAll('[data-pick]')) {
    b.onclick = async () => {
      for (const other of box.querySelectorAll('[data-pick]')) other.disabled = true
      try {
        if (b.dataset.pick === 'new') {
          await act('create_project', {
            p_name: ctx.name, p_connector: ctx.conn, p_ref: ctx.ref, p_force: true,
          })
        } else {
          // The source he was adding, added to the project he actually meant.
          const chosen = candidates[Number(b.dataset.pick)]
          await act('attach', { p_slug: chosen.slug, p_connector: ctx.conn, p_ref: ctx.ref })
        }
        finish()
      } catch (e) {
        box.textContent = e.message
        ctx.go.disabled = false
      }
    }
  }
}

/*
  The hint under each card heading, inserted after render.

  After, and from a map, so that a view function stays a view function: adding a
  card does not oblige anyone to write documentation for it in the same breath,
  and a card whose heading changes loses its hint rather than keeping a wrong
  one. Idempotent, because `show` re-renders the whole view on every visit.
*/
function explain(main) {
  for (const card of main.querySelectorAll('.card')) {
    const heading = card.querySelector('h2')
    if (heading === null || card.querySelector('.hint') !== null) continue
    // A card that already introduces itself is left alone. Four of them do —
    // the notebook meter, Google, the database facts, the settings form — and
    // the first version put a second, near-identical sentence above each.
    if (heading.nextElementSibling?.classList.contains('meta') === true) continue
    // The heading WITHOUT its badge. Two cards append an `.est` chip — STALE on
    // Connections, AS OF … on the diary — and `textContent` glues it to the
    // title, so "Connections" became "ConnectionsSTALE" and lost its hint at
    // exactly the moment the card needed explaining most.
    const label = [...heading.childNodes]
      .filter((n) => !(n.nodeType === 1 && n.classList.contains('est')))
      .map((n) => n.textContent)
      .join('')
    const hint = HINTS[label.trim().toLowerCase()]
    if (hint === undefined) continue
    const p = document.createElement('p')
    p.className = 'hint'
    p.textContent = hint
    heading.after(p)
  }
}

async function show(section) {
  // Both navs — the sheet's and the sidebar's — carry the same buttons, so the
  // current marker has to be set on every one of them, not the first match.
  for (const b of document.querySelectorAll('nav button')) {
    b.setAttribute('aria-current', String(b.dataset.tab === section))
  }
  const where = document.getElementById('where')
  if (where) where.textContent = labelFor(section)
  const guide = GUIDE[section]
  const lede = document.getElementById('lede')
  if (lede) {
    lede.innerHTML = guide === undefined ? '' : `
      <h2>${esc(guide.title)}</h2>
      <p>${esc(guide.what)}</p>
      <p class="todo">${esc(guide.todo)}</p>`
  }
  const main = document.getElementById('main')
  main.innerHTML = '<div class="empty">Loading…</div>'
  try {
    // Talk fetches nothing: it has no state of its own, and its state lives in
    // the conversation. `load('talk')` would ask hq-api for a section that does
    // not exist and get a 400 — which is exactly how the tab/section mismatch
    // above was found the first time.
    // Talk and Help fetch nothing. Help especially: a help page that needs the
    // API is a help page that goes blank exactly when something is broken,
    // which is when it gets opened.
    const data = section === 'talk' || section === 'help' ? {} : await load(section)
    main.innerHTML = VIEWS[section](data)
    if (section === 'talk') wireTalk()
    if (section === 'setup') wireSetup()
    if (section === 'projects') wireProjects()
    if (section === 'settings') wireSettings()
    if (section === 'routing') wireRouting()
    if (section === 'staff') wireTeam()
    explain(main)
    armSparklines(main)
    applyLayout(main, section)
    armLayout(main, section)
    document.getElementById('stamp').textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
  } catch (e) {
    if (e.message === 'unauthorized') return
    // Plain language, and never the raw error object. §25: no raw JSON or debug
    // detail in normal workflow — a stack trace on a phone helps nobody.
    main.innerHTML = `<section class="card wide"><div class="err">Could not load this. ${esc(e.message)}</div></section>`
  }
}

/*
  Where to land.

  Set up when something needs him, Today when nothing does. Grant's complaint
  was that it is not obvious what to do; opening on a dashboard when three
  services are unconfigured is the page answering a question he did not ask and
  ignoring the one he did.

  Falls back to Today if the check itself fails — a landing decision that can
  strand someone on an error screen is worse than a wrong landing.
*/
async function landing() {
  try {
    const setup = await load('setup')
    // Projects, not Today. Grant, §1: *"The home screen should be radically
    // simplified. It should primarily show My Projects."* Today is a good page
    // and it is a page about the QUEUE — what is waiting, what is running, what
    // got done — which is the system describing itself. Projects is the page
    // about his work.
    //
    // Set up still wins when something is actually broken, because a landing
    // that shows projects while three services are unconfigured is the page
    // answering a question he did not ask.
    return (setup.needs_you ?? 0) > 0 ? 'setup' : 'projects'
  } catch {
    return 'projects'
  }
}

async function start() {
  const first = await landing()
  shell(first)
  show(first)
  // Refresh on return rather than on a timer: a phone in a pocket polling every
  // thirty seconds is a battery cost for data nobody is looking at.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      const active = document.querySelector('nav button[aria-current="true"]')
      if (active) show(active.dataset.tab)
    }
  })
}

if (localStorage.getItem(KEY)) start()
else gate()
</script>
