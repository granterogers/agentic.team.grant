<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f7f6f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1b26" media="(prefers-color-scheme: dark)">
<title>Team HQ</title>
<!-- Two faces, two jobs: Jost is the geometric grotesque nearest the brand's
     Brandon Grotesque and carries headings and labels; Inter carries body and
     every number, because it has real tabular figures. `display=swap` so a slow
     font request delays nothing, and both have full fallback stacks in the CSS
     so a failed one is a slightly different page rather than a broken one. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23333345'/><text y='70' x='50' font-size='60' text-anchor='middle' fill='%23f95411'>◆</text></svg>">
<style>
/*
  Mobile-first, and the desktop rules are the additions rather than the other
  way round. §25 asks for "mobile-first interaction with desktop information
  density", which is a real tension: the phone wants one column and big touch
  targets, the desktop wants to show forty jobs without scrolling. The
  resolution here is that the CARD is the unit on both, and on a wide screen the
  cards flow into columns and their internal padding tightens.
*/
/*
  Grant: *"you also need to make the front end a lot more attractive, better
  colours, menus etc.. with more explanation of each component, what to do."*

  Three separate asks, and they are answered in three places:

    - colour, here: an indigo accent over slightly cooler neutrals, a raised
      surface token so a card can sit ON something rather than beside it, and
      one soft shadow instead of the flat hairline-box look;
    - menus, in `shell()`: nine equal pills became five named groups, a real
      sidebar on a wide screen;
    - explanation, in `GUIDE` and `HINTS`: every tab says what it is for and
      what to do on it, and every card gets a line under its heading.

  The chart colour is deliberately NOT the new accent. `--series` keeps the
  values the palette validator actually passed — #2f6df6 on light, #5c8cf5 on
  dark — because a chart colour answers to a lightness band and a chroma floor
  that a UI accent does not, and re-pointing it at the indigo would be claiming
  a check that was never run on it.
*/
/*
  The look.

  Grant: *"overall front end graphics, interface, fonts, colors, are so dated
  ... the whole thing needs to go up several levels on multiple counts."*

  He was right and the diagnosis is specific rather than a matter of taste. It
  was the default 2020 admin dashboard: system font stack, indigo-to-violet
  gradient, every card the same weight in a uniform grid, drop shadows doing the
  work that hierarchy should. Nothing in it had been decided; it had been
  reached for.

  ## Where the palette comes from

  INNERGY's own — corporate dark `#333345` and the orange `#F95411`, per the
  Winter 2025 manual — rather than a fourth colour scheme invented for a fourth
  surface. The manual's logo lockup is deliberately NOT here: this is Grant's
  own team's HQ, not an INNERGY product, and stamping the wordmark on it would
  claim something untrue. The palette is a family resemblance; the logo is an
  assertion of authorship.

  Status colours stay green/amber/red because they are semantics, not brand
  accents — a "good" lamp in brand orange is not on-brand, it is unreadable.
  They are pulled toward the warm end so they sit in the same room as the
  orange rather than beside it.

  ## Type

  Two faces with different jobs. **Jost** is the geometric grotesque nearest to
  the manual's Brandon Grotesque, and it carries headings, labels and the small
  uppercase micro-type that echoes the wordmark's letterspacing. **Inter**
  carries body and — the reason it is here rather than one family doing both —
  every number, because it has real tabular figures and a dashboard is mostly
  numbers that must line up in a column.

  Both have a full fallback stack taken from the manual's own, so a failed font
  request is a slightly different page rather than Times New Roman.
*/
:root {
  /* Warm paper rather than the cold blue-grey it was. */
  --bg: #f7f6f4; --panel: #ffffff; --panel-2: #faf9f7;
  --ink: #23232f; --muted: #6b6b7d;
  --line: #e6e4e0;
  --accent: #d8410c;          /* the brand orange, darkened to clear 4.5:1 on paper */
  --accent-2: #e4323e;        /* the gradient's other end */
  --accent-soft: rgba(216, 65, 12, 0.09);
  /* Warm-shifted status. Amber and crimson are close cousins of the accent by
     design; the accent only ever appears on a control, never on a lamp. */
  --warn: #a2620a; --bad: #b31d2e; --good: #2f7355;
  /* Charts answer to the palette validator, not to the brand: inside the
     lightness band, above the chroma floor, over 3:1 on this ground. */
  --series: #c2410c;
  /* Almost no shadow. The old one was doing the job that a border and space
     should do, and it is the single thing that reads most as "2020 dashboard". */
  --shadow: 0 1px 2px rgba(35, 35, 47, 0.04);
  --radius: 12px;
  --pad: 16px;
  --display: "Jost", "Century Gothic", Futura, "Avenir Next", Avenir, system-ui, sans-serif;
  --text: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-synthesis-weight: none;
}
/*
  Dark, built from the corporate dark rather than from black.

  `#333345` is the manual's own background colour, so the dark theme is the
  brand's own dark instead of a blue-black chosen to look like everyone else's.
  The ground goes a step below it so panels can BE it and still separate.
*/
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1b1b26; --panel: #24242f; --panel-2: #2b2b38;
    --ink: #ecebe8; --muted: #9d9db0;
    --line: #353544;
    --accent: #ff7a4d;        /* lifted for contrast on the dark ground */
    --accent-2: #ff9f6b;
    --accent-soft: rgba(255, 122, 77, 0.14);
    --warn: #e0a45c; --bad: #f87171; --good: #4bbd8c;
    --series: #ff8a5c;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--ink);
  /* 15.5px, not 15. A dashboard read on a phone at arm's length was a size too
     small everywhere, and raising the base is worth more than any other single
     change here. */
  font: 15.5px/1.55 var(--text);
  -webkit-font-smoothing: antialiased;
  /* Numbers line up in columns and stop jittering as they tick. */
  font-variant-numeric: tabular-nums;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
header {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: saturate(180%) blur(14px);
  border-bottom: 1px solid var(--line);
  padding: 10px var(--pad);
  display: flex; align-items: center; gap: 11px;
}
/* The mark. A gradient square with a diamond in it — enough to make the tab
   and the home-screen icon recognisable at a glance, and cheap: two elements
   and no image request. */
/* The gradient is the brand's own — #E4323E to #F65524 — rather than the
   indigo-to-violet that every admin template ships with. */
.mark {
  width: 30px; height: 30px; border-radius: 9px; flex: none;
  background: linear-gradient(135deg, #e4323e, #f65524);
  display: grid; place-items: center; color: #fff; font-size: 14px;
  box-shadow: 0 2px 10px -3px rgba(228, 50, 62, 0.5);
}
.brand { min-width: 0; }
/* The wordmark's own treatment — letterspaced, weighted, geometric — without
   the wordmark. It is what makes the top of the page read as designed rather
   than as a default. */
h1 { font-family: var(--display); font-size: 15px; font-weight: 600; margin: 0;
  letter-spacing: 0.13em; text-transform: uppercase; line-height: 1.2; }
.brand span { display: block; color: var(--muted); font-size: 12.5px;
  letter-spacing: 0.01em; margin-top: 1px; }
#stamp { color: var(--muted); font-size: 12px; margin-left: auto; font-variant-numeric: tabular-nums;
  white-space: nowrap; }

/*
  The menu.

  Grant, on a phone: *"instead of a bunch of buttons along a row at the top,
  which is really ugly and stupid way of scrolling around, make a proper
  dynamic menu system."*

  He was describing exactly what was there — thirteen pills in a horizontally
  scrolling strip with the group headings hidden, because there was no room for
  them. Scrolling sideways to find a page you cannot see the name of is not a
  menu, it is a filing cabinet with the labels removed.

  So on a phone there is a button that says where you are, and pressing it
  opens the whole menu as a sheet: every group, every heading, every item, all
  visible at once and each with a line saying what it is. Nothing scrolls
  sideways. On a wide screen the same markup is the sidebar it always was, and
  the sheet never appears.
*/
.menubar { display: flex; align-items: center; gap: 10px; padding: 8px var(--pad);
  border-bottom: 1px solid var(--line); }
.menubtn { appearance: none; display: flex; align-items: center; gap: 9px;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  border-radius: 10px; padding: 9px 13px; font: inherit; font-size: 14.5px;
  font-weight: 600; min-height: 44px; cursor: pointer; flex: 1; text-align: left; }
.menubtn .bars { display: grid; gap: 3px; flex: none; }
.menubtn .bars i { display: block; width: 15px; height: 2px; border-radius: 2px;
  background: var(--accent); }
.menubtn { font-family: var(--display); letter-spacing: 0.01em; }
.menubtn .where { flex: 1; }
.menubtn .caret { color: var(--muted); font-size: 12px; flex: none; }

/* The sheet. `hidden` is toggled in JS; the rule is !important in the reset so
   this cannot fight it. */
.sheet { position: fixed; inset: 0; z-index: 50; background: rgba(8, 10, 16, 0.55);
  display: flex; align-items: flex-end; }
/* `display: flex` above beats the browser's own `[hidden] { display: none }`,
   so without this the sheet is permanently open and covering the page — which
   is exactly what it did, and what a screenshot at phone size showed in the
   first five seconds of looking at it. A rule that turns an element on has to
   say when it is off. */
.sheet[hidden] { display: none; }
/* The sidebar's copy of the nav. On a phone it must not exist at all: it was
   rendering below the menu button as a second, always-open menu — the exact
   wall of buttons this change removes, just vertical instead of horizontal.
   Two navs in the markup is deliberate (one sheet, one rail); two navs on
   screen is the bug. */
#rail-desktop { display: none; }
.sheetinner { background: var(--bg); width: 100%; max-height: 86vh; overflow-y: auto;
  border-radius: 16px 16px 0 0; padding: 6px var(--pad) calc(18px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--line); }
.sheet .rail { padding: 0; }
.sheetgrip { width: 38px; height: 4px; border-radius: 2px; background: var(--line);
  margin: 8px auto 4px; }

nav { display: block; }
nav .grp { display: block; margin: 14px 0 0; }
nav .lbl { display: block; font-family: var(--display); font-weight: 600; font-size: 12px;
  letter-spacing: 0.13em; text-transform: uppercase;
  color: var(--muted); margin: 0 0 6px; }
nav button {
  appearance: none; display: block; width: 100%; text-align: left;
  border: 0; border-bottom: 1px solid var(--line); background: none;
  color: var(--ink); padding: 11px 2px; font: inherit; font-size: 15px;
  min-height: 46px; cursor: pointer;
}
nav button .sub { display: block; font-size: 12.5px; color: var(--muted); margin-top: 2px; }
nav button:last-child { border-bottom: 0; }
nav button[aria-current="true"] { color: var(--accent); font-weight: 600; }
/*
  `minmax(0, 1fr)`, not the implicit `1fr`.

  A grid item's default `min-width` is `auto`, which means "at least as wide as
  my content refuses to get narrower than". One un-wrappable run of text inside
  one card therefore widens the TRACK, which widens every card, which widens the
  page — measured on an iPhone 14 as 533px of content inside a 390px viewport on
  the Connections tab, with the offending string a parked-service note that had
  nowhere to break. The card looked innocent; the grid was the mechanism.

  `minmax(0, ...)` says the track may be narrower than its content, and the
  content is then obliged to wrap or scroll inside it. Everything below is the
  same instruction repeated at each level that can still blow out.
*/
main { padding: var(--pad); display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }

/*
  What this tab is for, above the cards.

  Grant: *"more explanation of each component, what to do."* Two sentences, and
  they are two DIFFERENT sentences on purpose: what the tab shows, and what he
  can do about it — including "nothing, this is a read-out", which is the honest
  answer on most of them and the one a dashboard usually leaves him to infer.
*/
.lede { padding: 14px var(--pad) 0; max-width: 74ch; }
/* The one genuinely large thing on any page. Everything else was competing at
   the same weight, which is the other half of why it read as flat. */
.lede h2 { font-family: var(--display); font-weight: 600; margin: 0 0 5px;
  font-size: 27px; letter-spacing: -0.015em; line-height: 1.15; }
.lede p { margin: 0 0 8px; color: var(--muted); font-size: 14px; line-height: 1.6;
  max-width: 62ch; }
/* The second half — what to do — carries a rule so the two sentences are not
   two paragraphs of equal weight saying different kinds of thing. */
.lede p.todo {
  margin: 0; color: var(--ink); border-left: 2px solid var(--accent);
  padding-left: 12px;
}

@media (min-width: 1040px) {
  :root { --pad: 26px; }
  /* The rail carries the divider and the nav sticks inside it. The border was
     on the nav itself at first, which made it stop wherever the last menu item
     did — a line that ends two thirds of the way down a long page reads as a
     rendering fault. */
  .frame { display: grid; grid-template-columns: 248px minmax(0, 1fr); align-items: stretch; }
  #rail-desktop { display: block; }
  .rail { border-right: 1px solid var(--line); padding: 4px var(--pad) 20px; }
  /* On a wide screen the menu is simply always open, so the button that opens
     it and the sheet it opens into both stop existing. */
  .menubar { display: none; }
  /* On a wide screen the sidebar is the menu, so the sheet is simply gone.
     The first attempt restyled the sheet INTO the sidebar and the result was
     the menu rendered twice, one above the other — visible in the first
     desktop screenshot. Two elements that can each be the menu is one element
     too many; the markup carries both and the width decides which exists. */
  .sheet, .sheet[hidden] { display: none; }
  nav button { border-bottom: 0; border-radius: 8px; padding: 8px 10px; min-height: 40px; }
  nav button:hover { background: var(--accent-soft); }
  nav button[aria-current="true"] { background: var(--accent-soft); color: var(--accent); }
  /* The one-line description is for the sheet, where there is room to read it
     and a reason to: on the sidebar it is thirteen lines of noise beside
     labels you already know. */
  nav button .sub { display: none; }
  nav .grp { display: block; margin-bottom: 14px; }
  nav .lbl {
    display: block; font-size: 12px; font-weight: 700; letter-spacing: 0.09em;
    text-transform: uppercase; color: var(--muted); padding: 0 10px 5px; opacity: 0.75;
  }
  nav button {
    display: block; width: 100%; text-align: left; border: 0; background: transparent;
    border-radius: 9px; padding: 8px 10px; min-height: 34px; font-size: 14px;
  }
  nav button:hover { background: var(--accent-soft); color: var(--ink); }
  nav button[aria-current="true"] {
    background: var(--accent-soft); color: var(--accent); font-weight: 600;
  }
  @media (prefers-color-scheme: dark) {
    nav button[aria-current="true"] { color: var(--accent); }
  }
  .lede { padding: 20px var(--pad) 0; }
}
@media (min-width: 760px) {
  main { grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); align-items: start; }
  .wide { grid-column: 1 / -1; }
}
.card {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow);
  /* See `main`. A card is a grid item, and a grid item that may not shrink is
     the thing that pushed the page sideways. */
  min-width: 0;
}
/* Long unbroken content — a URL, a ref, an id — wraps rather than setting the
   floor for the whole page. `anywhere` and not `break-word`: `break-word` still
   refuses to split a single very long token when it is the only thing on the
   line, which is exactly the case that overflowed. */
.card, .card * { overflow-wrap: anywhere; }
.card h2 { font-family: var(--display); font-weight: 600;
  font-size: 12px; text-transform: uppercase; letter-spacing: 0.11em;
  color: var(--muted); margin: 0 0 4px; font-weight: 600; }
/* A line under the heading saying what the card is. Injected from HINTS after
   render, so a view function does not have to carry its own documentation and
   a card added later simply has no hint rather than a stale one. */
.card .hint { color: var(--muted); font-size: 12.5px; margin: 0 0 11px;
  padding-bottom: 9px; border-bottom: 1px dashed var(--line); }
.card.collapsed .hint { display: none; }
.card h2:only-child, .card h2 + .body { margin-bottom: 0; }
.card > h2 { margin-bottom: 10px; }
.card > h2:has(+ .hint) { margin-bottom: 4px; }
/* `min(96px, 100%)` so the track floor cannot exceed the space available. A
   bare `minmax(96px, 1fr)` demands 96px per column even when the container has
   less to give, and the surplus is pushed out of the page. */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(96px, 100%), 1fr)); gap: 8px; }
/* auto-FILL, not auto-fit. With auto-fit five tiles stretch to fill a 1900px
   row and a single digit gets 300px of card to itself, which is the opposite of
   the "desktop information density" §25 asks for. */
@media (min-width: 760px) { .tiles { grid-template-columns: repeat(auto-fill, minmax(112px, 0.2fr)); } }
/* A tile is a number and its name, and the number is the content — so it gets
   real size and the label gets pushed down to micro-type. At 22px against a
   15px page the two were nearly the same thing, which is why every readout
   looked like a form. */
.tile { background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
  padding: 12px 12px 11px; }
.tile b { display: block; font-family: var(--display); font-weight: 500; font-size: 30px;
  line-height: 1.05; font-variant-numeric: tabular-nums; letter-spacing: -0.025em; }
.tile span { display: block; margin-top: 5px; color: var(--muted); font-size: 12px;
  font-family: var(--display); font-weight: 500;
  text-transform: uppercase; letter-spacing: 0.09em; line-height: 1.3; }
.tile.bad b { color: var(--bad); } .tile.warn b { color: var(--warn); }
ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
li { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--bg); }
li .row { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
li .t { font-weight: 600; }
li .m, .meta { color: var(--muted); font-size: 12.5px; }
.pill { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line);
  color: var(--muted); white-space: nowrap; }
.pill.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
.pill.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, var(--line)); }
.pill.good { color: var(--good); border-color: color-mix(in srgb, var(--good) 40%, var(--line)); }

/*
  The light. A filled dot with a soft halo, because a 8px dot alone is hard to
  find on a phone and the halo doubles the target the eye lands on.

  Colour is never the only signal: each row also carries a word. A red/green
  pair is the commonest accessibility failure in a status page, and roughly one
  man in twelve cannot tell these two apart.
*/
.lamp { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block;
  background: var(--muted); box-shadow: 0 0 0 3px color-mix(in srgb, var(--muted) 18%, transparent); }
.lamp.ok { background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 20%, transparent); }
.lamp.bad { background: var(--bad); box-shadow: 0 0 0 3px color-mix(in srgb, var(--bad) 20%, transparent); }
.lamp.warn { background: var(--warn); box-shadow: 0 0 0 3px color-mix(in srgb, var(--warn) 20%, transparent); }
.conn { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.conn:last-child { border-bottom: 0; }
.conn .who { min-width: 0; }
.conn .who b { display: block; font-weight: 600; }
.conn .who span { display: block; color: var(--muted); font-size: 12px; }
.conn .st { margin-left: auto; text-align: right; font-size: 12px; color: var(--muted);
  max-width: 46%;
  /* A flex item defaults to `min-width: auto` for the same reason a grid item
     does, and this one carries the longest prose on the page. */
  min-width: 0; }
/* On a wide card the status has room to be a sentence rather than four words a
   line, and the two columns stop fighting over the same 340px. */
@media (min-width: 760px) { .card.wide .conn .st { max-width: 62%; } }
.conn .st b { display: block; color: var(--ink); font-weight: 600; }
.stale { color: var(--warn); }

/* Configuration controls. Deliberately plain: this is a settings surface, and
   a settings surface that looks exciting is a settings surface people press by
   accident. */
/* The one real button shape, used by Save and Create. Quiet enough for a
   settings page, distinct enough not to be read as a label. */
/* `:not(.mini)`, because `.mini` is the quiet variant and the staff card uses
   it for both Save and Retire. Without the exclusion the two looked identical
   — a destructive action wearing the primary style, eight times down the page. */
.row > button:not(.mini), .addrow button {
  appearance: none; font: inherit; font-weight: 600; font-size: 13.5px; cursor: pointer;
  padding: 9px 16px; min-height: 38px; border-radius: 9px; border: 1px solid transparent;
  color: #fff; background: linear-gradient(140deg, var(--accent), var(--accent-2));
}
@media (prefers-color-scheme: dark) {
  .row > button:not(.mini), .addrow button { color: #0b0d14; }
}
.row > button:not(.mini):hover, .addrow button:hover { filter: brightness(1.06); }
/* Retire and Bring back. Outlined, and the border warms on hover — this is the
   one control on the page that stops a colleague being given work. */
.mini[data-retire] { color: var(--muted); }
.mini[data-retire]:hover { color: var(--warn);
  border-color: color-mix(in srgb, var(--warn) 55%, var(--line)); }
.mini { font-size: 12px; padding: 5px 11px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--panel); color: var(--ink); cursor: pointer; margin-left: 8px;
  text-decoration: none; display: inline-block; }
.mini:hover { border-color: var(--accent); color: var(--accent); }
.addrow { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
.addrow input, .addrow select { flex: 1 1 150px; min-width: 0; padding: 8px 10px; font: inherit;
  border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
.addrow button { flex: 0 0 auto; }
/* One setting per row, label above the control: a phone is narrow and a
   two-column settings form on a phone is a two-column settings form nobody
   fills in. */
.fld { display: block; padding: 10px 0; border-bottom: 1px solid var(--line); }
.fld:last-child { border-bottom: 0; }
.fld > span { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; }
.fld input, .fld select { width: 100%; padding: 8px 10px; font: inherit; box-sizing: border-box;
  border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
.fld em { display: block; font-style: normal; color: var(--muted); font-size: 12px; margin-top: 4px; }
/* Editable in place. The inputs are deliberately quiet until focused: eight
   people each with four boxes would otherwise be a wall of form. */
.person input, .person select, .person textarea { width: 100%; font: inherit; box-sizing: border-box;
  padding: 5px 7px; margin-top: 4px; border: 1px solid transparent; border-radius: 6px;
  background: var(--bg); color: var(--ink); resize: vertical; }
.person input:focus, .person select:focus, .person textarea:focus { border-color: var(--accent); outline: none; }
.person input.nm { font-weight: 600; }
.person .namerow { display: flex; gap: 6px; }
.person .namerow .nm { flex: 1 1 auto; }
.person .namerow select { flex: 0 0 auto; width: auto; font-size: 12px; color: var(--muted); }
.person[data-retired] { opacity: 0.5; }
.row { display: flex; gap: 10px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
.staff { display: grid; gap: 10px; }
.person { display: flex; gap: 12px; align-items: flex-start; }
.person img { width: 46px; height: 46px; border-radius: 50%; object-fit: cover;
  background: var(--bg); flex: none; }
.person .n { font-weight: 600; }
.empty { color: var(--muted); padding: 6px 2px; }
/* --- cost bars ---------------------------------------------------------
   A horizontal bar per row, drawn with a div rather than SVG. The categories
   are job kinds with long names, and a horizontal bar is the one chart shape
   where a long label needs no rotation, no truncation and no legend.

   Every bar carries its number beside it. A chart Grant has to hover to read
   is a chart that tells him nothing on a phone, and he asked for this
   "graphically as well as numerically" — as well as, not instead of. */
.bars { display: grid; gap: 7px; }
.bars .barrow { display: grid; grid-template-columns: minmax(96px, 30%) 1fr auto; gap: 10px;
  align-items: center; font-size: 12.5px; }
.bars .barlabel { color: var(--ink); overflow-wrap: anywhere; }
.bars .bartrack { background: var(--bg); border: 1px solid var(--line);
  border-radius: 5px; height: 16px; overflow: hidden; }
.bars .barfill { height: 100%; border-radius: 4px 0 0 4px;
  background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
/* A row whose value is zero still gets a visible sliver, so the row reads as
   "measured and zero" rather than as "failed to draw". */
.bars .barfill.zero { background: var(--line); }
.bars .barval { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
table.grid { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.grid th { text-align: left; color: var(--muted); font-weight: 600; padding: 4px 8px 6px 0;
  border-bottom: 1px solid var(--line); white-space: nowrap; }
table.grid td { padding: 5px 8px 5px 0; border-bottom: 1px solid var(--line);
  font-variant-numeric: tabular-nums; }
table.grid td:first-child, table.grid th:first-child { overflow-wrap: anywhere; }
.tablewrap { overflow-x: auto; }
.flab { display: block; margin-top: 8px; font-size: 12px; color: var(--ink); }
details.tools { margin-top: 8px; border: 1px solid var(--line); border-radius: 8px; }
details.tools summary { padding: 8px 10px; cursor: pointer; font-size: 12.5px;
  color: var(--muted); min-height: 38px; display: flex; align-items: center; }
details.tools[open] summary { border-bottom: 1px solid var(--line); }
.proc { padding: 10px; border-bottom: 1px solid var(--line); }
.proc:last-of-type { border-bottom: 0; }
.procname { font-size: 13px; font-weight: 600; }
/* The whole procedure, wrapped and readable. Truncating it would defeat the
   point of showing it: an unread rule is one nobody can disagree with. */
.proctext { margin: 6px 0; font-size: 12.5px; line-height: 1.5; white-space: pre-wrap; }
/* `.m` is muted by `li .m` and by nothing else, so outside a list item it
   rendered at full body size and full ink — the when-to-use line read as a
   second heading under the name. Scoped here rather than by widening the
   global rule, which would restyle every card on the page. */
.proc .m { color: var(--muted); font-size: 12.5px; }
.toolbody { padding: 8px 10px 10px; display: grid; gap: 10px; }
.toolgroup { display: grid; gap: 2px; }
label.tool { display: flex; gap: 8px; align-items: center; min-height: 38px;
  font-size: 12.5px; cursor: pointer; }
/* Disabled rows stay legible. Greying a row to the point of unreadability
   hides the reason it is greyed, which is the only useful thing about it. */
label.tool.off { color: var(--muted); cursor: not-allowed; }
label.tool input { width: 17px; height: 17px; flex: none; }
/* Talk: a text field that is always there, and a microphone beside it where
   the browser has one. 16px on the input is not a style choice — anything
   smaller makes iOS Safari zoom the whole page on focus, which on a phone
   reads as the layout breaking the moment you tap the box. */
.askform { display: flex; gap: 8px; align-items: stretch; }
.askform input { flex: 1; min-width: 0; font-size: 16px; min-height: 44px;
  border: 1px solid var(--line); border-radius: 10px; background: var(--bg);
  color: var(--ink); padding: 0 12px; }
.askform button { min-height: 44px; flex: none; }
.askform .mic { width: 48px; padding: 0; font-size: 18px; }
.askform .mic.on { background: var(--accent); color: #fff; border-color: transparent; }
/* One Google service per row: what it is, what it gives them, one button. */
.gsvc { border-top: 1px solid var(--line); padding: 11px 0; display: grid; gap: 4px; }
.gsvc:first-of-type { border-top: 0; }
.gsvc-t { display: flex; align-items: center; gap: 8px; }
.gsvc .go { justify-self: start; margin-top: 4px; }
.gsvc .go.again { background: none; color: var(--muted); border: 1px solid var(--line); }
.gsvc .ok { font-family: var(--display); font-size: 12px; font-weight: 600; letter-spacing: 0.09em;
  text-transform: uppercase; color: var(--good);
  background: color-mix(in srgb, var(--good) 13%, transparent);
  border-radius: 999px; padding: 3px 9px; }
/* Which bot speaks as a person: a picker, not a label. */
.botpick { display: inline-flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.botpick select { font-size: 12.5px; min-height: 34px; max-width: 220px; }
.est { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: 0.05em;
  color: var(--warn); border: 1px solid color-mix(in srgb, var(--warn) 45%, var(--line));
  border-radius: 5px; padding: 1px 6px; margin-left: 6px; vertical-align: 1px; }
/* --- Set up and Help ----------------------------------------------------
   A checklist reads top to bottom, so a service is a row with one lamp, one
   sentence and at most one action — never a card, which invites scanning. */
.svcs { display: grid; gap: 2px; margin-top: 12px; }
.svc { display: flex; gap: 12px; align-items: flex-start; padding: 14px 0;
  border-bottom: 1px solid var(--line); }
.svc:last-child { border-bottom: 0; }
.svc > .lamp { margin-top: 6px; }
.svc-body { min-width: 0; flex: 1; }
.svc-body b { font-size: 15px; }
.svc-body .m { margin-top: 3px; }
.svc .go { flex: none; align-self: center; white-space: nowrap; }
a.mini.go { border-color: color-mix(in srgb, var(--accent) 45%, var(--line));
  color: var(--accent); font-weight: 600; }
/* The one-off Google registration, boxed so it reads as a detour rather than
   as part of the row. */
.stepbox { margin-top: 10px; padding: 12px; border: 1px solid var(--line);
  border-radius: 10px; background: var(--panel-2); }
.stepbox details { margin-bottom: 8px; }
.stepbox summary { cursor: pointer; font-weight: 600; font-size: 13.5px; min-height: 24px; }
.stepbox ol { margin: 8px 0; padding-left: 20px; }
.stepbox li { border: 0; padding: 2px 0; background: none; }
.stepbox input { width: 100%; padding: 8px 10px; font: inherit; box-sizing: border-box;
  border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
.steps { margin: 6px 0 0; padding-left: 22px; display: grid; gap: 7px; }
.steps li { border: 0; padding: 0; background: none; }
details.qa { border-bottom: 1px solid var(--line); padding: 4px 0; }
details.qa:last-child { border-bottom: 0; }
details.qa summary { cursor: pointer; font-weight: 600; padding: 9px 0; min-height: 30px; }
details.qa p { color: var(--muted); font-size: 13.5px; margin: 0 0 10px; max-width: 72ch; }

/* --- What Claude is building -------------------------------------------
   A step is a line and, where the work was visual, a picture. The picture is
   the point: §14A's loop produces screenshots and they are the only honest
   report of visual work, so they get real size rather than a thumbnail beside
   a paragraph. */
.nowcard { border-left: 3px solid var(--accent); }
.nowline { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 15.5px; }
.pulse { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); flex: none;
  animation: breathing 2s ease-in-out infinite; }
@keyframes breathing {
  0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 50%, transparent); }
  50% { box-shadow: 0 0 0 7px color-mix(in srgb, var(--accent) 0%, transparent); }
}
@media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
.towards { font-family: var(--display); font-size: 12px; font-weight: 600;
  letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent);
  background: var(--accent-soft); border-radius: 5px; padding: 2px 7px; }
.bstep { border-top: 1px solid var(--line); padding: 14px 0; }
.bstep:first-child { border-top: 0; padding-top: 2px; }
.bmeta { display: flex; align-items: flex-start; gap: 11px; }
.bmeta > .lamp { margin-top: 6px; }
.bwho { min-width: 0; flex: 1; display: grid; gap: 3px; }
.bwho b { font-size: 14.5px; }
.bwho .towards { justify-self: start; }
.produced { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.bwhen { flex: none; white-space: nowrap; font-size: 12.5px; }
/* Wide, because a 200px thumbnail of a dashboard tells you nothing. */
.bshot { display: block; margin-top: 11px; border: 1px solid var(--line);
  border-radius: 10px; overflow: hidden; background: var(--panel-2); }
.bshot img { display: block; width: 100%; height: auto; }

/* --- Talk to team -------------------------------------------------------
   A big target and an obvious state. The microphone button is the one control
   on this page pressed while looking at something else, so it says what it is
   doing in a word and in a colour, and the words appear underneath either way
   — a browser that will not speak still shows every reply. */
/* Grant: *"i dont need to see the text .. just the voice is fine"*. So the
   call IS the page: one large target, one line of state, and the transcript
   gone. Typing stays behind a disclosure because it is the only way through
   when a microphone is refused, and a page that offers no way through is worse
   than one with a link on it. */
.callstage { display: grid; justify-items: center; gap: 18px; text-align: center;
  padding: 26px 0 8px; }
.callstage .talkstate { max-width: 34ch; font-size: 15px; }
.typeinstead { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 12px; }
.typeinstead > summary { cursor: pointer; color: var(--muted); font-size: 13px;
  min-height: 34px; display: flex; align-items: center; }
.typeinstead .askform { margin-top: 8px; }
.talkwrap { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 4px; }
.mic {
  appearance: none; border: 0; cursor: pointer; font: inherit; font-weight: 600;
  font-size: 16px; color: #fff; min-width: 116px; min-height: 116px;
  border-radius: 50%; flex: none;
  background: linear-gradient(140deg, var(--accent), var(--accent-2));
  box-shadow: 0 8px 26px -10px color-mix(in srgb, var(--accent) 80%, transparent);
  transition: transform 0.12s;
}
@media (prefers-color-scheme: dark) { .mic { color: #0b0d14; } }
.mic:hover { transform: scale(1.02); }
.mic.on {
  background: linear-gradient(140deg, var(--bad), var(--warn));
  animation: listening 1.4s ease-in-out infinite;
}
@keyframes listening {
  0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--bad) 45%, transparent); }
  50% { box-shadow: 0 0 0 16px color-mix(in srgb, var(--bad) 0%, transparent); }
}
@media (prefers-reduced-motion: reduce) { .mic.on { animation: none; } }
.talkstate { color: var(--muted); font-size: 13.5px; min-width: 0; flex: 1 1 200px; }
.turns { display: grid; gap: 8px; margin-top: 14px; }
/* Newest first: the last thing said is the thing being read. */
.turn { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
  background: var(--bg); }
.turn b { display: block; font-size: 12px; text-transform: uppercase;
  letter-spacing: 0.06em; color: var(--muted); margin-bottom: 3px; }
.turn.delegated { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.turn.bad { border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.turn.bad span { color: var(--bad); }

/* ---------------------------------------------------------------------------
   A project, as a picture.

   Grant sketched a node diagram: the project at the centre, its services
   radiating out with lines between. Drawn as SVG that needs layout arithmetic,
   and needs it again at every width, and at 390px a radial diagram is four
   labels overlapping a circle.

   So the geometry is CSS. The hub is a block, the services are a grid, and the
   connecting lines are borders on the service rows. It reads as a node diagram
   at every width, reflows rather than rescaling, keeps the text as real text,
   and has no arithmetic to get wrong.

   Phone: services stack under the hub, wires run down.
   760px and up: services sit beside the hub, wires run across — his sketch.
--------------------------------------------------------------------------- */
.graph { display: grid; gap: 10px; }
.hub {
  border: 1px solid var(--accent); border-radius: 12px; padding: 11px 13px;
  background: var(--accent-soft); display: grid; gap: 2px; align-content: center;
}
.hub b { font-size: 15px; letter-spacing: -0.01em; }
.hub span { color: var(--muted); font-size: 12.5px; }
.nodes { display: grid; gap: 8px; }

.node {
  position: relative; display: flex; align-items: center; gap: 10px;
  border: 1px solid var(--line); border-radius: 11px; padding: 9px 11px;
  background: var(--panel-2); min-width: 0;
}
/* The wire. A short run of border from the hub's edge to the node, solid when
   something is attached and dashed when nothing is — one more channel carrying
   the same fact as the lamp colour, because §2 asks for connected and
   disconnected to be visually obvious and roughly one man in twelve cannot
   separate the red from the green. */
.node .wire {
  position: absolute; left: 22px; top: -9px; height: 9px; width: 0;
  border-left: 2px solid var(--line);
}
.node .badge {
  flex: none; width: 30px; height: 30px; border-radius: 9px; display: grid;
  place-items: center; border: 1px solid var(--line); background: var(--panel);
  color: var(--muted);
}
.mk { width: 17px; height: 17px; display: block; }
.nlabel { min-width: 0; flex: 1; display: grid; gap: 1px; }
.nlabel b { font-weight: 600; font-size: 14px; }
.nlabel span { color: var(--muted); font-size: 12.5px; }

/* State, on the badge and the wire together. */
.n-connected .badge { color: var(--good); border-color: color-mix(in srgb, var(--good) 45%, var(--line)); }
.n-connected .wire  { border-left-color: var(--good); }
.n-broken .badge    { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 50%, var(--line)); }
.n-broken .wire     { border-left-color: var(--bad); }
.n-broken           { border-color: color-mix(in srgb, var(--bad) 35%, var(--line)); }
.n-wanted .badge    { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); }
.n-wanted .wire     { border-left-style: dashed; border-left-color: var(--warn); }
.n-missing .wire, .n-declined .wire { border-left-style: dashed; }
.n-missing .badge, .n-declined .badge { opacity: 0.7; }
/* Declined is a decision, not a gap. It recedes rather than nagging. */
.n-declined { opacity: 0.62; }

@media (min-width: 760px) {
  /* The hub beside its services, which is the shape he drew. */
  .proj .graph { grid-template-columns: minmax(0, 0.9fr) minmax(0, 2fr); gap: 0 26px; align-items: center; }
  .proj .nodes { gap: 9px; }
  .proj .node .wire {
    left: -26px; top: 50%; height: 0; width: 26px;
    border-left: 0; border-top: 2px solid var(--line);
  }
  .proj .n-connected .wire { border-top-color: var(--good); }
  .proj .n-broken .wire    { border-top-color: var(--bad); }
  .proj .n-wanted .wire    { border-top-style: dashed; border-top-color: var(--warn); }
  .proj .n-missing .wire, .proj .n-declined .wire { border-top-style: dashed; }
}

/* Everything you do occasionally and read never. §5's progressive disclosure:
   the picture is the important information, and this is the rest. */
details.more { margin-top: 12px; border-top: 1px dashed var(--line); padding-top: 10px; }
details.more > summary {
  cursor: pointer; color: var(--muted); font-size: 13px; list-style: none;
  padding: 4px 0; min-height: 32px; display: flex; align-items: center;
}
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::before { content: '▸ '; margin-right: 6px; }
details.more[open] > summary::before { content: '▾ '; }
.lbl { color: var(--muted); font-size: 12px; margin-right: 6px; }

/* ---------------------------------------------------------------------------
   The touch floor.

   Grant: *"poorly adapted to mobile"* — and the specific, measurable half of
   that complaint is that you cannot reliably hit the controls. Measured on an
   iPhone 14 before this block existed:

       Rename            69 x 26     Detach            62 x 26
       Switch on / off   55 x 36     Connect Google   126 x 30
       Pronoun picker    89 x 35

   44px is the floor every platform's guidance agrees on, and every one of those
   was under it. The page had exactly two controls that already met it — the ask
   box and its microphone — because those were the two somebody had used on a
   phone and noticed.

   Keyed on the POINTER, not the width, and it took two corrections to get here.

   The first version used `max-width: 759px`, on the argument that a narrow
   laptop window deserves the same generous controls. `verify:ui` then failed
   the iPad — 810px wide, no mouse, still being handed 26px buttons. So the
   second version asked about width OR a coarse pointer, and `verify:hq` failed
   that one for a different reason: this stylesheet is mobile-first by
   invariant, the desktop rules are the additions inside `min-width` blocks, and
   a `max-width` query is the thing that quietly turns that inside out.

   Both checks were right, and between them they name the correct rule. A touch
   target is about the THUMB, which is what `pointer: coarse` asks about — it
   catches the phone and the tablet at any width, and it leaves a narrow
   mouse-driven window alone, which never needed 44px in the first place. The
   width was always a proxy for the question, and a worse one.

   `inline-flex` on the small buttons because `min-height` on an `inline-block`
   grows the box and leaves the label sitting at the top of it.
--------------------------------------------------------------------------- */
@media (pointer: coarse) {
  .mini {
    min-height: 44px; padding: 5px 14px;
    display: inline-flex; align-items: center; justify-content: center;
  }
  /* Every control in the content area, named by what it IS rather than by
     which card it happens to sit in. The first pass enumerated selectors —
     `.row > button`, `.addrow input`, `.fld select` — and `verify:ui` promptly
     found four more it had missed (two Save buttons, the routing rows, the
     sheet's own menu). Enumerating is how you keep missing one. Checkboxes and
     radios are excluded: they carry their own 17px box and their label is the
     target. */
  main button, main select, main textarea,
  main input:not([type="checkbox"]):not([type="radio"]),
  .sheet nav button {
    /* `!important` on purpose, and only here.

       This is a floor, and a floor that loses a specificity argument is not a
       floor. Every rule it overrides is an earlier, narrower opinion about how
       tall one particular button should be — `.row > button:not(.mini)` at
       38px, `.botpick select` at 34px — written before anybody measured the
       page on a phone. Each is more specific than any sane selector that could
       express "every control, everywhere", so without this the block silently
       loses to six of them and `verify:ui` fails on exactly those six.

       The alternative is to out-specify each one by hand, which is how the
       first two passes of this block missed four controls each time. */
    min-height: 44px !important;
  }
  /* The staff card packs four fields per person; a 44px row needs the padding
     to match or the text sits against the top edge. */
  .person input, .person select, .person textarea { padding: 10px 9px; }
  /* A select that is 44px tall and 12.5px inside looks like a mistake. */
  .botpick select { font-size: 14px; }
  /* The floor above names buttons, selects, textareas and inputs — an anchor is
     none of those, so "open chat" sat at 68x24 next to a 44px picker. It was
     invisible to `verify:ui` for a different reason: that check fed the staff
     tab the wrong payload entirely, so the bot picker never rendered at all.
     Only the standalone action links, never a link inside a sentence. */
  .botpick a, .proc .row > a { display: inline-flex; align-items: center;
    min-height: 44px !important; padding: 0 8px; }
}

.gate { max-width: 420px; margin: 12vh auto; padding: 0 var(--pad); }
.gate input { width: 100%; padding: 12px; font: inherit; border-radius: 10px;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
.gate button { width: 100%; margin-top: 10px; padding: 12px; font: inherit; font-weight: 600;
  border-radius: 10px; border: 0; min-height: 46px; cursor: pointer; color: #fff;
  background: linear-gradient(140deg, var(--accent), var(--accent-2));
  box-shadow: 0 4px 14px -6px color-mix(in srgb, var(--accent) 70%, transparent); }
@media (prefers-color-scheme: dark) { .gate button { color: #0b0d14; } }
.err { color: var(--bad); font-size: 13px; margin-top: 10px; }
/* A measure, because a 1440px window was setting this in one 200-character
   line. Prose has a comfortable width and it is not the width of the monitor —
   the same reason `.lede p` is capped. */
footer { color: var(--muted); font-size: 12.5px; line-height: 1.6;
  padding: 10px var(--pad) 30px; max-width: 76ch; }

/* --- charts ------------------------------------------------------------
   A sparkline, not a chart with axes: the tile's big number IS the last
   value's direct label, so the line only has to carry shape. That also
   sidesteps an end-marker, which at this height could not meet the 8px
   minimum without dominating the plot.
   One series, so no legend — the heading names it.                        */
.spark { display: block; width: 100%; height: 44px; overflow: visible; touch-action: pan-y; }
.spark path.line { fill: none; stroke: var(--series); stroke-width: 2;
  stroke-linejoin: round; stroke-linecap: round; }
.spark path.area { fill: color-mix(in srgb, var(--series) 14%, transparent); stroke: none; }
.spark .cross { stroke: var(--muted); stroke-width: 1; opacity: 0; }
.spark .dot { fill: var(--series); stroke: var(--panel); stroke-width: 2; opacity: 0; }
.spark.on .cross, .spark.on .dot { opacity: 1; }
.sparkwrap { position: relative; }
.tip { position: absolute; pointer-events: none; opacity: 0; transform: translate(-50%, -120%);
  background: var(--ink); color: var(--panel); font-size: 12px; padding: 4px 8px;
  border-radius: 7px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.tip.on { opacity: 1; }
.chartrow { display: flex; align-items: baseline; gap: 8px; margin-bottom: 2px; }
.chartrow b { font-family: var(--display); font-weight: 500; font-size: 30px;
  letter-spacing: -0.025em; font-variant-numeric: tabular-nums; }
.chartrow span { color: var(--muted); font-size: 12.5px; }
details.values { margin-top: 8px; }
details.values summary { color: var(--muted); font-size: 12px; cursor: pointer; min-height: 24px; }
details.values table { width: 100%; border-collapse: collapse; margin-top: 6px; font-size: 12.5px; }
details.values td { padding: 2px 0; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
details.values td:last-child { text-align: right; }
.card > .drag { float: right; color: var(--muted); cursor: grab; font-size: 15px; line-height: 1;
  padding: 0 2px; user-select: none; }
.card.collapsed .body { display: none; }
.card h2 { cursor: pointer; user-select: none; }
</style>
</head>
<body>
<div id="app"></div>

<script>
/*
  One page, no framework, no build step.
  §2's first principle is "frontend simplicity, backend sophistication", and the
  whole of the interesting work here happens in Postgres. A build pipeline for
  four fetches and some DOM would be the tail wagging the dog — and it would put
  a toolchain between a bug and its fix.

  The API is named once, here, and the token lives only in localStorage on the
  device. Nothing is cached: every view is what the database says right now,
  because a dashboard showing yesterday's blockers is worse than one that is
  briefly blank.
*/
const API = window.HQ_API || 'https://baujwlzcziasnfhhkchg.supabase.co/functions/v1/hq-api'
const KEY = 'hq.token'
const app = document.getElementById('app')

const esc = (v) => String(v ?? '').replace(/[&<>"]/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])

const ago = (iso) => {
  if (!iso) return '—'
  const mins = Math.round((Date.now() - new Date(iso).getTime()) / 60000)
  if (mins < 1) return 'just now'
  if (mins < 60) return mins + 'm ago'
  const h = Math.round(mins / 60)
  if (h < 24) return h + 'h ago'
  return Math.round(h / 24) + 'd ago'
}

/*
  A tab is not a section. "Trends" is what the tab says and `series` is what the
  API calls it, and the first version passed the tab name straight through and
  got a 400 on every load of that tab — caught by screenshotting the page and
  reading the console, which is the step the method calls "render it and look at
  it" and the step that is easiest to skip.
*/
const SECTION_FOR = { overview: 'overview', trends: 'series', staff: 'team', activity: 'activity', usage: 'usage', connections: 'connections', projects: 'projects', output: 'artifacts', settings: 'settings', routing: 'routing' }

/* Configuration. The only writing this page does — see the endpoint's comment
   on why configuring is allowed where acting is not. */
async function act(action, args) {
  const token = localStorage.getItem(KEY) || ''
  const r = await fetch(API, {
    method: 'POST',
    headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
    body: JSON.stringify({ action, args }),
  })
  const body = await r.json().catch(() => ({}))
  if (!r.ok) throw new Error(body.error || ('The server returned ' + r.status))
  if (body.result && body.result.error) throw new Error(body.result.error)
  return body.result
}

async function load(tab) {
  const section = SECTION_FOR[tab] ?? tab
  const token = localStorage.getItem(KEY) || ''
  const r = await fetch(API + '?section=' + encodeURIComponent(section), {
    headers: { Authorization: 'Bearer ' + token },
  })
  if (r.status === 401) { localStorage.removeItem(KEY); gate('That token was not accepted.'); throw new Error('unauthorized') }
  if (!r.ok) throw new Error('The server returned ' + r.status)
  return (await r.json()).data
}

function gate(message) {
  app.innerHTML = `
    <div class="gate">
      <span class="mark" style="width:44px;height:44px;border-radius:13px;font-size:21px;margin-bottom:14px">◆</span>
      <h1 style="font-size:24px;margin:0 0 5px;letter-spacing:-0.02em">Team HQ</h1>
      <p class="meta" style="margin:0 0 18px">Eight people, one queue. This device needs the password once —
        it is kept on this device and never sent anywhere but here.</p>
      <input id="tok" type="password" autocomplete="current-password" placeholder="Password" enterkeyhint="go">
      <button id="go">Unlock</button>
      ${message ? `<div class="err">${esc(message)}</div>` : ''}
    </div>`
  const input = document.getElementById('tok')
  const err = document.querySelector('.gate .err')
  /*
    An empty press must say something.

    It used to `return` in silence: you pressed Unlock, nothing happened, and
    there was no way to tell a page that had not registered the press from one
    that had rejected you. Found by the control audit, which is the only check
    that presses things — every screenshot of this gate looked correct.
  */
  const submit = () => {
    if (!input.value.trim()) {
      const say = err || Object.assign(document.createElement('div'), { className: 'err' })
      say.textContent = 'Type the password first.'
      if (!say.parentNode) document.querySelector('.gate').appendChild(say)
      input.focus()
      return
    }
    localStorage.setItem(KEY, input.value.trim())
    start()
  }
  document.getElementById('go').onclick = submit
  input.onkeydown = (e) => { if (e.key === 'Enter') submit() }
  input.focus()
}

/*
  Five groups, and the grouping is the explanation.

  Nine equal pills made every tab look equally likely to hold the answer, so
  finding anything meant remembering where it was. Grouped, the question
  answers itself: "is the team working?" is under WORK, "why did it stop?" is
  under HEALTH, and the two tabs that can change something are the only two
  under SET UP — which is also a safety property, not just tidiness.
*/
const MENU = [
  // Grant: *"have the most complicated things at the end, have the simplest
  // things at the first, just like current active projects"* and *"put
  // everything in plain English, there's far too much weird nomenclature."*
  //
  // So the order is how often you need it, not how the system is built, and
  // every label is a thing a person would say. "Output" became "Work they
  // finished"; "Connections" became "Connected services". The old names were
  // shorter and told you nothing until you had already clicked them.
  ['Your day', [
    ['overview', 'Today'],
    ['projects', 'Projects'],
    ['talk', 'Talk to the team'],
    ['build', 'What Claude is building'],
  ]],
  ['What the team did', [
    ['output', 'Work they finished'],
    ['activity', 'Everything that happened'],
    ['staff', 'Who is on the team'],
  ]],
  ['Is it all working', [
    ['connections', 'Connected services'],
    ['cost', 'What it costs'],
    ['usage', 'How much is being used'],
    ['trends', 'Trends over time'],
  ]],
  // Last, deliberately. These are the pages you need once and then rarely, and
  // putting them first made the whole thing feel like a configuration screen.
  ['Setting up', [
    ['setup', 'Set up'],
    ['help', 'Help — what all this is'],
    ['routing', 'Who messages you, and where'],
    ['settings', 'Advanced settings'],
  ]],
]
const TABS = MENU.flatMap(([, items]) => items)

/*
  What each tab is, and what to do on it.

  `todo` is the half a dashboard usually omits. Most of these tabs cannot be
  acted on from here at all, and saying so plainly is more useful than leaving
  him to discover it by pressing things — the actions live in Slack and
  Telegram by design (§12), and the two places that DO write say which.
*/
const GUIDE = {
  setup: {
    title: 'Set up',
    one: 'The one next thing to do for each service',
    what: 'Every outside service this depends on, whether it is working, and the one thing to do next for each.',
    todo: 'Work down the amber rows. Everything green needs nothing from you. A row marked "off" is switched off on purpose, not broken.',
  },
  help: {
    title: 'Help — what all this is',
    one: 'What this is, how it fits together, how to set it up',
    what: 'What this is, how the pieces fit together, and how to set it up from nothing.',
    todo: 'Read the first section if you are new. The rest is reference — come back to it when something surprises you.',
  },
  cost: {
    title: 'What it costs',
    one: 'What each kind of work costs to produce',
    what: 'What each kind of work costs to produce: what was actually charged, and what the same work would have cost on a paid model.',
    todo: 'Read the two columns as two different things. Spent is real money and is currently zero because every model here is free. Modelled is what it would cost if it were not — that is the number to look at before turning anything paid on.',
  },
  build: {
    title: 'What Claude is building',
    blurb:
      'The work in progress on the system itself — the step being worked on now, ' +
      'what it is for, and a picture where the work was visual.',
    todo:
      'Nothing to do here. It is a window, not a control: open it to see whether ' +
      'anything is happening and what it looks like so far, instead of opening a ' +
      'terminal. A step marked blocked is waiting on you and will also reach you ' +
      'on Telegram.',
  },
  talk: {
    title: 'Talk to the team',
    one: 'Call your chief of staff, or type it instead',
    what: 'Press the phone and you are on a real call with Claire, your chief of staff. She hears you the whole time, so you can cut in mid-sentence, and she can put work to the rest of the team while you are still on the line. Questions about what is going on she answers there and then; real work goes into the same queue as anything else.',
    todo: 'Press the phone and start talking — the browser will ask for the microphone once. Every word, yours and hers, is written down underneath as you go, so you can see what she heard. If you would rather not talk, or you are somewhere quiet, type in the box and press Send: that works on every device. The call costs a few pence a minute; typing is free.',
  },
  overview: {
    title: 'Today',
    one: 'What is happening right now and what is waiting on you',
    what: 'Everything waiting on you, everything the team has in hand right now, and the shape of the day so far.',

  },
  activity: {
    title: 'Everything that happened',
    one: 'The running record of what was done and said',
    what: 'The last few hundred things that happened, newest first: work finished, messages sent, decisions taken.',
    todo: 'Nothing to do here. It is the record — use it to answer "when did that happen, and what did it say".',
  },
  projects: {
    title: 'Projects',
    one: 'What you are working on, and what each is wired up to',
    // Two short lines where there were five. §5: *"overloaded; text-heavy."*
    // The picture below now says what the paragraph used to, and a paragraph
    // that restates the diagram beneath it is the diagram not being trusted.
    // What is worth saying once is what the lines MEAN, because that is the
    // only part of a drawing a reader cannot work out by looking.
    what: 'What you are working on, and what each project is wired up to.',
    todo: 'Solid lines are connected, dashed are not. “Not now” stops it asking about one you do not want.',
  },
  output: {
    title: 'Work they finished',
    one: 'Finished pieces of work, newest first',
    what: 'What the team has produced — audio overviews, briefings, documents — with a link to each.',
    todo: 'Open anything that looks finished. If something you asked for is missing, it either failed or is still waiting on approval; Today will say which.',
  },
  staff: {
    title: 'Who is on the team',
    one: 'Names, roles, skills and what each person may touch',
    what: 'The eight of them: what each is for, how they write, and which Telegram bot reaches them.',
    todo: 'Names, pronouns and remits are editable here and take effect immediately — including in how they sign their messages. Retiring someone stops them being given work; it does not delete what they have already done.',
  },
  trends: {
    title: 'Trends over time',
    one: 'The last thirty days as a shape rather than a number',
    what: 'The same handful of numbers over time: work done, work refused, how long things took.',
    todo: 'Nothing to do here. Look at the shape rather than the last point — one bad day is noise, a fortnight leaning the wrong way is not.',
  },
  usage: {
    title: 'How much is being used',
    one: 'Model calls, voice minutes, queue depth and limits',
    what: 'Which models did the work, what each cost, and whether messages actually arrived.',
    todo: 'Nothing to do here, unless delivery is failing — a message that never landed is the one failure that looks like silence rather than an error.',
  },
  connections: {
    title: 'Connected services',
    one: 'Every outside service and whether it is answering',
    what: 'Every outside service this depends on — Google, Notion, Slack, Telegram, the model providers — and whether it answered when last asked.',
    todo: 'A red light is the first thing to fix: everything downstream of it will fail in ways that look like something else. Each row says when it was last checked, so a stale green is not a green.',
  },
  routing: {
    title: 'Who messages you, and where',
    one: 'Turn the noise up or down without asking me',

    todo: 'If the team is talking too much, raise the bar for what reaches your phone — everything below it still appears in Slack, so nothing is lost, it just stops buzzing. Switching a job off stops the WORK, not only the message, so each one says what it does.',
  },
  settings: {
    title: 'Advanced settings',
    one: 'The knobs. Safe to ignore unless something needs changing',
    what: 'Where things should live, what the notebook allowance has left, and the Google connection.',
    todo: 'This page, Projects and Talk are the only three that write anything. Facts about the database are shown but not editable — a box that looks like it moves a database and does not is worse than no box.',
  },
}

/*
  One line per card, keyed by its heading.

  Keyed by the HEADING rather than by `data-card`, because not every card has
  the latter and a card without a hint should simply have no hint — never a
  hint belonging to something else.
*/
const HINTS = {
  'at a glance': 'Counts for today. A number in red or amber is asking for attention; the rest is background.',
  'needs you': 'Work that has stopped and cannot restart until you decide something. Answer these in Slack or Telegram.',
  'projects': 'Where work is currently being filed. The current project is the one new instructions land in.',
  'in flight': 'Being worked on right now, and which stage each has reached.',
  'next 24 hours': 'Your diary, cached hourly so the team can answer questions about it without a round trip — and still answer them when Google is unreachable.',
  'recent activity': 'Newest first. Every line is something that actually happened, not a summary of it.',
  'the team': 'Edit a name, a remit or a way of writing and it takes effect on the next message they send.',
  'free models': 'Which models did the work. Free ones are used first, and a paid one appears here only when nothing free could do the job.',
  'message delivery': 'Whether messages reached Slack and Telegram. An undelivered message is the failure that looks like silence.',
  'connections': 'Green means it answered when last asked. The time matters as much as the colour — a stale green is not a green.',
  'output': 'Finished work, with a link to each piece. Anything you asked for that is not here either failed or is still waiting for your approval.',
  'notebook allowance': 'Our own count of what we have spent in Google NotebookLM. Google publishes no usage API, so this is an estimate that corrects itself when they refuse us.',
  'google': 'Four steps, once. Calendar and Drive need an OAuth client from your own Google Cloud project.',
  'this database': 'Facts about the database this page is talking to. Read-only on purpose.',
  'where things should live': 'Declared intent, not live state. Changing one tells the next run where to look.',
  'new project': 'Everything filed afterwards goes to whichever project is current.',
}

function shell(active) {
  /*
    One markup, two shapes.

    On a phone the nav lives inside a sheet that is closed until you press the
    button saying where you are. On a desktop the same nav is the sidebar and
    the sheet has no styling left — see the media query, which un-fixes it
    rather than duplicating the markup. Two copies of a menu is two menus that
    eventually disagree about what is on them.
  */
  const nav = MENU.map(([group, items]) => `
    <div class="grp"><span class="lbl">${esc(group)}</span>${items.map(([k, label]) => `
      <button data-tab="${k}" aria-current="${k === active}">${esc(label)}
        <span class="sub">${esc((GUIDE[k] || {}).one || '')}</span>
      </button>`).join('')}</div>`).join('')

  app.innerHTML = `
    <header>
      <span class="mark" aria-hidden="true">◆</span>
      <span class="brand"><h1>Team HQ</h1><span>Eight people, one queue</span></span>
      <span id="stamp"></span>
    </header>
    <div class="menubar">
      <button class="menubtn" id="menubtn" aria-expanded="false" aria-controls="sheet">
        <span class="bars" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="where" id="where">${esc(labelFor(active))}</span>
        <span class="caret" aria-hidden="true">▾</span>
      </button>
    </div>
    <div class="sheet" id="sheet" hidden>
      <div class="sheetinner">
        <div class="sheetgrip" aria-hidden="true"></div>
        <div class="rail"><nav>${nav}</nav></div>
      </div>
    </div>
    <div class="frame">
      <div class="rail" id="rail-desktop"><nav>${nav}</nav></div>
      <div>
        <div id="lede" class="lede"></div>
        <main id="main"><div class="empty">Loading…</div></main>
        <footer>Set up, Talk to the team, Projects, Who is on the team and Advanced
          settings are the places this page changes anything. Everything else is a
          read-out. The buttons — approve, undo, go ahead — live in Slack and Telegram,
          where you are when you need them.</footer>
      </div>
    </div>`

  const sheet = document.getElementById('sheet')
  const btn = document.getElementById('menubtn')
  const setOpen = (open) => {
    // `hidden`, not `style.display`: the sheet's display value differs between
    // phone and desktop, and setting it inline would win over the media query
    // and strand the sidebar closed on a wide screen.
    sheet.hidden = !open
    btn.setAttribute('aria-expanded', String(open))
  }
  btn.onclick = () => setOpen(sheet.hidden)
  // Tapping the dimmed area closes it. Tapping the sheet itself must not —
  // hence the target check rather than a handler on the backdrop alone.
  sheet.onclick = (e) => {
    if (e.target === sheet) setOpen(false)
  }
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') setOpen(false)
  })

  for (const b of document.querySelectorAll('nav button')) {
    b.onclick = () => {
      setOpen(false)
      show(b.dataset.tab)
    }
  }
}

/** The menu label for a tab, for the button that says where you are. */
function labelFor(tab) {
  for (const [, items] of MENU) {
    for (const [k, label] of items) if (k === tab) return label
  }
  return 'Menu'
}

/* --- the four views ---------------------------------------------------- */

function overview(d) {
  const c = d.counts
  const tile = (n, label, cls = '') =>
    `<div class="tile ${cls}"><b>${n}</b><span>${label}</span></div>`
  const needs = d.needs_me.map((b) => `
    <li>
      <div class="row">
        <span class="t">${esc(b.requested_action)}</span>
        ${b.overdue ? '<span class="pill bad">overdue</span>' : ''}
        ${b.work_can_continue ? '' : '<span class="pill warn">work stopped</span>'}
      </div>
      <div class="m">${esc(b.why_needed)}</div>
      ${b.consequences_of_delay ? `<div class="m">If it waits: ${esc(b.consequences_of_delay)}</div>` : ''}
    </li>`).join('')

  /*
    The diary, when it is connected.

    Nothing at all when Google has not been set up — an empty card headed
    "Calendar" on a page where the calendar does not exist is a card that reads
    as broken. The Connections tab is where "not connected" belongs, and it
    already says which of the four steps is next.

    The age is shown whenever it is over an hour, for the same reason the spoken
    answer says it: this is a cache that keeps working when Google is
    unreachable (§18), and a stale diary presented as a current one is worse
    than no diary.
  */
  const cal = d.calendar || {}
  const calendar =
    cal.enabled !== true || cal.as_of == null
      ? ''
      : `<section class="card" data-card="calendar"><span class="drag" title="Move up">⌃</span>
          <h2>Next 24 hours${
            Date.now() - new Date(cal.as_of).getTime() > 3600_000
              ? `<span class="est">AS OF ${esc(ago(cal.as_of).toUpperCase())}</span>`
              : ''
          }</h2>
          <div class="body">${
            (cal.events || []).length === 0
              ? '<div class="empty">Nothing in the diary.</div>'
              : `<ul>${(cal.events || [])
                  .map(
                    (e) => `<li><div class="row">
                      <span class="t">${esc(e.summary || 'Untitled')}</span>
                      <span class="m">${
                        e.all_day
                          ? 'all day'
                          : esc(
                              new Date(e.starts_at).toLocaleTimeString([], {
                                hour: '2-digit',
                                minute: '2-digit',
                              }),
                            )
                      }</span>
                      ${e.status === 'tentative' ? '<span class="pill warn">tentative</span>' : ''}
                    </div>
                    ${
                      e.location || e.attendees
                        ? `<div class="m">${[
                            e.attendees ? e.attendees + ' ' + (e.attendees === 1 ? 'person' : 'people') : '',
                            esc(e.location || ''),
                          ]
                            .filter(Boolean)
                            .join(' · ')}</div>`
                        : ''
                    }</li>`,
                  )
                  .join('')}</ul>`
          }</div>
        </section>`

  const jobs = d.today.map((j) => `
    <li>
      <div class="row">
        <span class="t">${esc(j.kind)}</span>
        <span class="pill">${esc(j.state)}</span>
        ${j.project_name ? `<span class="m">${esc(j.project_name)}</span>` : ''}
      </div>
      ${j.state_reason ? `<div class="m">${esc(j.state_reason)}</div>` : ''}
      <div class="m">${j.minutes_since_change}m in this state${j.waiting_on ? ' · waiting on ' + esc(j.waiting_on) : ''}</div>
    </li>`).join('')

  const projects = d.projects.map((p) => {
    const flags = []
    if (p.overdue_blockers > 0) flags.push(`<span class="pill bad">${p.overdue_blockers} overdue</span>`)
    else if (p.open_blockers > 0) flags.push(`<span class="pill warn">${p.open_blockers} blocked</span>`)
    if (p.stalled_jobs > 0) flags.push(`<span class="pill warn">${p.stalled_jobs} stalled</span>`)
    if (p.failed_jobs_24h > 0) flags.push(`<span class="pill bad">${p.failed_jobs_24h} failed 24h</span>`)
    if (p.brief_is_stale) flags.push('<span class="pill">brief stale</span>')
    if (!flags.length) flags.push('<span class="pill good">clear</span>')
    return `<li><div class="row"><span class="t">${esc(p.name)}</span>${flags.join('')}</div>
      <div class="m">${p.live_jobs} live${p.hours_since_sync != null ? ' · synced ' + Math.round(p.hours_since_sync) + 'h ago' : ' · never synced'}</div></li>`
  }).join('')

  // The overflow line. A list that silently shows 20 of 40 looks healthy
  // exactly when it stops being useful.
  const overflow = (shown, total, what) =>
    total > shown ? `<div class="meta" style="margin-top:8px">Showing ${shown} of ${total} ${what}.</div>` : ''

  return `
    <section class="card wide" data-card="glance">
      <h2>At a glance</h2>
      <div class="body"><div class="tiles">
        ${tile(c.needs_me, 'need you', c.needs_me ? 'warn' : '')}
        ${tile(c.needs_me_overdue, 'overdue', c.needs_me_overdue ? 'bad' : '')}
        ${tile(c.live_jobs, 'jobs live')}
        ${tile(c.active_projects, 'projects')}
        ${tile(c.undo_offers, 'undoable')}
      </div></div>
    </section>
    <section class="card wide" data-card="needs"><span class="drag" title="Move up">⌃</span>
      <h2>Needs you</h2>
      <div class="body">${needs ? `<ul>${needs}</ul>${overflow(d.needs_me.length, c.needs_me, 'blockers')}`
              : '<div class="empty">Nothing is waiting on you.</div>'}</div>
    </section>
    <section class="card" data-card="projects"><span class="drag" title="Move up">⌃</span>
      <h2>Projects</h2>
      <div class="body">${projects ? `<ul>${projects}</ul>` : '<div class="empty">No active projects.</div>'}</div>
    </section>
    <section class="card" data-card="inflight"><span class="drag" title="Move up">⌃</span>
      <h2>In flight</h2>
      <div class="body">${jobs ? `<ul>${jobs}</ul>` : '<div class="empty">The queue is empty.</div>'}</div>
    </section>
    ${calendar}`
}

/*
  What one person is allowed to touch.

  Grant: *"I'd like to be able to give them the ability to interact with other
  tools... let's say the marketing guy should be able to go away and use image
  editing APIs."*

  A checkbox per tool, saved on the tick rather than on Save. The name and the
  remit are a form you fill in and submit; a permission is a switch, and a
  switch that needs a second press to take effect is a switch you cannot trust
  the position of.

  Tools switched off for everyone are shown, disabled, with the reason. Hiding
  them would turn "why can't Ruby send email" into a question with no answer on
  the page — and §11 disables gmail.send by policy precisely so the answer is
  written down rather than remembered.
*/
const LEVEL_NAMES = ['Reads only', 'Writes internally', 'Acts outside', 'Needs approval']

function toolBox(s) {
  const tools = s.tools || []
  if (!tools.length) return ''
  const held = tools.filter((t) => t.granted).length
  const groups = [0, 1, 2, 3].map((lvl) => {
    const rows = tools.filter((t) => t.level === lvl)
    if (!rows.length) return ''
    return `<div class="toolgroup"><span class="m">${esc(LEVEL_NAMES[lvl])}</span>${rows.map((t) => `
      <label class="tool${t.available ? '' : ' off'}"${t.available ? '' : ` title="${esc(t.unavailable_because || 'switched off')}"`}>
        <input type="checkbox" data-tool="${esc(t.tool)}" data-for="${esc(s.slug)}"
          ${t.granted ? 'checked' : ''}${t.available ? '' : ' disabled'}>
        <span>${esc(t.description)}</span>
      </label>`).join('')}</div>`
  }).join('')
  return `<details class="tools">
    <summary>Tools — ${held} of ${tools.length} allowed</summary>
    <div class="toolbody">${groups}
      <div class="meta">Ticking saves immediately. A greyed row is switched off for
        everyone by policy; granting it here cannot turn it on.</div>
      <div class="meta"><b>Not yet in force.</b> These grants are recorded and the
        permission check is built, but no part of the team chooses its own tools yet —
        every job runs a fixed code path. Set them how you want them; they take effect
        when tool-choosing arrives, and saying so here beats a switch that looks live
        and is not.</div>
    </div>
  </details>`
}

/*
  How this person works: the procedures the office has written down (#50).

  Not labelled "Skills". That word is taken on this card by `staff.expertise`,
  which is routing vocabulary — two things called Skills on one screen is how
  somebody edits the wrong one, and that has already happened here once.

  Collapsed by default and showing the procedure in full when opened. A
  procedure summarised is a procedure nobody can check, and checking it is the
  entire reason it is on a page rather than only in a prompt.
*/
function procedureBox(s) {
  const procs = s.procedures || []
  if (!procs.length) return ''
  /*
    The name is DERIVED from the condition, so printing both stacks two lines
    that say the same thing — "Writing me a status update" over "When you write
    me a status update". Shown only when it adds something, which is the case
    where the name came from the procedure instead.
  */
  const plain = (t) => String(t || '').toLowerCase().replace(/[^a-z ]+/g, '').trim()
  // Compared on the tail, because the heads differ by construction: "WHEN YOU
  // WRITE me a status update" against "WRITING me a status update". Four words
  // is enough to be sure they are the same phrase and short enough to survive
  // the gerund. Fewer than four and it is not compared at all.
  const tail = (t) => plain(t).split(' ').filter(Boolean).slice(-4)
  const echoes = (a, b) => {
    const [x, y] = [tail(a), tail(b)]
    return x.length === 4 && y.length === 4 && x.join(' ') === y.join(' ')
  }
  const rows = procs.map((p) => `<div class="proc">
    <div class="procname">${esc(p.name)}${p.scope === 'global'
      ? ' <span class="m">— whole team</span>' : ''}${p.version > 1
      ? ` <span class="m">· v${p.version}</span>` : ''}</div>
    ${echoes(p.when_to_use, p.name) ? '' : `<div class="m">${esc(p.when_to_use)}</div>`}
    <div class="proctext">${esc(p.procedure)}</div>
    <div class="row">
      <span class="m">from ${esc(p.authored_by)}${(p.tools || []).length
        ? ' · uses ' + esc((p.tools || []).join(', ')) : ''} · shown to ${p.uses || 0} job${(p.uses || 0) === 1 ? '' : 's'}</span>
      <button class="mini" data-retire-skill="${esc(p.skill_id)}">Retire</button>
    </div>
  </div>`).join('')
  return `<details class="tools">
    <summary>How they work — ${procs.length} procedure${procs.length === 1 ? '' : 's'}</summary>
    <div class="toolbody">${rows}
      <div class="meta">Written down by telling the team, in a message. Say
        <i>"when you write a status update, lead with what changed"</i> and it
        lands here. Retiring is reversible — say it again and it comes back.</div>
      <div class="meta">A procedure can name a tool and can never name an
        address. That is what stops one quietly sending our work somewhere
        nobody approved.</div>
    </div>
  </details>`
}

function staff(d) {
  /*
    Grant: "with regards to the actual members of staff, there should be
    something that's also configurable in the front end. Their names, their
    roles, there should be a link to the Telegram bot. So I should be able to
    add and move stuff, adjust names, all that kind of stuff."

    Editable in place rather than behind a pencil icon. There are eight of them
