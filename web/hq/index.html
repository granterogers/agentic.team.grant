    and the whole page fits on a phone screen; a modal per person would be four
    taps to change a word.

    Retired people are shown, greyed, with a Bring back button. A page that
    hides them offers no way to undo a mistap — and there is no delete here at
    all, because outputs, routing decisions and deliveries all name a staff
    member and a roster that can lose a row is a history that stops explaining
    itself.
  */
  const base = d.avatar_base || ''
  const people = (d.staff || []).map((s) => {
    const src = base && s.avatar_ref ? base + '/' + s.avatar_ref : ''
    /*
      Which bot speaks as this person, as a picker rather than a fact.

      Grant: *"I'd like to be able to dynamically add and remove staff."* A bot
      cannot be deleted and a username is claimed for ever, so hiring must not
      consume one and firing must hand it back. That makes assignment — not
      creation — the primitive worth exposing, and it is instant, reversible
      and cannot fail.
    */
    const mine = (d.bots || []).find((b) => b.staff_slug === s.slug)
    const spares = (d.bots || []).filter((b) => b.spare)
    const options = [
      `<option value="">— none —</option>`,
      ...(mine ? [`<option value="${esc(mine.username)}" selected>@${esc(mine.username)}</option>`] : []),
      ...spares.map((b) => `<option value="${esc(b.username)}">@${esc(b.username)} (spare)</option>`),
    ].join('')
    const bot = `<span class="botpick">
      <select data-bot-for="${esc(s.slug)}" aria-label="Which bot speaks as ${esc(s.name)}">${options}</select>
      ${mine ? `<a href="https://t.me/${esc(mine.username)}" target="_blank" rel="noopener">open chat</a>` : ''}
      <span data-bot-said="${esc(s.slug)}" class="m"></span>
    </span>`
    const pron = ['she/her', 'he/him', 'they/them'].map((p) =>
      `<option value="${p}"${s.pronouns === p ? ' selected' : ''}>${p}</option>`).join('')
    return `<div class="person" data-slug="${esc(s.slug)}"${s.active ? '' : ' data-retired="1"'}>
      ${src ? `<img src="${esc(src)}" alt="" loading="lazy">` : '<div class="person-none"></div>'}
      <div style="min-width:0;flex:1">
        <div class="namerow">
          <input class="nm" data-f="p_name" value="${esc(s.name)}" aria-label="First name">
          <select data-f="p_pronouns" aria-label="Pronouns">${pron}</select>
        </div>
        <input data-f="p_title" value="${esc(s.title)}" aria-label="Role">
        <textarea data-f="p_remit" rows="2" aria-label="What they do">${esc(s.responsibilities || '')}</textarea>
        <label class="flab">Skills <span class="m">— comma separated, up to thirty. <b>This decides who gets the work.</b> Use the words you would actually type: "how much should we charge" finds whoever owns <i>charge</i>. It shapes how they write too, and it still grants no tools — those are below.</span></label>
        <input data-f="p_skills" value="${esc((s.expertise || []).join(', '))}" aria-label="Skills" placeholder="e.g. pricing, charge, budget, forecast, margin">
        <label class="flab">How they talk <span class="m">— one line, in your words.</span></label>
        <input data-f="p_style" value="${esc(s.communication_style || '')}" aria-label="How they talk">
        ${toolBox(s)}
        ${procedureBox(s)}
        <div class="m" style="margin-top:6px">${bot} · convened for ${s.jobs_convened_for || 0} job${(s.jobs_convened_for || 0) === 1 ? '' : 's'}${s.permanent ? '' : ' · temporary'}</div>
        <div class="row" style="margin-top:6px">
          <button class="mini" data-save="${esc(s.slug)}">Save</button>
          ${s.slug === 'chief-of-staff' ? '' :
            `<button class="mini" data-retire="${esc(s.slug)}" data-to="${s.active ? 'false' : 'true'}">${s.active ? 'Retire' : 'Bring back'}</button>`}
          <span class="m" data-said="${esc(s.slug)}"></span>
        </div>
      </div>
    </div>`
  }).join('')
  return `<section class="card wide" data-card="team"><h2>The team</h2>
    <p class="meta">First names only. Change a name, role, remit, skills or voice and
      press Save; it is what they sign messages with everywhere. Tools are different —
      those save the moment you tick them, because a permission you have to remember to
      submit is a permission you cannot trust the state of.</p>
    <p class="meta"><b>Skills route work.</b> When you send something to the Chief of
      Staff, she matches what you said against these words and hands it to whoever owns
      them. Add the words you actually use, not job descriptions — nobody types "unit
      economics", they type "how much should we charge". Emptying someone's skills means
      they will never be picked for anything.</p>
    <div class="body"><div class="staff">${people}</div></div>
  </section>`
}

function wireTeam() {
  const said = (slug, text) => {
    const el = document.querySelector(`[data-said="${slug}"]`)
    if (el) el.textContent = text
  }
  for (const b of document.querySelectorAll('[data-save]')) {
    b.onclick = async () => {
      const slug = b.dataset.save
      const card = b.closest('.person')
      const args = { p_slug: slug }
      for (const f of card.querySelectorAll('[data-f]')) args[f.dataset.f] = f.value
      b.disabled = true
      said(slug, 'Saving…')
      try {
        const r = await act('staff_update', args)
        /*
          A cleared skills list is reported, not swallowed.

          Since 0200 these words decide who work is routed to, so emptying them
          makes someone unroutable — and nothing on the page would look wrong.
          The RPC returns how many went; saying so is the difference between an
          accident you notice now and one you discover by wondering why Ruby
          never gets anything.
        */
        const lost = (r && r.skills_removed) || 0
        said(slug, lost > 0
          ? `Saved — ${lost} skill${lost === 1 ? '' : 's'} removed. ${(r.skills || []).length === 0
              ? 'They will not be routed work by subject any more.' : ''}`
          : 'Saved.')
      } catch (e) {
        // The server refuses a two-word name (0079) and says so in words. Shown
        // verbatim because "first names only" is the rule Grant asked for and a
        // generic failure would read as a bug.
        said(slug, e.message)
      }
      b.disabled = false
    }
  }
  for (const box of document.querySelectorAll('[data-tool]')) {
    box.onchange = async () => {
      const slug = box.dataset.for
      // Optimistic and then corrected, rather than optimistic and hoped for.
      // The RPC refuses a grant for a globally disabled tool, and a checkbox
      // left ticked after a refusal is a lie about what someone can do.
      box.disabled = true
      said(slug, 'Saving…')
      try {
        await act('staff_tool_set', {
          p_slug: slug, p_tool: box.dataset.tool, p_granted: box.checked,
        })
        const label = box.closest('details').querySelector('summary')
        const all = box.closest('.toolbody').querySelectorAll('[data-tool]')
        const held = [...all].filter((x) => x.checked).length
        label.textContent = `Tools — ${held} of ${all.length} allowed`
        said(slug, 'Saved.')
      } catch (e) {
        box.checked = !box.checked
        said(slug, e.message)
      }
      box.disabled = false
    }
  }
  for (const sel of document.querySelectorAll('[data-bot-for]')) {
    sel.onchange = async () => {
      const slug = sel.dataset.botFor
      const said = document.querySelector(`[data-bot-said="${slug}"]`)
      sel.disabled = true
      if (said) said.textContent = 'Saving…'
      try {
        // Freeing the previous bot first, because the RPC refuses to give a
        // person a second bot — one each, so "who is this from" always has an
        // answer. Selecting "none" is only the free.
        const previous = sel.dataset.was
        if (previous) await act('bot_assign', { p_username: previous, p_staff_slug: null })
        if (sel.value) await act('bot_assign', { p_username: sel.value, p_staff_slug: slug })
        show('staff')
      } catch (e) {
        if (said) said.textContent = e.message
        sel.disabled = false
      }
    }
    // Remember what it held, so a change knows which bot to hand back.
    sel.dataset.was = sel.value
  }

  for (const b of document.querySelectorAll('[data-retire-skill]')) {
    b.onclick = async () => {
      /*
        Confirmed, because it changes how the team works from the next job on.

        Nothing is lost — `skills` is append-only and this writes a retirement
        row — but "nothing is lost" is not the same as "nothing happens", and
        the standing rule is to check before anything destructive-shaped.
      */
      if (!confirm('Retire this procedure? The team stops being shown it. Saying it again brings it back.')) return
      b.disabled = true
      b.textContent = 'Retiring…'
      try {
        await act('retire_skill', { p_skill_id: b.dataset.retireSkill })
        show('staff')
      } catch (e) {
        b.textContent = e.message
        b.disabled = false
      }
    }
  }

  for (const b of document.querySelectorAll('[data-retire]')) {
    b.onclick = async () => {
      b.disabled = true
      try {
        await act('staff_retire', { p_slug: b.dataset.retire, p_active: b.dataset.to === 'true' })
        show('staff')
      } catch (e) {
        said(b.dataset.retire, e.message)
        b.disabled = false
      }
    }
  }
}

function activity(rows) {
  if (!rows.length) return '<section class="card wide"><div class="empty">Nothing has happened yet.</div></section>'
  const items = rows.map((r) => `
    <li>
      <div class="row">
        <span class="t">${esc(r.kind)}</span>
        <span class="pill">${esc(r.from_state || 'new')} → ${esc(r.to_state)}</span>
        <span class="m" style="margin-left:auto">${ago(r.occurred_at)}</span>
      </div>
      ${r.reason ? `<div class="m">${esc(r.reason)}</div>` : ''}
      ${r.project_name ? `<div class="m">${esc(r.project_name)}</div>` : ''}
    </li>`).join('')
  return `<section class="card wide" data-card="recent"><h2>Recent activity</h2><div class="body"><ul>${items}</ul></div></section>`
}

function usage(d) {
  /*
    §11: estimated quota is never presented as authoritative. The API sends a
    `provenance` field per block and this renders it as a badge — not as a
    footnote, because a footnote is not read at the moment the number is.
  */
  const badge = (p) => p === 'estimated' ? '<span class="est">ESTIMATED</span>' : ''
  const block = (title, prov, note, rows) => `
    <section class="card" data-card="${esc(title.toLowerCase().replace(/\s+/g, '-'))}">
      <span class="drag" title="Move up">⌃</span>
      <h2>${esc(title)}${badge(prov)}</h2>
      <div class="body">
        <div class="tiles">${rows}</div>
        ${note ? `<div class="meta" style="margin-top:10px">${esc(note)}</div>` : ''}
      </div>
    </section>`
  const t = (n, label) => `<div class="tile"><b>${n}</b><span>${esc(label)}</span></div>`

  const inf = d.inference
  const tts = d.tts
  const nb = d.notebook
  const q = d.queue

  const models = (d.models || []).map((m) =>
    `<li><div class="row"><span class="t">${esc(m.model_id)}</span>
      <span class="pill">${esc(m.provider)}</span>
      <span class="m" style="margin-left:auto">${m.last_success_at ? ago(m.last_success_at) : 'never used'}</span>
    </div></li>`).join('')

  const delivery = (d.delivery || []).map((x) =>
    `<li><div class="row"><span class="t">${esc(x.channel)} · ${esc(x.state)}</span>
      <span class="m" style="margin-left:auto">${x.deliveries}</span></div>
      ${x.leases_expired ? `<div class="m">${x.leases_expired} lease(s) expired — nobody is carrying these</div>` : ''}
    </li>`).join('')

  return `
    ${block('Inference', inf.provenance, inf.note,
      t(inf.calls_30d, 'calls, 30d') + t('$' + Number(inf.cost_usd_30d).toFixed(2), 'spent, 30d'))}
    ${block('Queue', q.provenance, '', t(q.in_flight, 'in flight') + t(q.max_concurrent, 'max'))}
    ${block('Voice notes', tts.provenance, tts.note,
      t(tts.characters_this_month.toLocaleString(), 'chars this month') +
      t((tts.monthly_free_allowance / 1000000) + 'M', 'free allowance'))}
    ${block('Notebook', nb.provenance, nb.note,
      t(esc(nb.detected_tier ?? '—'), 'tier') + t(nb.notebook_limit ?? '—', 'notebooks') +
      t(nb.source_limit ?? '—', 'sources') + t(nb.daily_chat_budget ?? '—', 'chats/day'))}
    <section class="card" data-card="models"><span class="drag" title="Move up">⌃</span><h2>Free models</h2>
      <div class="body">${models ? `<ul>${models}</ul>` : '<div class="empty">None registered.</div>'}</div></section>
    <section class="card" data-card="delivery"><span class="drag" title="Move up">⌃</span><h2>Message delivery</h2>
      <div class="body">${delivery ? `<ul>${delivery}</ul>` : '<div class="empty">Nothing sent yet.</div>'}</div></section>`
}

/* --- sparklines ---------------------------------------------------------
   Inline SVG, no library. A single series, so: no legend (the heading names
   it), no end-marker (the headline number is the direct label), 2px stroke,
   recessive everything else.

   The hover layer is not optional — an SVG chart on a page IS interactive, and
   a shape with no way to ask "what was that day" is a decoration. Pointer
   events cover mouse and touch alike, which is why this uses `pointermove`
   rather than `mousemove`: on a phone the second one never fires.
*/
function sparkline(points, format) {
  const W = 300, H = 44, PADY = 4
  if (!points.length) return '<div class="empty">No data yet.</div>'
  const values = points.map((p) => Number(p[1]))
  // A series that is entirely zero has no shape, and drawing it as a flat line
  // along the baseline is worse than drawing nothing: it looks like data. Say
  // what is true instead.
  if (values.every((v) => v === 0)) {
    return `<div class="meta" style="padding:12px 0 4px">Nothing in the last ${points.length} days.</div>`
  }
  const max = Math.max(...values, 0)
  const min = Math.min(...values, 0)
  const span = max - min || 1
  const x = (i) => (points.length === 1 ? W / 2 : (i / (points.length - 1)) * W)
  const y = (v) => H - PADY - ((v - min) / span) * (H - PADY * 2)

  const line = values.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('')
  const area = `${line}L${W},${H}L0,${H}Z`
  const last = values[values.length - 1]
  const total = values.reduce((a, b) => a + b, 0)

  // A <title> makes the shape available to a screen reader, and the <details>
  // below is the table view the same reader can actually work with.
  const summary = `${points.length} days, ${format(min)} to ${format(max)}, latest ${format(last)}`

  const rows = points
    .slice()
    .reverse()
    .map((p) => `<tr><td>${esc(p[0])}</td><td>${esc(format(Number(p[1])))}</td></tr>`)
    .join('')

  return `
    <div class="sparkwrap">
      <svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"
           role="img" aria-label="${esc(summary)}"
           data-points='${esc(JSON.stringify(points))}' data-fmt="${esc(format.name || 'plain')}">
        <title>${esc(summary)}</title>
        <path class="area" d="${area}"></path>
        <!-- vector-effect, because preserveAspectRatio="none" stretches the
             viewBox horizontally and takes the stroke width with it: the line
             renders thin and uneven without this. Visible only once rendered,
             which is why the method says to look at it. -->
        <path class="line" d="${line}" vector-effect="non-scaling-stroke"></path>
        <line class="cross" x1="0" y1="0" x2="0" y2="${H}"></line>
        <circle class="dot" r="4" cx="0" cy="0"></circle>
      </svg>
      <div class="tip"></div>
    </div>
    <details class="values"><summary>Show the numbers (${points.length} days, ${format(total)} total)</summary>
      <table><tbody>${rows}</tbody></table></details>`
}

const FORMATS = {
  money: (v) => '$' + Number(v).toFixed(2),
  plain: (v) => String(Math.round(Number(v))),
}

/** Wire the crosshair. Pointer events, so a finger works as well as a mouse. */
function armSparklines(root) {
  for (const svg of root.querySelectorAll('svg.spark')) {
    const points = JSON.parse(svg.dataset.points)
    const fmt = FORMATS[svg.dataset.fmt] || FORMATS.plain
    const tip = svg.parentElement.querySelector('.tip')
    const cross = svg.querySelector('.cross')
    const dot = svg.querySelector('.dot')
    const W = 300, H = 44, PADY = 4
    const values = points.map((p) => Number(p[1]))
    const max = Math.max(...values, 0), min = Math.min(...values, 0)
    const span = max - min || 1

    const move = (event) => {
      const box = svg.getBoundingClientRect()
      const ratio = Math.min(Math.max((event.clientX - box.left) / box.width, 0), 1)
      const i = Math.round(ratio * (points.length - 1))
      const vx = points.length === 1 ? W / 2 : (i / (points.length - 1)) * W
      const vy = H - PADY - ((values[i] - min) / span) * (H - PADY * 2)
      cross.setAttribute('x1', vx); cross.setAttribute('x2', vx)
      dot.setAttribute('cx', vx); dot.setAttribute('cy', vy)
      svg.classList.add('on')
      tip.textContent = points[i][0] + ' · ' + fmt(values[i])
      tip.style.left = (ratio * box.width) + 'px'
      tip.style.top = ((vy / H) * box.height) + 'px'
      tip.classList.add('on')
    }
    const clear = () => { svg.classList.remove('on'); tip.classList.remove('on') }
    svg.addEventListener('pointermove', move)
    svg.addEventListener('pointerdown', move)
    svg.addEventListener('pointerleave', clear)
    svg.addEventListener('pointercancel', clear)
  }
}

/* --- remembered layout --------------------------------------------------
   §25 asks for collapse and reorder to be remembered. Kept in localStorage
   rather than in Postgres, deliberately: this is a per-DEVICE preference — the
   phone wants Needs You first and the desktop wants everything visible — and
   syncing it would make one device's tidy-up change the other's.
*/
const LAYOUT = 'hq.layout'
const layout = () => { try { return JSON.parse(localStorage.getItem(LAYOUT) || '{}') } catch { return {} } }
const saveLayout = (l) => { try { localStorage.setItem(LAYOUT, JSON.stringify(l)) } catch { /* private mode */ } }

function applyLayout(main, view) {
  const state = layout()[view] || {}
  const cards = [...main.querySelectorAll('.card[data-card]')]
  // Order first, then collapse: reordering a collapsed card must not expand it.
  const order = state.order || []
  for (const key of [...order].reverse()) {
    const card = cards.find((c) => c.dataset.card === key)
    if (card) main.prepend(card)
  }
  for (const card of cards) {
    if ((state.collapsed || []).includes(card.dataset.card)) card.classList.add('collapsed')
  }
}

function armLayout(main, view) {
  const persist = () => {
    const all = layout()
    all[view] = {
      order: [...main.querySelectorAll('.card[data-card]')].map((c) => c.dataset.card),
      collapsed: [...main.querySelectorAll('.card.collapsed[data-card]')].map((c) => c.dataset.card),
    }
    saveLayout(all)
  }
  for (const card of main.querySelectorAll('.card[data-card]')) {
    const heading = card.querySelector('h2')
    if (heading) {
      heading.title = 'Tap to collapse'
      heading.onclick = () => { card.classList.toggle('collapsed'); persist() }
    }
    const handle = card.querySelector('.drag')
    if (!handle) continue
    handle.onclick = (e) => {
      // Move up on tap. Drag-and-drop on a phone fights the scroll gesture, and
      // a control that only works with a mouse is not a mobile-first control.
      e.stopPropagation()
      const previous = card.previousElementSibling
      if (previous && previous.classList.contains('card')) { main.insertBefore(card, previous); persist() }
    }
  }
}

function trends(d) {
  const chart = (key, title, series, format, unit) => {
    const values = series.map((p) => Number(p[1]))
    const latest = values[values.length - 1] ?? 0
    const total = values.reduce((a, b) => a + b, 0)
    return `<section class="card" data-card="${key}"><span class="drag" title="Move up">⌃</span>
      <h2>${esc(title)}</h2>
      <div class="body">
        <div class="chartrow"><b>${esc(format(latest))}</b><span>today · ${esc(format(total))} over ${series.length} days</span></div>
        ${sparkline(series, format)}
      </div>
    </section>`
  }
  return `
    <section class="card wide" data-card="trends-note">
      <h2>Last ${d.days} days</h2>
      <div class="body"><div class="meta">Days are counted in ${esc(d.timezone)}, not UTC — a chart of days has to agree with you about where a day ends.</div></div>
    </section>
    ${chart('t-jobs', 'Jobs completed', d.jobs_completed, FORMATS.plain)}
    ${chart('t-calls', 'Model calls', d.inference_calls, FORMATS.plain)}
    ${chart('t-cost', 'Inference spend', d.inference_cost_usd, FORMATS.money)}
    ${chart('t-msgs', 'Messages delivered', d.messages_sent, FORMATS.plain)}`
}

function connections(d) {
  /*
    Grant asked for "a list of all the services being connected to with a green
    or red LED according to whether it's working".

    Three things this does that a plain green dot would not, each because the
    plain version would eventually mislead:

    1. **Age, on every row and once at the top.** Green means "working"; what it
       can honestly mean is "working when the prober last looked". A status that
       stops depending on the thing it reports, and stays green while doing so,
       is this project's recurring defect wearing a UI. Anything older than six
       hours goes amber and says so.
    2. **A word beside every colour.** Roughly one man in twelve cannot tell
       this red from this green.
    3. **Problems first.** Sorted by the database, so a broken row is at the top
       where it is read rather than alphabetically buried between two healthy
       ones.
  */
  const rows = d.rows || []
  const STALE_MINUTES = 6 * 60

  if (rows.length === 0) {
    return `<section class="card wide"><h2>Connections</h2><div class="body">
      <div class="empty">Nothing has been probed yet. Run <code>npm run inventory</code>.</div>
    </div></section>`
  }

  /*
    `attested` gets a neutral lamp, not a green one. Green here means "a probe
    reached it and it answered"; Backblaze is used by a GitHub Action and not by
    this process, so its status is Grant saying so. Painting those the same
    colour is how an indicator stops depending on the thing it indicates — the
    row said "Backblaze · Working" in green before this existed, on a status no
    program had ever checked.
  */
  const lamp = (state, stale) => {
    if (stale) return 'warn'
    return { ok: 'ok', dead: 'bad', missing: '', parked: '', unknown: 'warn', attested: '' }[state] ?? ''
  }
  const word = (state, stale) => {
    if (stale) return 'Unchecked'
    return { ok: 'Working', dead: 'Not working', missing: 'Not set up',
             parked: 'Parked', unknown: 'Unknown', attested: 'Confirmed by hand' }[state] ?? state
  }

  const oldest = Math.max(...rows.map((r) => Number(r.age_minutes) || 0))
  const anyStale = oldest > STALE_MINUTES

  const list = rows.map((r) => {
    const stale = (Number(r.age_minutes) || 0) > STALE_MINUTES
    return `<div class="conn">
      <span class="lamp ${lamp(r.state, stale)}" aria-hidden="true"></span>
      <span class="who">
        <b>${esc(r.service)}</b>
        <span>${esc(r.credential)}${r.owner ? ' · ' + esc(r.owner) : ''}</span>
      </span>
      <span class="st">
        <b class="${stale ? 'stale' : ''}">${esc(word(r.state, stale))}</b>
        ${esc(r.detail || '')}
        ${r.action ? '<span style="display:block">' + esc(r.action) + '</span>' : ''}
      </span>
    </div>`
  }).join('')

  const working = rows.filter((r) => r.state === 'ok').length
  const trusted = rows.filter((r) => r.state === 'attested').length
  const broken = rows.filter((r) => r.state === 'dead').length

  return `
    <section class="card wide" data-card="connections">
      <span class="drag" title="Move up">⌃</span>
      <h2>Connections${anyStale ? '<span class="est">STALE</span>' : ''}</h2>
      <div class="body">
        <div class="tiles">
          <div class="tile"><b>${working}</b><span>probed working</span></div>
          <div class="tile"><b>${broken}</b><span>not working</span></div>
          <div class="tile"><b>${trusted}</b><span>taken on trust</span></div>
        </div>
        <div style="margin-top:12px">${list}</div>
        <div class="meta" style="margin-top:10px">
          Last checked ${esc(ago(d.checked_at))}. A light says what the prober found when
          it last ran, not what is true this second — run <code>npm run inventory</code>
          to refresh. A grey light reading “Confirmed by hand” was never probed at all.
        </div>
      </div>
    </section>`
}

/*
  Service marks, drawn rather than fetched.

  Grant, §2: *"show me the actual service logos and icons rather than text
  labels... visual comprehension rather than textual explanation."* The card
  used to render a connector as the string `notebooklm · source`, which is the
  opposite of that.

  Inline SVG, because the page's CSP admits no external images and a dashboard
  that needs the network to draw its own icons is a dashboard that renders
  broken on a train.

  Monochrome, in `currentColor`, which is a deliberate trade. Full-brand colour
  is more instantly recognisable in isolation and much worse here: the marks sit
  in a row where COLOUR CARRIES STATE — green connected, red not answering,
  amber waiting on him — and a permanently black GitHub mark beside a red Notion
  one would be read as GitHub being fine. The silhouette does the recognising
  and the colour does the reporting, and neither has to fight the other.
*/
const MARKS = {
  github: '<path d="M12 1.5A10.5 10.5 0 0 0 8.68 22c.53.1.72-.23.72-.5v-1.8c-2.92.63-3.54-1.4-3.54-1.4-.48-1.22-1.17-1.55-1.17-1.55-.95-.65.08-.64.08-.64 1.06.07 1.61 1.09 1.61 1.09.94 1.6 2.46 1.14 3.06.87.1-.68.37-1.14.66-1.4-2.33-.27-4.78-1.17-4.78-5.19 0-1.15.41-2.08 1.08-2.82-.11-.27-.47-1.34.1-2.79 0 0 .88-.28 2.88 1.07a9.9 9.9 0 0 1 5.24 0c2-1.35 2.88-1.07 2.88-1.07.57 1.45.21 2.52.1 2.79.67.74 1.08 1.67 1.08 2.82 0 4.03-2.45 4.92-4.79 5.18.38.33.71.97.71 1.96v2.9c0 .28.19.61.73.5A10.5 10.5 0 0 0 12 1.5Z"/>',
  notion: '<path d="M4.2 3.3 15.4 2.5c1.4-.12 1.75-.04 2.62.6l3.05 2.15c.6.44.8.55.8 1.02v13.2c0 .87-.32 1.38-1.42 1.46l-13 .79c-.83.04-1.23-.08-1.67-.64l-2.4-3.1c-.48-.64-.68-1.11-.68-1.67V4.72c0-.71.32-1.3 1.5-1.42Z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8.1 7.6v8.2l1.9-.1V10l4.1 5.6 1.8-.1V7.3l-1.8.1v5.4L10.1 7.5Z"/>',
  notebooklm: '<path d="M5 3.2h11.2c1 0 1.8.8 1.8 1.8v14c0 1-.8 1.8-1.8 1.8H5Z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M5 3.2v17.6" stroke="currentColor" stroke-width="1.6"/><path d="M2.6 6.6h2.4M2.6 12h2.4M2.6 17.4h2.4" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="m12.4 8.2 1 2.4 2.4 1-2.4 1-1 2.4-1-2.4-2.4-1 2.4-1Z"/>',
}
const mark = (connector) =>
  `<svg class="mk" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">${
    MARKS[connector] ?? '<circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.6"/>'
  }</svg>`

/*
  Projects, as a picture.

  Grant asked for the home screen to become *"My Projects"*, for a project and
  the things it is connected to to be *"visually represented"*, and to be able
  to *"understand the state of a project visually within seconds."* What was
  here was a form with two text rows above it.

  ## Why this is not an SVG graph

  His sketch is a node diagram — the project at the centre, its services
  radiating out. Drawn literally in SVG that needs layout maths, and it needs it
  again at every width, and a radial diagram at 390px is four labels overlapping
  a circle.

  So the geometry is CSS: the hub is a block, the services are a grid beside or
  beneath it, and the connecting lines are borders on the service rows. It reads
  as a node diagram at every width, it reflows instead of rescaling, the text
  stays real text, and there is no arithmetic to get wrong. On a phone the
  services stack under the hub; from 760px they sit beside it and the lines run
  horizontally, which is the shape he drew.

  ## What the lines say

  Solid means attached. Dashed means not. That is one more channel carrying the
  same fact as the lamp and the wording, deliberately — §2 asks for connected
  and disconnected to be *"visually obvious"*, and about one man in twelve
  cannot separate the red lamp from the green one.

  ## Progressive disclosure

  §5: *"progressive disclosure — surface the important information first, with
  the ability to expand for detail."* The picture is the important information.
  Attaching, renaming, aliases and channels are all things you do occasionally
  and read never, so they live behind a summary that says what is inside.
*/
function projects(list) {
  const rows = Array.isArray(list) ? list : []

  const LAMP = { connected: 'ok', broken: 'bad', wanted: 'warn', declined: '', missing: '' }
  const SAYS = {
    connected: 'connected',
    broken: 'not answering',
    wanted: 'you wanted this',
    declined: 'left disconnected',
    missing: 'not connected',
  }

  /* A detach needs the attachment id; the connection row carries the connector.
     One lookup, because the attachments are already in the payload. */
  const attachmentIdFor = (p, connector) =>
    ((p.attachments || []).find((a) => a.connector === connector) || {}).attachment_id || ''

  const node = (p, c) => {
    const live = c.state === 'connected' || c.state === 'broken'
    const act = live
      ? `<button class="mini" data-detach="${esc(attachmentIdFor(p, c.connector))}">Detach</button>`
      : c.state === 'declined'
        ? `<button class="mini" data-choose="${esc(p.slug)}|${esc(c.connector)}|clear">Reconsider</button>`
        : `<button class="mini" data-choose="${esc(p.slug)}|${esc(c.connector)}|declined">Not now</button>`
    return `<div class="node n-${esc(c.state)}">
      <span class="wire" aria-hidden="true"></span>
      <span class="badge">${mark(c.connector)}</span>
      <span class="nlabel">
        <b>${esc(c.name)}</b>
        <span>${esc(SAYS[c.state] || c.state)}${c.detail ? ' · ' + esc(c.detail) : ''}</span>
      </span>
      ${act}
    </div>`
  }

  const graph = (p) => {
    const cs = p.connections || []
    const on = cs.filter((c) => c.state === 'connected').length
    return `<div class="graph">
      <div class="hub">
        <b>${esc(p.name)}</b>
        <span>${on} of ${cs.length} connected · ${p.documents} document(s)</span>
      </div>
      <div class="nodes">${cs.map((c) => node(p, c)).join('')}</div>
    </div>`
  }

  const details = (p) => {
    const channels = (p.channels || []).length === 0
      ? '<span class="m">No channels yet — the team makes them when it has something to say.</span>'
      : (p.channels || []).map((c) => `<span class="pill">#${esc(c.name)}</span>`).join(' ')
    const aliases = (p.aliases || []).length === 0
      ? '<span class="m">No other names yet. It learns them as you use them.</span>'
      : (p.aliases || []).map((a) => `<span class="pill">${esc(a.alias)}</span>`).join(' ')
    return `<details class="more">
      <summary>Names, channels and attaching something</summary>
      <div class="meta" style="margin:10px 0 8px">
        <code>${esc(p.slug)}</code>
        <button class="mini" data-rename="${esc(p.slug)}" data-name="${esc(p.name)}">Rename</button>
      </div>
      ${p.description ? `<p class="m" style="margin:0 0 8px">${esc(p.description)}</p>` : ''}
      <div style="margin-bottom:8px"><span class="lbl">Also called</span> ${aliases}</div>
      <div style="margin-bottom:10px"><span class="lbl">Channels</span> ${channels}</div>
      <div class="addrow">
        <select data-conn="${esc(p.slug)}">
          <option value="notion">Notion</option>
          <option value="notebooklm">NotebookLM</option>
          <option value="github">GitHub</option>
        </select>
        <input data-ref="${esc(p.slug)}" placeholder="Paste the link, notebook id, or owner/repo">
        <select data-role="${esc(p.slug)}">
          <option value="source">reads from</option>
          <option value="home">writes to</option>
        </select>
        <button class="mini" data-attach="${esc(p.slug)}">Attach</button>
      </div>
    </details>`
  }

  const cards = rows.map((p) => `
    <section class="card wide proj" data-card="project-${esc(p.slug)}">
      <span class="drag" title="Move up">⌃</span>
      <h2>${esc(p.name)}</h2>
      <div class="body">
        ${graph(p)}
        ${details(p)}
      </div>
    </section>`).join('')

  return cards + `
    <section class="card" data-card="new-project">
      <h2>New project</h2>
      <div class="body">
        <div class="addrow">
          <input id="np-name" placeholder="Project name">
          <select id="np-conn">
            <option value="notion">Notion</option>
            <option value="notebooklm">NotebookLM</option>
            <option value="github">GitHub</option>
          </select>
          <input id="np-ref" placeholder="Notion link or notebook id">
          <button class="mini" id="np-go">Create</button>
        </div>
        <div class="meta" style="margin-top:8px">
          It needs at least one source — there is nothing to read or write without one.
        </div>
        <div class="err" id="np-err" hidden></div>
      </div>
    </section>`
}


function output(list) {
  /*
    Grant: "once they're created, see if you can pull them into our store
    project and display the results as a link within both Slack and Telegram."
    Both of those happen when the artifact lands. This is the third place — the
    one you come back to a week later, when the message has scrolled away.

    A failed generation stays on the list rather than being hidden. Google
    fails a slide deck roughly as often as it makes one, and a list that shows
    only successes teaches you that everything worked.
  */
  const rows = Array.isArray(list) ? list : []
  if (rows.length === 0) {
    return `<section class="card wide"><h2>Output</h2>
      <div class="empty">Nothing made yet. Ask the team for an audio overview or a
      slide deck, in Slack or Telegram, and it will appear here with its link.</div>
    </section>`
  }
  const LAMP = { ready: 'ok', generating: 'warn', failed: 'bad', abandoned: 'bad' }
  const SAID = {
    ready: 'ready', generating: 'still making it', failed: 'failed', abandoned: 'gave up watching',
  }
  const item = (a) => `
    <div class="conn">
      <span class="lamp ${LAMP[a.state] || ''}" aria-hidden="true"></span>
      <span class="who">
        <b>${a.url ? `<a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.title || a.kind)}</a>` : esc(a.title || a.kind)}</b>
        <span>${esc(a.kind)} · ${esc(a.project || '')}${a.detail ? ' · ' + esc(a.detail) : ''}</span>
      </span>
      <span class="st">${esc(SAID[a.state] || a.state)}</span>
    </div>`
  return `<section class="card wide"><h2>Output</h2>
    <p class="meta">What the notebook has made. Opens in Google.</p>
    ${rows.map(item).join('')}
  </section>`
}

function settings(d) {
  /*
    Two halves, and the difference between them is the point.

    LIVE is a set of facts about the database this page is talking to. It is
    not editable, because a text box that appears to move a database and does
    not is worse than no text box at all.

    SETTINGS are declared intent: where the tooling should connect next time,
    where backups go, whether the calendar is in service. Editing one changes
    what the next run reads. Six keys, allow-listed in the database (0077), so
    the page cannot reach the job lease or the autonomy level.
  */
  const live = d.live || {}
  const settings = d.settings || {}
  const editable = d.editable || []

  const fact = (label, value) =>
    `<div class="conn"><span class="who"><b>${esc(String(value ?? '—'))}</b><span>${esc(label)}</span></span></div>`

  const field = (key) => {
    const row = settings[key] || {}
    const value = row.value
    const isBool = typeof value === 'boolean'
    const control = isBool
      ? `<select data-setting="${esc(key)}">
           <option value="true"${value ? ' selected' : ''}>on</option>
           <option value="false"${value ? '' : ' selected'}>off</option>
         </select>`
      : `<input data-setting="${esc(key)}" value="${esc(String(value ?? ''))}" autocomplete="off">`
    return `<label class="fld"><span>${esc(key)}</span>${control}
      <em>${esc(row.description || '')}</em></label>`
  }

  const nb = d.notebook || {}
  // Every sentence says whose count it is. Google publishes no usage API, and a
  // figure here that did not say so would be read as theirs within a week —
  // after which a refusal at half our number reads as our bug.
  const meter = nb.window_ceiling === undefined ? '' : `
    <section class="card"><h2>Notebook allowance</h2>
      <p class="meta">Our own count of what we have spent, not Google's — they
        publish no usage API.
        ${nb.ceiling_is_measured ? 'The ceiling below was measured from a refusal.' : 'The ceiling below is still an estimate.'}</p>
      ${fact('used in this ' + nb.window_hours + '-hour window', nb.window_spent + ' of ' + nb.window_ceiling)}
      ${fact('used this week', nb.week_spent + ' of ' + nb.week_ceiling)}
      ${nb.blocked_until ? fact('Google refused until', new Date(nb.blocked_until).toLocaleString()) : ''}
      ${nb.window_resets_at ? fact('window frees up', new Date(nb.window_resets_at).toLocaleString()) : ''}
    </section>`

  const g = d.google || {}
  const step = (done, text) =>
    `<div class="conn"><span class="lamp ${done ? 'ok' : ''}" aria-hidden="true"></span>` +
    `<span class="who"><b>${text}</b></span>` +
    `<span class="st">${done ? 'done' : 'to do'}</span></div>`

  // Ordered the way he has to do them: the console first, because the client id
  // and the redirect URI have to exist over there before anything here works.
  const google = `
    <section class="card"><h2>Google</h2>
      <p class="meta">Calendar needs an OAuth client from your own Google Cloud project.
        Four steps, once.</p>
      ${step(true, '1. Create an OAuth client (type: Web application) at console.cloud.google.com')}
      ${step(g.client_id ? true : false, '2. Paste the client ID below')}
      ${step(g.has_secret ? true : false, '3. Paste the client secret below')}
      ${step(g.has_refresh_token ? true : false, '4. Press Connect and approve it')}

      <label class="fld"><span>Authorised redirect URI — paste this INTO Google</span>
        <input readonly value="${esc(g.redirect_uri || '')}" onclick="this.select()">
        <em>Must match to the character, or the consent screen refuses before you see it.</em>
      </label>
      <label class="fld"><span>google.client_id</span>
        <input data-setting="google.client_id" value="${esc(g.client_id || '')}" autocomplete="off">
        <em>Public by design — it appears in every authorization URL.</em>
      </label>
      <label class="fld"><span>Client secret</span>
        <input id="gsecret" type="password" placeholder="${g.has_secret ? '•••••••• already stored — paste again to replace' : 'GOCSPX-…'}" autocomplete="off">
        <em>Stored in the vault. This page can write it and can never read it back.</em>
      </label>
      <div class="row">
        <button id="save-google">Save secret</button>
        <a class="mini" href="${esc(API.replace('/hq-api', '/google-oauth/start'))}" target="_blank" rel="noopener">Connect Google →</a>
        <span id="google-said" class="m">${g.has_refresh_token ? 'Connected.' : ''}</span>
      </div>
    </section>`

  return `
    ${meter}
    ${google}
    <section class="card"><h2>This database</h2>
      <p class="meta">Facts, not fields. Nothing here is editable, because editing it would not move anything.</p>
      ${fact('database', live.database)}
      ${fact('server', live.server)}
      ${fact('on disk', live.size)}
      ${fact('tables', live.tables)}
    </section>
    <section class="card"><h2>Where things should live</h2>
      <p class="meta">Declared, not live. Changing one tells the next run where to look.</p>
      <div id="fields">${editable.map(field).join('')}</div>
      <div class="row"><button id="save-settings">Save</button>
        <span id="settings-said" class="m"></span></div>
    </section>`
}

function wireSettings() {
  const gsaid = document.getElementById('google-said')
  const gsave = document.getElementById('save-google')
  if (gsave !== null) {
    gsave.onclick = async () => {
      const box = document.getElementById('gsecret')
      if (!box.value.trim()) { gsaid.textContent = 'Nothing to save.'; return }
      gsave.disabled = true
      gsaid.textContent = 'Saving…'
      try {
        await act('set_google_secret', { p_secret: box.value.trim() })
        box.value = ''
        gsaid.textContent = 'Saved. Now press Connect.'
      } catch (e) {
        // Shown verbatim: the server refuses anything not starting GOCSPX-,
        // and the commonest mistake is pasting the client ID in here.
        gsaid.textContent = e.message
      }
      gsave.disabled = false
    }
  }

  const said = document.getElementById('settings-said')
  const save = document.getElementById('save-settings')
  if (save === null) return
  save.onclick = async () => {
    save.disabled = true
    said.textContent = 'Saving…'
    try {
      // One call per changed key rather than a batch. There are six of them,
      // and a partial batch failure would leave the page unable to say which
      // half went in.
      for (const el of document.querySelectorAll('[data-setting]')) {
        await act('set_setting', { p_key: el.dataset.setting, p_value: String(el.value) })
      }
      said.textContent = 'Saved.'
    } catch (e) {
      said.textContent = 'Not saved: ' + e.message
    }
    save.disabled = false
  }
}


/*
  Talk to Team.

  §22's scenario A ends in a conversation, and Grant settled §12's "optional
  premium" against §22's completion criterion with three words: *"Voice is
  required."*

  ## What was wrong with the previous version

  Grant: *"you need to fix the proper voice chat feature in the front end.. the
  current solution sucks"*. It did, and in three separate ways.

  It was the browser's own recogniser, so it was **one utterance per press** —
  press, say a sentence, wait, read, press again. That is dictation with extra
  steps, not a conversation, and there is no way to interrupt something that is
  not listening while it talks.

  It **could not be interrupted**. The reply was spoken by `speechSynthesis`,
  which finishes its sentence whatever you do. Barge-in was named as the known
  loss at the time; it turns out to be the thing that decides whether this
  feels like talking to someone.

  And on most phones it **did not exist at all**. `webkitSpeechRecognition` is
  absent from every in-app browser you land in from a link, so the microphone
  simply was not offered.

  ## What it is now

  A real Realtime call over WebRTC: full duplex, semantic turn detection,
  interruptible mid-sentence, and running on Claire — the Chief of Staff — with
  a tool that reaches the actual office. `voice-token` mints the credential and
  owns her instructions; this page never sees the permanent key and cannot
  change who she is (§12).

  The cost of the change, stated: this bills per minute, where the recogniser
  was free. That is the trade §12 always described, and it is the one Grant
  asked for.

  ## Why typing stays

  It works on every device, on a train, and on a desktop with no microphone. A
  page whose only control needs permission and quiet is a page that sometimes
  does not work, and this one has to always work.

  ## Why the transcript is on screen

  Grant, about the bots misunderstanding him: *"probably good idea that he
  confirms he understands and spits back what I want before going ahead."* On
  a call there is no message to re-read, so both sides are transcribed live —
  and when Claire puts something to the team, that shows as its own line, in
  her words, so a mishearing is caught at the point it becomes an instruction.
*/

/*
  What the build is doing.

  Grant: *"I want to see what it is that you're doing ... so that I can pop into
  the application and see what it is you're doing."*

  The office reports itself everywhere on this page. The session that CHANGES
  the system did not, so watching it meant opening a terminal — the dependence
  he has spent weeks reducing.

  Screenshots carry most of the value. §14A's loop produces images, and an image
  is the only honest report of visual work: "improved the spacing" says nothing
  and a picture of it can be judged in a second.
*/
function build(d) {
  const now = d.now || null
  const blocked = d.blocked || []
  const steps = d.steps || []
  const today = d.today || {}

  const when = (t) => {
    if (!t) return ''
    const mins = Math.round((Date.now() - new Date(t).getTime()) / 60000)
    if (mins < 1) return 'just now'
    if (mins < 60) return mins + 'm ago'
    const hrs = Math.round(mins / 60)
    return hrs < 24 ? hrs + 'h ago' : Math.round(hrs / 24) + 'd ago'
  }

  const head = now
    ? `<section class="card wide nowcard"><h2>Working on</h2><div class="body">
         <div class="nowline"><span class="pulse"></span>
           <b>${esc(now.headline)}</b>${now.towards ? `<span class="towards">${esc(now.towards)}</span>` : ''}</div>
         ${now.detail ? `<p class="m">${esc(now.detail)}</p>` : ''}
         <div class="m">Started ${esc(when(now.since))}</div>
       </div></section>`
    : `<section class="card wide"><h2>Working on</h2><div class="body">
         <div class="m">Nothing in progress right now.</div></div></section>`

  const stuck = blocked.length === 0 ? '' :
    `<section class="card wide"><h2>Waiting on you</h2><div class="body">
      ${blocked.map((b) => `<div class="conn"><span class="lamp warn"></span>
        <div class="who"><b>${esc(b.headline)}</b>
        <span>${esc(b.detail || '')} — since ${esc(when(b.since))}</span></div></div>`).join('')}
     </div></section>`

  const row = (s) => {
    const lamp = s.state === 'done' ? 'ok' : s.state === 'blocked' ? 'warn'
      : s.state === 'abandoned' ? '' : 'ok'
    return `<div class="bstep">
      <div class="bmeta">
        <span class="lamp ${lamp}"></span>
        <div class="bwho">
          <b>${esc(s.headline)}</b>
          ${s.towards ? `<span class="towards">${esc(s.towards)}</span>` : ''}
          ${s.detail ? `<span class="m">${esc(s.detail)}</span>` : ''}
          ${s.produced ? `<span class="produced">${esc(s.produced)}</span>` : ''}
        </div>
        <div class="bwhen m">${esc(when(s.started_at))}${
          s.minutes !== null && s.minutes !== undefined ? ` · ${esc(String(s.minutes))}m` : ''}</div>
      </div>
      ${s.shot ? `<a class="bshot" href="${esc(s.shot)}" target="_blank" rel="noopener">
        <img loading="lazy" src="${esc(s.shot)}" alt="${esc(s.headline)}"></a>` : ''}
    </div>`
  }

  return head + stuck + `<section class="card wide"><h2>Steps</h2>
    <p class="hint">${esc(String(today.done || 0))} finished in the last day.
      Newest first, with pictures where the work was visual.</p>
    <div class="body">${
      steps.length === 0
        ? '<div class="m">No steps recorded yet.</div>'
        : steps.map(row).join('')
    }</div></section>`
}

function talk() {
  return `<section class="card wide" data-card="talk"><h2>Talk to the team</h2><div class="body">
      <div class="callstage">
        <button type="button" id="call" class="mic" title="Call Claire">📞</button>
        <div class="talkstate" id="talkstate">Press to call Claire. She knows what the
          office has been doing — ask her, tell her, interrupt her.</div>
      </div>
      <details class="typeinstead" id="typeinstead">
        <summary>Type instead</summary>
        <form class="askform" id="askform">
          <input id="asktext" placeholder="Say it here"
                 aria-label="What you want to say" autocomplete="off" enterkeyhint="send">
          <button type="submit" id="asksend">Send</button>
        </form>
        <div id="turns" class="turns"></div>
      </details>
    </div></section>`
}

const MINT = 'https://baujwlzcziasnfhhkchg.supabase.co/functions/v1/voice-token'

function wireTalk() {
  const form = document.getElementById('askform')
  if (form === null) return
  const callBtn = document.getElementById('call')
  const box = document.getElementById('asktext')
  const state = document.getElementById('talkstate')
  const turns = document.getElementById('turns')
  // One session per visit to this view. It groups the turns of a conversation
  // in `origin_ref`, which is what conversation memory reads. Shared between
  // the call and the typing box on purpose: they are one conversation.
  const session = 's' + Math.random().toString(36).slice(2, 12)

  let pc = null
  let stream = null
  let channel = null
  let onCall = false
  // The element her voice comes out of. It used to be a `const` inside the
  // connect block, which is the whole of the "stop talking doesn't work" bug —
  // see `hangUp`.
  let speaker = null
  // Whether there is a response in flight to cancel. `response.cancel` with
  // nothing running comes back as an error event, which would surface to Grant
  // as "something went wrong on the call" every time he took a breath.
  let answering = false

  const show = (who, text, cls) => {
    const el = document.createElement('div')
    el.className = 'turn ' + (cls || '')
    el.innerHTML = `<b>${esc(who)}</b><span>${esc(text)}</span>`
    turns.prepend(el)
    return el
  }

  /*
    One turn through the office.

    The same call the typing box makes and the same call Claire's tool makes,
    because they are the same thing: something was said, and the office
    answers or takes it on. Two implementations would drift, and the one that
    drifted would be the voice one, which is the one nobody reads the logs of.
  */
  const VOICE = API.replace(/\/hq-api$/, '/voice')

  /*
    Looking something up, which is a different thing from asking for work.

    Grant: *"the voice doesn't seem to have access to any of the project
    data.. this is critical … it should be the true voice of 'claire' fully
    aware of everything."*

    She had one tool and it delegated, so a question of fact came back as "I
    have put that to the team, the answer appears in Slack" — on a phone call,
    about something one select away. `/look` is a read of canonical state and
    returns in about a second, which is what makes it usable mid-sentence.
  */
  const lookUp = async (about) => {
    const r = await fetch(VOICE + '/look', {
      method: 'POST',
      headers: {
        Authorization: 'Bearer ' + (localStorage.getItem(KEY) || ''),
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ about }),
    })
    const body = await r.json()
    if (!r.ok) throw new Error(body.error || ('The office returned ' + r.status))
    return body.found
  }

  const askOffice = async (said) => {
    const r = await fetch(VOICE + '/turn', {
      method: 'POST',
      headers: {
        Authorization: 'Bearer ' + (localStorage.getItem(KEY) || ''),
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ said, session }),
    })
    const body = await r.json()
    if (!r.ok) throw new Error(body.error || ('The office returned ' + r.status))
    return body
  }

  // --- typing ---------------------------------------------------------------

  const send = async (said) => {
    state.textContent = 'Thinking…'
    try {
      const body = await askOffice(said)
      show('The team', body.speak, body.did === 'delegated' ? 'delegated' : '')
      state.textContent =
        body.did === 'delegated'
          ? 'Put to the team — the answer comes back in Slack and Telegram.'
          : 'Ask another.'
    } catch (e) {
      show('The team', 'I could not reach the office: ' + e.message, 'bad')
      state.textContent = 'Ask another.'
    }
  }

  form.onsubmit = (e) => {
    e.preventDefault()
    const said = box.value.trim()
    if (said === '') return
    box.value = ''
    show('You', said)
    send(said)
  }

  // --- the call -------------------------------------------------------------

  /*
    Stop, and mean it.

    Grant: *"also stop talking doesnt work"*.

    Closing the peer connection stops audio ARRIVING. It does nothing about the
    audio already handed to the `<audio>` element, which happily plays out its
    buffer — several seconds of Claire finishing her sentence after he pressed
    stop. And the element was a `const` scoped inside the connect block, so
    nothing outside it could have paused it even if it had thought to.

    So: cancel the response at the server, clear the audio the server has
    already sent (`output_audio_buffer.clear` is the WebRTC-specific event for
    exactly this), then tear down, then silence the element locally. In that
    order — the local pause is the backstop, not the mechanism, because a
    backstop alone leaves the server still generating.
  */
  const emit = (event) => {
    try {
      if (channel?.readyState === 'open') channel.send(JSON.stringify(event))
    } catch (e) { /* the channel is going away anyway */ }
  }

  /*
    Throw away audio the server has already sent us.

    WebRTC-specific: `output_audio_buffer.clear` stops what is queued for
    playback. It does NOT stop the server generating — that is
    `response.cancel`, and the two are kept apart deliberately. See the note on
    `speech_started` below for what happens when they are not.
  */
  const dropBufferedAudio = () => { emit({ type: 'output_audio_buffer.clear' }) }

  const silence = () => {
    if (answering) emit({ type: 'response.cancel' })
    dropBufferedAudio()
    answering = false
  }

  const hangUp = (why) => {
    onCall = false
    silence()
    try { channel?.close() } catch (e) { /* already gone */ }
    try { pc?.close() } catch (e) { /* already gone */ }
    stream?.getTracks().forEach((t) => t.stop())
    if (speaker !== null) {
      speaker.pause()
      speaker.srcObject = null
      speaker = null
    }
    pc = null; stream = null; channel = null
    callBtn.classList.remove('on')
    callBtn.textContent = '📞'
    callBtn.title = 'Start a voice call with Claire'
    state.textContent = why || 'Call ended. Press the phone to call again.'
  }

  /*
    A tool call from Claire.

    She says what she is doing before she calls it, so by the time this runs
    Grant has already heard "right, I will put that to Emma" — which is why
    the delay of a real office round trip is tolerable in a conversation. The
    result goes back as a function_call_output and she is asked to respond;
    without that second `response.create` she calls the tool and then says
    nothing, which sounds exactly like a crash.
  */
  const runTool = async (callId, name, argsJson) => {
    let args = {}
    try { args = JSON.parse(argsJson) || {} } catch (e) { args = {} }

    let result
    if (name === 'look_up') {
      // Instant, and she keeps talking through it — so the status line says
      // what she is doing rather than the page going quiet.
      state.textContent = 'Looking that up…'
      try {
        result = { ok: true, found: await lookUp(String(args.about || '')) }
      } catch (e) {
        result = { ok: false, error: e.message }
      }
      state.textContent = onCall ? 'On a call with Claire.' : 'Ask another.'
    } else {
      const said = String(args.said || '')
      if (said !== '') show('Claire → the team', said, 'delegated')
      state.textContent = 'Claire is putting that to the team…'
      try {
        const body = await askOffice(said)
        result = { ok: true, did: body.did, answer: body.speak }
      } catch (e) {
        result = { ok: false, error: e.message }
      }
      state.textContent = onCall ? 'On a call with Claire.' : 'Ask another.'
    }

    channel?.send(JSON.stringify({
      type: 'conversation.item.create',
      item: { type: 'function_call_output', call_id: callId, output: JSON.stringify(result) },
    }))
    channel?.send(JSON.stringify({ type: 'response.create' }))
  }

  const onEvent = (ev) => {
    switch (ev.type) {
      // Both spellings. The GA API renamed these from `response.audio_*` to
      // `response.output_audio_*` and still emits the old ones on some
      // deployments; listening for one name is how a transcript silently
      // stops appearing after an upstream release.
      case 'response.audio_transcript.done':
      case 'response.output_audio_transcript.done':
        if (ev.transcript) show('Claire', ev.transcript)
        break
      case 'conversation.item.input_audio_transcription.completed':
        if (ev.transcript) show('You', ev.transcript)
        break
      case 'response.function_call_arguments.done':
        runTool(ev.call_id, ev.name, ev.arguments)
        break
      case 'response.created':
        answering = true
        break
      case 'response.done':
        answering = false
        break
      case 'input_audio_buffer.speech_started':
        /*
          Grant: *"its cutting out a lot when she talks"*.

          This used to call `silence()` — cancel the response and dump the
          audio — on every one of these events. Which sounds right and is
          badly wrong, because `speech_started` is the VAD's *suspicion* that
          someone has begun speaking, not a fact. On a call played through a
          speaker it fires on her own voice getting past echo cancellation, on
          a breath, on a chair. Every false positive chopped her off
          mid-word, which is exactly what he heard, and it was me who put it
          there an hour earlier.

          Deciding whether an interruption really happened is the server's
          job: it has both audio streams and `interrupt_response: true` says
          to act on it. So this now only reports what is happening, and the
          audio is dropped on `conversation.item.truncated` — the server
          saying it HAS cut her off, rather than a guess that it might.
        */
        state.textContent = 'Listening…'
        break
      case 'conversation.item.truncated':
        // She really was interrupted. Now the queued audio is stale, and
        // playing it out is the several-seconds-behind effect.
        dropBufferedAudio()
        answering = false
        break
      case 'input_audio_buffer.speech_stopped':
        state.textContent = 'On a call with Claire.'
        break
      case 'error':
        show('Claire', 'Something went wrong on the call: ' +
          (ev.error?.message || JSON.stringify(ev.error)), 'bad')
        break
    }
  }

  callBtn.onclick = async () => {
    if (onCall) { hangUp(); return }
    onCall = true
    callBtn.classList.add('on')
    callBtn.textContent = '⏹'
    callBtn.title = 'End the call'
    state.textContent = 'Connecting…'

    try {
      const minted = await fetch(MINT, { method: 'POST' })
      if (!minted.ok) throw new Error('the office would not start a call (' + minted.status + ')')
      const { client_secret, model, degraded } = await minted.json()
      if (degraded) show('Claire', 'I am on a stripped-down session and cannot reach the team ' +
        'on this call — worth telling whoever looks after this.', 'bad')

      state.textContent = 'Asking for the microphone…'
      stream = await navigator.mediaDevices.getUserMedia({
        // Echo cancellation is what makes barge-in possible on a speaker.
        // Asked for explicitly so this is the browser doing its best rather
        // than whatever the default happens to be.
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
      })

      pc = new RTCPeerConnection()
      speaker = new Audio()
      speaker.autoplay = true
      pc.ontrack = (e) => { if (speaker !== null) speaker.srcObject = e.streams[0] }
      pc.addTrack(stream.getTracks()[0])
      // A dropped connection must not leave the button saying "on a call".
      pc.onconnectionstatechange = () => {
        if (onCall && (pc?.connectionState === 'failed' || pc?.connectionState === 'disconnected')) {
          hangUp('The call dropped. Press the phone to try again.')
        }
      }

      channel = pc.createDataChannel('oai-events')
      channel.onmessage = (e) => { try { onEvent(JSON.parse(e.data)) } catch (err) { /* not ours */ } }

      const offer = await pc.createOffer()
      await pc.setLocalDescription(offer)

      // SDP exchange at /v1/realtime/calls. Anything citing
      // /v1/realtime/sessions for this is stale (§4).
      const sdp = await fetch('https://api.openai.com/v1/realtime/calls?model=' +
        encodeURIComponent(model), {
        method: 'POST',
        headers: { Authorization: 'Bearer ' + client_secret, 'Content-Type': 'application/sdp' },
        body: offer.sdp,
      })
      if (!sdp.ok) throw new Error('the call would not connect (' + sdp.status + ')')
      await pc.setRemoteDescription({ type: 'answer', sdp: await sdp.text() })

      state.textContent = 'On a call with Claire. Talk over her whenever you like.'
    } catch (e) {
      const why = e.name === 'NotAllowedError'
        ? 'The microphone was refused. Allow it for this site, then press the phone again.'
        : String(e.message || e)
      hangUp(why)
    }
  }
}




/*
  Who messages you, and where.

  Grant: *"we should include routing options in the front end."*

  Everything on this page already existed and none of it was reachable: who
  may write to his private chat, how loud a thing must be to reach his phone,
  and which recurring jobs run at all. All three were mine to change and his
  to live with, which is backwards — he had spent two days telling me the team
  talks too much.

  Three controls, and each says what happens when you move it. A dial with no
  stated consequence is a dial nobody touches.
*/
function routing(d) {
  const people = d.people || []
  const duties = d.duties || []
  const group = d.office_group || {}
  const direct = d.direct_to_grant ?? ''
  const floor = d.pager_floor ?? 'important'

  const LOUDNESS = [
    ['trivial', 'Everything, including things nobody would act on'],
    ['routine', 'Anything the team finished'],
    ['important', 'Things worth looking at today'],
    ['urgent', 'Things that need you now'],
    ['blocker', 'Only when the team is stuck on you'],
  ]

  /*
    The switch Grant asked for after the Finance Director's daily report
    reached him in the office group.

    Separate from "who can message you directly", and the separation is the
    point: that one decides WHICH CHAT somebody lands in, and it was already set
    to the chief — which routed everybody else into the group he is a member of.
    Redirecting a message he can still read is not silence.
  */
  const quiet = d.only_chief_speaks === true
  const chief = `
    <label class="fld"><span>Who sends you Telegram messages at all</span>
      <select data-routing="only_chief_speaks">
        <option value="true"${quiet ? ' selected' : ''}>Only the Chief of Staff</option>
        <option value="false"${quiet ? '' : ' selected'}>Anyone on the team</option>
      </select>
      <em>The rest still do the work and still write it up — you just read it
      here instead of being messaged. To stop the work itself, switch the duty
      off below.</em>
    </label>`

  const who = `
    <label class="fld"><span>Who can message you directly</span>
      <select data-routing="direct_to_grant">
        <option value=""${direct === '' ? ' selected' : ''}>Anyone on the team</option>
        ${people
          .map(
            (p) =>
              `<option value="${esc(p.slug)}"${direct === p.slug ? ' selected' : ''}>Only ${esc(p.name)} — ${esc(p.title)}</option>`,
          )
          .join('')}
      </select>
      <em>${
        group.exists
          ? 'Everyone else posts in ' + esc(group.title || 'the team group') + ' instead.'
          : 'There is no team group yet, so everyone reaches you directly until there is one.'
      }</em>
    </label>`

  const loud = `
    <label class="fld"><span>How loud before it reaches your phone</span>
      <select data-routing="pager_floor">
        ${LOUDNESS.map(
          ([k, label]) =>
            `<option value="${k}"${floor === k ? ' selected' : ''}>${esc(label)}</option>`,
        ).join('')}
      </select>
      <em>Everything quieter still appears in Slack. Nothing is lost by raising
        this — it stops buzzing, it does not stop happening.</em>
    </label>`

  const duty = (r) => `
    <div class="svc">
      <span class="lamp ${r.enabled ? 'ok' : ''}" aria-hidden="true"></span>
      <span class="who"><b>${esc(r.slug.replace(/-/g, ' '))}</b>
        <span>${esc(r.what || '')}</span>
        <span class="meta">${esc(r.owner || 'nobody')} · every ${String(Math.round((r.every_minutes || 0) / 60) || 1)}h · last ran ${esc(r.last_run || 'never')}</span></span>
      <button type="button" class="ghost" data-duty="${esc(r.slug)}" data-to="${r.enabled ? 'off' : 'on'}">
        ${r.enabled ? 'Switch off' : 'Switch on'}</button>
    </div>`

  return `
    <section class="card wide"><h2>Who messages you, and where</h2><div class="body">
      ${chief}
      ${who}
      ${loud}
      <p class="meta" id="routing-said"></p>
    </div></section>

    <section class="card wide"><h2>What runs on its own</h2><div class="body">
      <p class="meta">Switching one off stops the work, not only the message.
        A job that finds nothing says nothing either way.</p>
      ${duties.map(duty).join('')}
    </div></section>`
}

function wireRouting() {
  const said = document.getElementById('routing-said')
  const tell = (text) => {
    if (said !== null) said.textContent = text
  }

  for (const select of document.querySelectorAll('[data-routing]')) {
    select.onchange = async () => {
      const what = select.getAttribute('data-routing')
      tell('Saving…')
      try {
        await act('routing_set', { p_what: what, p_value: select.value })
        tell('Saved. It applies to the next thing the team finishes.')
      } catch (e) {
        tell('Could not save that: ' + e.message)
      }
    }
  }

  for (const button of document.querySelectorAll('[data-duty]')) {
    button.onclick = async () => {
      const slug = button.getAttribute('data-duty')
      const to = button.getAttribute('data-to')
      button.disabled = true
      tell('Saving…')
      try {
        await act('routing_set', { p_what: 'duty:' + slug, p_value: to })
        // Reloaded rather than toggled in place: the lamp, the button and the
        // "last ran" line all move together, and three hand-updated bits of
        // DOM is three chances to show a state the database does not have.
        await show('routing')
      } catch (e) {
        tell('Could not save that: ' + e.message)
        button.disabled = false
      }
    }
  }
}

/*
  Set up — the page that answers "what should I do".

  Grant, three times now, on the interface not being intuitive. The first two
  passes added explanation to pages that already existed, which was the wrong
  shape: a dashboard explains what you are LOOKING at, and cannot answer what to
  do, because that answer is spread across Connections being red, Settings
  having four Google steps, and a document in the repository.

  So this page is a checklist and nothing else. `app.hq_setup` knows the state
  of every service; this renders it, largest first, with one action per row.

  Three states, not two: `off` is a thing switched off on purpose and must not
  read as an outstanding task, or the list grows a permanent red item and stops
  being a list.
*/
function setup(d) {
  const services = d.services || []
  const lamp = { ready: 'ok', action: 'warn', off: '' }
  const word = { ready: 'Working', action: 'Needs you', off: 'Switched off' }

  const row = (s) => `
    <div class="svc" data-svc="${esc(s.key)}">
      <span class="lamp ${lamp[s.state] ?? ''}" aria-hidden="true"></span>
      <div class="svc-body">
        <div class="row" style="margin:0;gap:8px">
          <b>${esc(s.name)}</b>
          <span class="pill">${esc(s.vendor)}</span>
          <span class="m">${esc(word[s.state] ?? s.state)}</span>
        </div>
        <div class="m">${esc(s.does)}</div>
        <div class="m" style="opacity:.75">${esc(s.detail || '')}</div>
        ${s.key === 'google' ? googleBlock(d.google || {}) : ''}
        ${readingToggle(d, s.key)}
      </div>
      ${
        // No pill for a row that carries its own controls. Google's action is
        // the box inside the row, and repeating it as an unclickable chip on
        // the right was a button that did nothing — which teaches that buttons
        // do nothing.
        s.action && s.href && s.key !== 'google'
          ? `<a class="mini go" href="${esc(s.href)}" target="_blank" rel="noopener">${esc(s.action)} →</a>`
          : ''
      }
    </div>`

  return `
    <section class="card wide" data-card="setup"><h2>What needs you</h2>
      <div class="body">
        <div class="tiles">
          <div class="tile"><b>${d.ready ?? 0}</b><span>working</span></div>
          <div class="tile ${(d.needs_you ?? 0) > 0 ? 'warn' : ''}"><b>${d.needs_you ?? 0}</b><span>need you</span></div>
        </div>
        <div class="svcs">${services.map(row).join('')}</div>
      </div>
    </section>`
}

/*
  Google, as one button once and one button after that.

  Grant: *"I don't understand why you're making it so complicated on the back
  end. It should be just, like, if someone wants to add connection to Gmail,
  connection to Google Calendar, you just click on a button, and then it brings
  up the Google authenticator in the browser."*

  He is right about the experience and there is one unavoidable piece behind it.
  An Apple app is one click because the vendor ships its own OAuth client,
  registered with Google under their name. This runs on his own Google Cloud
  project, on his own account, deliberately — ADR-0013 and the account
  suspension in September both point the same way — so the client has to be
  registered once, by him.

  Once. After that Google is one button, and each service is one button, sharing
  the same client through incremental consent. So the console step is collapsed
  by default, states plainly that it happens once, and gives him the two values
  to copy in the order Google asks for them.
*/
function googleBlock(g) {
  /*
    Grant, twice: *"it should be just, like, if someone wants to add connection
    to Gmail, connection to Google Calendar, you just click on a button, and
    then it brings up the Google authenticator in the browser. You connect to
    your account, and then it's done, like so many Apple applications do."*

    So that is what this is: a row per service, one button each, straight to
    Google. What made it complicated before was not Google — it was that all
    four services shared one scope string in Advanced Settings, so adding Gmail
    meant editing a setting by hand and signing in again.

    The one-time registration above it is genuinely unavoidable. Google has no
    public API for creating an OAuth client (the only programmatic one is
    locked to Identity-Aware Proxy with an unchangeable redirect URI), so every
    application that offers "Sign in with Google" was registered by hand once,
    by the company that shipped it. This one is Grant's. Said plainly, with the
    exact values to paste, and never shown again once it is done.
  */
  const start = API.replace(/\/hq-api$/, '/google-oauth/start')

  const services = (g.services || []).map((s) => `
    <div class="gsvc">
      <div class="gsvc-t">
        <b>${esc(s.name)}</b>
        ${s.connected ? '<span class="ok">Connected</span>' : ''}
      </div>
      <div class="m">${esc(s.does)}</div>
      <a class="go${s.connected ? ' again' : ''}" href="${esc(start)}?service=${esc(s.slug)}">
        ${s.connected ? 'Reconnect' : 'Connect'}
      </a>
    </div>`).join('')

  if (g.ready) {
    return `
      <div class="stepbox">
        <div class="m">Press Connect and Google asks you to approve that one service.
          Nothing else changes — connecting Gmail cannot disconnect your calendar.</div>
        ${services}
        ${g.has_refresh_token
          ? `<div class="row" style="margin-top:10px">
               <button class="mini" id="google-forget">Disconnect Google entirely</button>
               <span class="m">Removes the stored permission for every service above.</span>
             </div>`
          : ''}
      </div>`
  }

  return `
    <div class="stepbox">
      <details open>
        <summary>One thing first, once — register this app with Google</summary>
        <p class="m">Google will not let any application touch your data until that
          application is registered. Every "Sign in with Google" button you have ever
          pressed works because the company that made the app did this once, years ago.
          There is no way to do it by API — Google does not offer one. This app is
          yours, so it is yours to register: about five minutes, once, and then every
          Google service below is a single button, forever, including for anyone you
          set this up for later.</p>
        <ol class="m">
          <li>Open <a href="https://console.cloud.google.com/apis/credentials" target="_blank" rel="noopener">console.cloud.google.com/apis/credentials</a>,
              press <b>Create credentials → OAuth client ID</b>, and choose type
              <b>Web application</b>.</li>
          <li>Under <b>Authorised redirect URIs</b> press <b>Add URI</b> and paste this
              exactly:</li>
        </ol>
        <input readonly value="${esc(g.redirect_uri || '')}" onclick="this.select()">
        <ol class="m" start="3">
          <li>Press <b>Create</b>. Google shows a client ID and a client secret. Paste
              both here and press Save.</li>
        </ol>
      </details>
      <label class="fld"><span>Client ID</span>
        <input id="g-id" value="${esc(g.client_id || '')}" placeholder="…apps.googleusercontent.com" autocomplete="off">
      </label>
      <label class="fld"><span>Client secret</span>
        <input id="g-secret" type="password" autocomplete="off"
               placeholder="${g.has_secret ? '•••••••• stored — paste again to replace' : 'GOCSPX-…'}">
        <em>Stored in the vault. This page can write it and can never read it back.</em>
      </label>
      <div class="row">
        <button id="g-save">Save</button>
        <span class="m">Save both and the Connect buttons appear here.</span>
        <span id="g-said" class="m"></span>
      </div>
    </div>`
}

/* A service is a switch once the account is connected — never another sign-in. */
/*
  The switch for a service that reads something.

  Was `calendarToggle`, hard-coded to one key. Gmail arrived with the same
  shape — connected is permission, switched on is instruction, and §17 wants
  both separately switchable — and a second copy of this function would be the
  second place to forget that a connection is not consent to read.

  So: a table of the services that have a reading switch, and one function.
  A service missing from the table simply gets no switch, which is right for
  Drive and YouTube until something actually reads them.
*/
const READING_SWITCH = {
  calendar: { setting: 'calendar.enabled', reads: 'your diary' },
  gmail: { setting: 'gmail.enabled', reads: 'your inbox' },
}

function readingToggle(d, key) {
  const spec = READING_SWITCH[key]
  if (spec === undefined) return ''
  if (!(d.google || {}).has_refresh_token) {
    return `<div class="m" style="margin-top:6px">Connect Google above, then you can switch reading ${esc(spec.reads)} on.</div>`
  }
  const on = (d.settings || {})[spec.setting] === true
  return `<div class="row" style="margin-top:8px">
    <button class="mini" data-reading="${esc(key)}" data-setting="${esc(spec.setting)}"
            data-to="${on ? 'false' : 'true'}">${on ? 'Stop reading' : `Start reading ${esc(spec.reads)}`}</button>
    <span data-reading-said="${esc(key)}" class="m">${on ? `Reading ${esc(spec.reads)} every hour.` : 'Connected, but not reading anything yet.'}</span>
  </div>`
}

function wireSetup() {
  const said = (id, text) => {
    const el = document.getElementById(id)
    if (el) el.textContent = text
  }
  const save = document.getElementById('g-save')
  if (save) {
    save.onclick = async () => {
      const id = (document.getElementById('g-id') || {}).value || ''
      const secret = (document.getElementById('g-secret') || {}).value || ''
      save.disabled = true
      said('g-said', 'Saving…')
      try {
        if (id.trim()) await act('set_setting', { p_key: 'google.client_id', p_value: id.trim() })
        if (secret.trim()) await act('set_google_secret', { p_secret: secret.trim() })
        said('g-said', 'Saved.')
        show('setup')
      } catch (e) {
        said('g-said', e.message)
      }
      save.disabled = false
    }
  }

  for (const b of document.querySelectorAll('[data-reading]')) {
    b.onclick = async () => {
      const key = b.dataset.reading
      const said = document.querySelector(`[data-reading-said="${key}"]`)
      b.disabled = true
      if (said) said.textContent = 'Saving…'
      try {
        await act('set_setting', { p_key: b.dataset.setting, p_value: b.dataset.to })
        show('setup')
      } catch (e) {
        if (said) said.textContent = e.message
        b.disabled = false
      }
    }
  }

  const forget = document.getElementById('google-forget')
  if (forget) {
    forget.onclick = async () => {
      // Signing out is destructive in the only sense that matters here: it
      // throws away a consent he gave, and getting it back means the consent
      // screen again. So it asks.
      if (!window.confirm('Sign out of Google? You will need to sign in again to use Calendar.')) {
        return
      }
      forget.disabled = true
      try {
        await act('forget_google', {})
        show('setup')
      } catch (e) {
        forget.disabled = false
      }
    }
  }
}
