<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0f1115">
<title>Team HQ</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230f1115'/><text y='68' x='50' font-size='58' text-anchor='middle' fill='%23e7e9ee'>◆</text></svg>">
<style>
/*
  Mobile-first, and the desktop rules are the additions rather than the other
  way round. §25 asks for "mobile-first interaction with desktop information
  density", which is a real tension: the phone wants one column and big touch
  targets, the desktop wants to show forty jobs without scrolling. The
  resolution here is that the CARD is the unit on both, and on a wide screen the
  cards flow into columns and their internal padding tightens.
*/
/*
  Grant: *"you also need to make the front end a lot more attractive, better
  colours, menus etc.. with more explanation of each component, what to do."*

  Three separate asks, and they are answered in three places:

    - colour, here: an indigo accent over slightly cooler neutrals, a raised
      surface token so a card can sit ON something rather than beside it, and
      one soft shadow instead of the flat hairline-box look;
    - menus, in `shell()`: nine equal pills became five named groups, a real
      sidebar on a wide screen;
    - explanation, in `GUIDE` and `HINTS`: every tab says what it is for and
      what to do on it, and every card gets a line under its heading.

  The chart colour is deliberately NOT the new accent. `--series` keeps the
  values the palette validator actually passed — #2f6df6 on light, #5c8cf5 on
  dark — because a chart colour answers to a lightness band and a chroma floor
  that a UI accent does not, and re-pointing it at the indigo would be claiming
  a check that was never run on it.
*/
:root {
  --bg: #f2f4f9; --panel: #ffffff; --panel-2: #f8f9fc;
  --ink: #12141c; --muted: #5a6072;
  --line: #e2e5ee; --accent: #4f46e5; --accent-2: #7c3aed;
  --accent-soft: rgba(79, 70, 229, 0.10);
  --warn: #b45309; --bad: #be123c; --good: #0f766e;
  /* Validated against the light surface: inside the lightness band, above the
     chroma floor, over 3:1 contrast. Not eyeballed — the palette validator was
     run, and the lighter step FAILED the dark band at L 0.703, which is why the
     dark series colour below is a different value. */
  --series: #2f6df6;
  --shadow: 0 1px 2px rgba(16, 20, 40, 0.04), 0 10px 28px -16px rgba(16, 20, 40, 0.18);
  --radius: 14px;
  --pad: 16px;
  font-synthesis-weight: none;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b0d14; --panel: #14171f; --panel-2: #1a1e28;
    --ink: #e8eaf2; --muted: #98a0b4;
    --line: #252a36; --accent: #a5b4fc; --accent-2: #c4b5fd;
    --accent-soft: rgba(165, 180, 252, 0.12);
    --warn: #f0b47a; --bad: #fb7185; --good: #2dd4a7;
    /* #5c8cf5, not the accent: the lighter step is outside the dark lightness
       band. A chart colour and a UI accent answer to different checks and are
       allowed to differ. */
    --series: #5c8cf5;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 12px 32px -18px rgba(0, 0, 0, 0.8);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
header {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: saturate(180%) blur(14px);
  border-bottom: 1px solid var(--line);
  padding: 10px var(--pad);
  display: flex; align-items: center; gap: 11px;
}
/* The mark. A gradient square with a diamond in it — enough to make the tab
   and the home-screen icon recognisable at a glance, and cheap: two elements
   and no image request. */
.mark {
  width: 28px; height: 28px; border-radius: 9px; flex: none;
  background: linear-gradient(140deg, var(--accent), var(--accent-2));
  display: grid; place-items: center; color: #fff; font-size: 14px;
  box-shadow: 0 2px 8px -2px color-mix(in srgb, var(--accent) 55%, transparent);
}
.brand { min-width: 0; }
h1 { font-size: 16px; margin: 0; letter-spacing: -0.015em; line-height: 1.15; }
.brand span { display: block; color: var(--muted); font-size: 11.5px; }
#stamp { color: var(--muted); font-size: 12px; margin-left: auto; font-variant-numeric: tabular-nums;
  white-space: nowrap; }

/*
  The menu. Nine equal pills gave no clue which of them answered a question, so
  they are grouped under five headings — and the headings only appear where
  there is room for them, which is the sidebar.

  `display: contents` on a group is what lets ONE nav element be both: on a
  phone the group vanishes as a box and its buttons flow into the horizontal
  strip; on a wide screen the group becomes a block with its label showing.
*/
nav { display: flex; gap: 5px; padding: 9px var(--pad) 0; overflow-x: auto; scrollbar-width: none; }
nav::-webkit-scrollbar { display: none; }
nav .grp { display: contents; }
nav .lbl { display: none; }
nav button {
  appearance: none; border: 1px solid var(--line); background: var(--panel);
  color: var(--muted); border-radius: 999px; padding: 8px 14px; font: inherit;
  font-size: 14px; white-space: nowrap; cursor: pointer; min-height: 38px;
  transition: color 0.12s, border-color 0.12s, background 0.12s;
}
nav button:hover { color: var(--ink); border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
nav button[aria-current="true"] {
  color: #fff; border-color: transparent;
  background: linear-gradient(140deg, var(--accent), var(--accent-2));
}
@media (prefers-color-scheme: dark) {
  nav button[aria-current="true"] { color: #0b0d14; }
}
main { padding: var(--pad); display: grid; gap: 12px; }

/*
  What this tab is for, above the cards.

  Grant: *"more explanation of each component, what to do."* Two sentences, and
  they are two DIFFERENT sentences on purpose: what the tab shows, and what he
  can do about it — including "nothing, this is a read-out", which is the honest
  answer on most of them and the one a dashboard usually leaves him to infer.
*/
.lede { padding: 14px var(--pad) 0; max-width: 74ch; }
.lede h2 { margin: 0 0 3px; font-size: 19px; letter-spacing: -0.02em; }
.lede p { margin: 0 0 7px; color: var(--muted); font-size: 13.5px; line-height: 1.55; }
/* The second half — what to do — carries a rule so the two sentences are not
   two paragraphs of equal weight saying different kinds of thing. */
.lede p.todo {
  margin: 0; color: var(--ink); border-left: 2px solid var(--accent);
  padding-left: 10px;
}

@media (min-width: 1040px) {
  :root { --pad: 26px; }
  /* The rail carries the divider and the nav sticks inside it. The border was
     on the nav itself at first, which made it stop wherever the last menu item
     did — a line that ends two thirds of the way down a long page reads as a
     rendering fault. */
  .frame { display: grid; grid-template-columns: 226px minmax(0, 1fr); align-items: stretch; }
  .rail { border-right: 1px solid var(--line); }
  nav {
    flex-direction: column; gap: 2px; overflow: visible;
    position: sticky; top: 50px; padding: 16px 12px 24px;
  }
  nav .grp { display: block; margin-bottom: 14px; }
  nav .lbl {
    display: block; font-size: 10.5px; font-weight: 700; letter-spacing: 0.09em;
    text-transform: uppercase; color: var(--muted); padding: 0 10px 5px; opacity: 0.75;
  }
  nav button {
    display: block; width: 100%; text-align: left; border: 0; background: transparent;
    border-radius: 9px; padding: 8px 10px; min-height: 34px; font-size: 14px;
  }
  nav button:hover { background: var(--accent-soft); color: var(--ink); }
  nav button[aria-current="true"] {
    background: var(--accent-soft); color: var(--accent); font-weight: 600;
  }
  @media (prefers-color-scheme: dark) {
    nav button[aria-current="true"] { color: var(--accent); }
  }
  .lede { padding: 20px var(--pad) 0; }
}
@media (min-width: 760px) {
  main { grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); align-items: start; }
  .wide { grid-column: 1 / -1; }
}
.card {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 15px; box-shadow: var(--shadow);
}
.card h2 { font-size: 12.5px; text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--muted); margin: 0 0 4px; font-weight: 600; }
/* A line under the heading saying what the card is. Injected from HINTS after
   render, so a view function does not have to carry its own documentation and
   a card added later simply has no hint rather than a stale one. */
.card .hint { color: var(--muted); font-size: 12.5px; margin: 0 0 11px;
  padding-bottom: 9px; border-bottom: 1px dashed var(--line); }
.card.collapsed .hint { display: none; }
.card h2:only-child, .card h2 + .body { margin-bottom: 0; }
.card > h2 { margin-bottom: 10px; }
.card > h2:has(+ .hint) { margin-bottom: 4px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
/* auto-FILL, not auto-fit. With auto-fit five tiles stretch to fill a 1900px
   row and a single digit gets 300px of card to itself, which is the opposite of
   the "desktop information density" §25 asks for. */
@media (min-width: 760px) { .tiles { grid-template-columns: repeat(auto-fill, minmax(112px, 0.2fr)); } }
.tile { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
.tile b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.tile span { color: var(--muted); font-size: 12px; }
.tile.bad b { color: var(--bad); } .tile.warn b { color: var(--warn); }
ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
li { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--bg); }
li .row { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
li .t { font-weight: 600; }
li .m, .meta { color: var(--muted); font-size: 12.5px; }
.pill { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line);
  color: var(--muted); white-space: nowrap; }
.pill.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
.pill.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, var(--line)); }
.pill.good { color: var(--good); border-color: color-mix(in srgb, var(--good) 40%, var(--line)); }

/*
  The light. A filled dot with a soft halo, because a 8px dot alone is hard to
  find on a phone and the halo doubles the target the eye lands on.

  Colour is never the only signal: each row also carries a word. A red/green
  pair is the commonest accessibility failure in a status page, and roughly one
  man in twelve cannot tell these two apart.
*/
.lamp { width: 9px; height: 9px; border-radius: 50%; flex: none; display: inline-block;
  background: var(--muted); box-shadow: 0 0 0 3px color-mix(in srgb, var(--muted) 18%, transparent); }
.lamp.ok { background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 20%, transparent); }
.lamp.bad { background: var(--bad); box-shadow: 0 0 0 3px color-mix(in srgb, var(--bad) 20%, transparent); }
.lamp.warn { background: var(--warn); box-shadow: 0 0 0 3px color-mix(in srgb, var(--warn) 20%, transparent); }
.conn { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.conn:last-child { border-bottom: 0; }
.conn .who { min-width: 0; }
.conn .who b { display: block; font-weight: 600; }
.conn .who span { display: block; color: var(--muted); font-size: 12px; }
.conn .st { margin-left: auto; text-align: right; font-size: 12px; color: var(--muted);
  max-width: 46%; }
/* On a wide card the status has room to be a sentence rather than four words a
   line, and the two columns stop fighting over the same 340px. */
@media (min-width: 760px) { .card.wide .conn .st { max-width: 62%; } }
.conn .st b { display: block; color: var(--ink); font-weight: 600; }
.stale { color: var(--warn); }

/* Configuration controls. Deliberately plain: this is a settings surface, and
   a settings surface that looks exciting is a settings surface people press by
   accident. */
/* The one real button shape, used by Save and Create. Quiet enough for a
   settings page, distinct enough not to be read as a label. */
/* `:not(.mini)`, because `.mini` is the quiet variant and the staff card uses
   it for both Save and Retire. Without the exclusion the two looked identical
   — a destructive action wearing the primary style, eight times down the page. */
.row > button:not(.mini), .addrow button {
  appearance: none; font: inherit; font-weight: 600; font-size: 13.5px; cursor: pointer;
  padding: 9px 16px; min-height: 38px; border-radius: 9px; border: 1px solid transparent;
  color: #fff; background: linear-gradient(140deg, var(--accent), var(--accent-2));
}
@media (prefers-color-scheme: dark) {
  .row > button:not(.mini), .addrow button { color: #0b0d14; }
}
.row > button:not(.mini):hover, .addrow button:hover { filter: brightness(1.06); }
/* Retire and Bring back. Outlined, and the border warms on hover — this is the
   one control on the page that stops a colleague being given work. */
.mini[data-retire] { color: var(--muted); }
.mini[data-retire]:hover { color: var(--warn);
  border-color: color-mix(in srgb, var(--warn) 55%, var(--line)); }
.mini { font-size: 12px; padding: 5px 11px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--panel); color: var(--ink); cursor: pointer; margin-left: 8px;
  text-decoration: none; display: inline-block; }
.mini:hover { border-color: var(--accent); color: var(--accent); }
.addrow { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
.addrow input, .addrow select { flex: 1 1 150px; min-width: 0; padding: 8px 10px; font: inherit;
  border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
.addrow button { flex: 0 0 auto; }
/* One setting per row, label above the control: a phone is narrow and a
   two-column settings form on a phone is a two-column settings form nobody
   fills in. */
.fld { display: block; padding: 10px 0; border-bottom: 1px solid var(--line); }
.fld:last-child { border-bottom: 0; }
.fld > span { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; }
.fld input, .fld select { width: 100%; padding: 8px 10px; font: inherit; box-sizing: border-box;
  border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
.fld em { display: block; font-style: normal; color: var(--muted); font-size: 12px; margin-top: 4px; }
/* Editable in place. The inputs are deliberately quiet until focused: eight
   people each with four boxes would otherwise be a wall of form. */
.person input, .person select, .person textarea { width: 100%; font: inherit; box-sizing: border-box;
  padding: 5px 7px; margin-top: 4px; border: 1px solid transparent; border-radius: 6px;
  background: var(--bg); color: var(--ink); resize: vertical; }
.person input:focus, .person select:focus, .person textarea:focus { border-color: var(--accent); outline: none; }
.person input.nm { font-weight: 600; }
.person .namerow { display: flex; gap: 6px; }
.person .namerow .nm { flex: 1 1 auto; }
.person .namerow select { flex: 0 0 auto; width: auto; font-size: 12px; color: var(--muted); }
.person[data-retired] { opacity: 0.5; }
.row { display: flex; gap: 10px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
.staff { display: grid; gap: 10px; }
.person { display: flex; gap: 12px; align-items: flex-start; }
.person img { width: 46px; height: 46px; border-radius: 50%; object-fit: cover;
  background: var(--bg); flex: none; }
.person .n { font-weight: 600; }
.empty { color: var(--muted); padding: 6px 2px; }
.est { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 0.05em;
  color: var(--warn); border: 1px solid color-mix(in srgb, var(--warn) 45%, var(--line));
  border-radius: 5px; padding: 1px 6px; margin-left: 6px; vertical-align: 1px; }
/* --- Talk to team -------------------------------------------------------
   A big target and an obvious state. The microphone button is the one control
   on this page pressed while looking at something else, so it says what it is
   doing in a word and in a colour, and the words appear underneath either way
   — a browser that will not speak still shows every reply. */
.talkwrap { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 4px; }
.mic {
  appearance: none; border: 0; cursor: pointer; font: inherit; font-weight: 600;
  font-size: 16px; color: #fff; min-width: 116px; min-height: 116px;
  border-radius: 50%; flex: none;
  background: linear-gradient(140deg, var(--accent), var(--accent-2));
  box-shadow: 0 8px 26px -10px color-mix(in srgb, var(--accent) 80%, transparent);
  transition: transform 0.12s;
}
@media (prefers-color-scheme: dark) { .mic { color: #0b0d14; } }
.mic:hover { transform: scale(1.02); }
.mic.on {
  background: linear-gradient(140deg, var(--bad), var(--warn));
  animation: listening 1.4s ease-in-out infinite;
}
@keyframes listening {
  0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--bad) 45%, transparent); }
  50% { box-shadow: 0 0 0 16px color-mix(in srgb, var(--bad) 0%, transparent); }
}
@media (prefers-reduced-motion: reduce) { .mic.on { animation: none; } }
.talkstate { color: var(--muted); font-size: 13.5px; min-width: 0; flex: 1 1 200px; }
.turns { display: grid; gap: 8px; margin-top: 14px; }
/* Newest first: the last thing said is the thing being read. */
.turn { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
  background: var(--bg); }
.turn b { display: block; font-size: 11px; text-transform: uppercase;
  letter-spacing: 0.06em; color: var(--muted); margin-bottom: 3px; }
.turn.delegated { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.turn.bad { border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.turn.bad span { color: var(--bad); }

.gate { max-width: 420px; margin: 12vh auto; padding: 0 var(--pad); }
.gate input { width: 100%; padding: 12px; font: inherit; border-radius: 10px;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
.gate button { width: 100%; margin-top: 10px; padding: 12px; font: inherit; font-weight: 600;
  border-radius: 10px; border: 0; min-height: 46px; cursor: pointer; color: #fff;
  background: linear-gradient(140deg, var(--accent), var(--accent-2));
  box-shadow: 0 4px 14px -6px color-mix(in srgb, var(--accent) 70%, transparent); }
@media (prefers-color-scheme: dark) { .gate button { color: #0b0d14; } }
.err { color: var(--bad); font-size: 13px; margin-top: 10px; }
footer { color: var(--muted); font-size: 12px; padding: 4px var(--pad) 28px; }

/* --- charts ------------------------------------------------------------
   A sparkline, not a chart with axes: the tile's big number IS the last
   value's direct label, so the line only has to carry shape. That also
   sidesteps an end-marker, which at this height could not meet the 8px
   minimum without dominating the plot.
   One series, so no legend — the heading names it.                        */
.spark { display: block; width: 100%; height: 44px; overflow: visible; touch-action: pan-y; }
.spark path.line { fill: none; stroke: var(--series); stroke-width: 2;
  stroke-linejoin: round; stroke-linecap: round; }
.spark path.area { fill: color-mix(in srgb, var(--series) 14%, transparent); stroke: none; }
.spark .cross { stroke: var(--muted); stroke-width: 1; opacity: 0; }
.spark .dot { fill: var(--series); stroke: var(--panel); stroke-width: 2; opacity: 0; }
.spark.on .cross, .spark.on .dot { opacity: 1; }
.sparkwrap { position: relative; }
.tip { position: absolute; pointer-events: none; opacity: 0; transform: translate(-50%, -120%);
  background: var(--ink); color: var(--panel); font-size: 12px; padding: 4px 8px;
  border-radius: 7px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.tip.on { opacity: 1; }
.chartrow { display: flex; align-items: baseline; gap: 8px; margin-bottom: 2px; }
.chartrow b { font-size: 24px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.chartrow span { color: var(--muted); font-size: 12.5px; }
details.values { margin-top: 8px; }
details.values summary { color: var(--muted); font-size: 12px; cursor: pointer; min-height: 24px; }
details.values table { width: 100%; border-collapse: collapse; margin-top: 6px; font-size: 12.5px; }
details.values td { padding: 2px 0; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
details.values td:last-child { text-align: right; }
.card > .drag { float: right; color: var(--muted); cursor: grab; font-size: 15px; line-height: 1;
  padding: 0 2px; user-select: none; }
.card.collapsed .body { display: none; }
.card h2 { cursor: pointer; user-select: none; }
</style>
</head>
<body>
<div id="app"></div>

<script>
/*
  One page, no framework, no build step.
  §2's first principle is "frontend simplicity, backend sophistication", and the
  whole of the interesting work here happens in Postgres. A build pipeline for
  four fetches and some DOM would be the tail wagging the dog — and it would put
  a toolchain between a bug and its fix.

  The API is named once, here, and the token lives only in localStorage on the
  device. Nothing is cached: every view is what the database says right now,
  because a dashboard showing yesterday's blockers is worse than one that is
  briefly blank.
*/
const API = window.HQ_API || 'https://baujwlzcziasnfhhkchg.supabase.co/functions/v1/hq-api'
const KEY = 'hq.token'
const app = document.getElementById('app')

const esc = (v) => String(v ?? '').replace(/[&<>"]/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])

const ago = (iso) => {
  if (!iso) return '—'
  const mins = Math.round((Date.now() - new Date(iso).getTime()) / 60000)
  if (mins < 1) return 'just now'
  if (mins < 60) return mins + 'm ago'
  const h = Math.round(mins / 60)
  if (h < 24) return h + 'h ago'
  return Math.round(h / 24) + 'd ago'
}

/*
  A tab is not a section. "Trends" is what the tab says and `series` is what the
  API calls it, and the first version passed the tab name straight through and
  got a 400 on every load of that tab — caught by screenshotting the page and
  reading the console, which is the step the method calls "render it and look at
  it" and the step that is easiest to skip.
*/
const SECTION_FOR = { overview: 'overview', trends: 'series', staff: 'team', activity: 'activity', usage: 'usage', connections: 'connections', projects: 'projects', output: 'artifacts', settings: 'settings' }

/* Configuration. The only writing this page does — see the endpoint's comment
   on why configuring is allowed where acting is not. */
async function act(action, args) {
  const token = localStorage.getItem(KEY) || ''
  const r = await fetch(API, {
    method: 'POST',
    headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
    body: JSON.stringify({ action, args }),
  })
  const body = await r.json().catch(() => ({}))
  if (!r.ok) throw new Error(body.error || ('The server returned ' + r.status))
  if (body.result && body.result.error) throw new Error(body.result.error)
  return body.result
}

async function load(tab) {
  const section = SECTION_FOR[tab] ?? tab
  const token = localStorage.getItem(KEY) || ''
  const r = await fetch(API + '?section=' + encodeURIComponent(section), {
    headers: { Authorization: 'Bearer ' + token },
  })
  if (r.status === 401) { localStorage.removeItem(KEY); gate('That token was not accepted.'); throw new Error('unauthorized') }
  if (!r.ok) throw new Error('The server returned ' + r.status)
  return (await r.json()).data
}

function gate(message) {
  app.innerHTML = `
    <div class="gate">
      <span class="mark" style="width:44px;height:44px;border-radius:13px;font-size:21px;margin-bottom:14px">◆</span>
      <h1 style="font-size:24px;margin:0 0 5px;letter-spacing:-0.02em">Team HQ</h1>
      <p class="meta" style="margin:0 0 18px">Eight people, one queue. This device needs the password once —
        it is kept on this device and never sent anywhere but here.</p>
      <input id="tok" type="password" autocomplete="current-password" placeholder="Password" enterkeyhint="go">
      <button id="go">Unlock</button>
      ${message ? `<div class="err">${esc(message)}</div>` : ''}
    </div>`
  const input = document.getElementById('tok')
  const submit = () => {
    if (!input.value.trim()) return
    localStorage.setItem(KEY, input.value.trim())
    start()
  }
  document.getElementById('go').onclick = submit
  input.onkeydown = (e) => { if (e.key === 'Enter') submit() }
  input.focus()
}

function overview(d) {
  const c = d.counts
  const tile = (n, label, cls = '') =>
    `<div class="tile ${cls}"><b>${n}</b><span>${label}</span></div>`
  const needs = d.needs_me.map((b) => `
    <li>
      <div class="row">
        <span class="t">${esc(b.requested_action)}</span>
        ${b.overdue ? '<span class="pill bad">overdue</span>' : ''}
        ${b.work_can_continue ? '' : '<span class="pill warn">work stopped</span>'}
      </div>
      <div class="m">${esc(b.why_needed)}</div>
      ${b.consequences_of_delay ? `<div class="m">If it waits: ${esc(b.consequences_of_delay)}</div>` : ''}
    </li>`).join('')

  /*
    The diary, when it is connected.

    Nothing at all when Google has not been set up — an empty card headed
    "Calendar" on a page where the calendar does not exist is a card that reads
    as broken. The Connections tab is where "not connected" belongs, and it
    already says which of the four steps is next.

    The age is shown whenever it is over an hour, for the same reason the spoken
    answer says it: this is a cache that keeps working when Google is
    unreachable (§18), and a stale diary presented as a current one is worse
    than no diary.
  */
  const cal = d.calendar || {}
  const calendar =
    cal.enabled !== true || cal.as_of == null
      ? ''
      : `<section class="card" data-card="calendar"><span class="drag" title="Move up">⌃</span>
          <h2>Next 24 hours${
            Date.now() - new Date(cal.as_of).getTime() > 3600_000
              ? `<span class="est">AS OF ${esc(ago(cal.as_of).toUpperCase())}</span>`
              : ''
          }</h2>
          <div class="body">${
            (cal.events || []).length === 0
              ? '<div class="empty">Nothing in the diary.</div>'
              : `<ul>${(cal.events || [])
                  .map(
                    (e) => `<li><div class="row">
                      <span class="t">${esc(e.summary || 'Untitled')}</span>
                      <span class="m">${
                        e.all_day
                          ? 'all day'
                          : esc(
                              new Date(e.starts_at).toLocaleTimeString([], {
                                hour: '2-digit',
                                minute: '2-digit',
                              }),
                            )
                      }</span>
                      ${e.status === 'tentative' ? '<span class="pill warn">tentative</span>' : ''}
                    </div>
                    ${
                      e.location || e.attendees
                        ? `<div class="m">${[
                            e.attendees ? e.attendees + ' ' + (e.attendees === 1 ? 'person' : 'people') : '',
                            esc(e.location || ''),
                          ]
                            .filter(Boolean)
                            .join(' · ')}</div>`
                        : ''
                    }</li>`,
                  )
                  .join('')}</ul>`
          }</div>
        </section>`

  const jobs = d.today.map((j) => `
    <li>
      <div class="row">
        <span class="t">${esc(j.kind)}</span>
        <span class="pill">${esc(j.state)}</span>
        ${j.project_name ? `<span class="m">${esc(j.project_name)}</span>` : ''}
      </div>
      ${j.state_reason ? `<div class="m">${esc(j.state_reason)}</div>` : ''}
      <div class="m">${j.minutes_since_change}m in this state${j.waiting_on ? ' · waiting on ' + esc(j.waiting_on) : ''}</div>
    </li>`).join('')

  const projects = d.projects.map((p) => {
    const flags = []
    if (p.overdue_blockers > 0) flags.push(`<span class="pill bad">${p.overdue_blockers} overdue</span>`)
    else if (p.open_blockers > 0) flags.push(`<span class="pill warn">${p.open_blockers} blocked</span>`)
    if (p.stalled_jobs > 0) flags.push(`<span class="pill warn">${p.stalled_jobs} stalled</span>`)
    if (p.failed_jobs_24h > 0) flags.push(`<span class="pill bad">${p.failed_jobs_24h} failed 24h</span>`)
    if (p.brief_is_stale) flags.push('<span class="pill">brief stale</span>')
    if (!flags.length) flags.push('<span class="pill good">clear</span>')
    return `<li><div class="row"><span class="t">${esc(p.name)}</span>${flags.join('')}</div>
      <div class="m">${p.live_jobs} live${p.hours_since_sync != null ? ' · synced ' + Math.round(p.hours_since_sync) + 'h ago' : ' · never synced'}</div></li>`
  }).join('')

  // The overflow line. A list that silently shows 20 of 40 looks healthy
  // exactly when it stops being useful.
  const overflow = (shown, total, what) =>
    total > shown ? `<div class="meta" style="margin-top:8px">Showing ${shown} of ${total} ${what}.</div>` : ''

  return `
    <section class="card wide" data-card="glance">
      <h2>At a glance</h2>
      <div class="body"><div class="tiles">
        ${tile(c.needs_me, 'need you', c.needs_me ? 'warn' : '')}
        ${tile(c.needs_me_overdue, 'overdue', c.needs_me_overdue ? 'bad' : '')}
        ${tile(c.live_jobs, 'jobs live')}
        ${tile(c.active_projects, 'projects')}
        ${tile(c.undo_offers, 'undoable')}
      </div></div>
    </section>
    <section class="card wide" data-card="needs"><span class="drag" title="Move up">⌃</span>
      <h2>Needs you</h2>
      <div class="body">${needs ? `<ul>${needs}</ul>${overflow(d.needs_me.length, c.needs_me, 'blockers')}`
              : '<div class="empty">Nothing is waiting on you.</div>'}</div>
    </section>
    <section class="card" data-card="projects"><span class="drag" title="Move up">⌃</span>
      <h2>Projects</h2>
      <div class="body">${projects ? `<ul>${projects}</ul>` : '<div class="empty">No active projects.</div>'}</div>
    </section>
    <section class="card" data-card="inflight"><span class="drag" title="Move up">⌃</span>
      <h2>In flight</h2>
      <div class="body">${jobs ? `<ul>${jobs}</ul>` : '<div class="empty">The queue is empty.</div>'}</div>
    </section>
    ${calendar}`
}

function staff(d) {
  /*
    Grant: "with regards to the actual members of staff, there should be
    something that's also configurable in the front end. Their names, their
    roles, there should be a link to the Telegram bot. So I should be able to
    add and move stuff, adjust names, all that kind of stuff."

    Editable in place rather than behind a pencil icon. There are eight of them
    and the whole page fits on a phone screen; a modal per person would be four
    taps to change a word.

    Retired people are shown, greyed, with a Bring back button. A page that
    hides them offers no way to undo a mistap — and there is no delete here at
    all, because outputs, routing decisions and deliveries all name a staff
    member and a roster that can lose a row is a history that stops explaining
    itself.
  */
  const base = d.avatar_base || ''
  const people = (d.staff || []).map((s) => {
    const src = base && s.avatar_ref ? base + '/' + s.avatar_ref : ''
    const bot = s.telegram_username
      ? `<a href="https://t.me/${esc(s.telegram_username)}" target="_blank" rel="noopener">@${esc(s.telegram_username)}</a>`
      : '<span class="m">no bot yet</span>'
    const pron = ['she/her', 'he/him', 'they/them'].map((p) =>
      `<option value="${p}"${s.pronouns === p ? ' selected' : ''}>${p}</option>`).join('')
    return `<div class="person" data-slug="${esc(s.slug)}"${s.active ? '' : ' data-retired="1"'}>
      ${src ? `<img src="${esc(src)}" alt="" loading="lazy">` : '<div class="person-none"></div>'}
      <div style="min-width:0;flex:1">
        <div class="namerow">
          <input class="nm" data-f="p_name" value="${esc(s.name)}" aria-label="First name">
          <select data-f="p_pronouns" aria-label="Pronouns">${pron}</select>
        </div>
        <input data-f="p_title" value="${esc(s.title)}" aria-label="Role">
        <textarea data-f="p_remit" rows="2" aria-label="What they do">${esc(s.responsibilities || '')}</textarea>
        <div class="m" style="margin-top:6px">${bot} · convened for ${s.convened_for} job${s.convened_for === 1 ? '' : 's'}${s.permanent ? '' : ' · temporary'}</div>
        <div class="row" style="margin-top:6px">
          <button class="mini" data-save="${esc(s.slug)}">Save</button>
          ${s.slug === 'chief-of-staff' ? '' :
            `<button class="mini" data-retire="${esc(s.slug)}" data-to="${s.active ? 'false' : 'true'}">${s.active ? 'Retire' : 'Bring back'}</button>`}
          <span class="m" data-said="${esc(s.slug)}"></span>
        </div>
      </div>
    </div>`
  }).join('')
  return `<section class="card wide" data-card="team"><h2>The team</h2>
    <p class="meta">First names only. Change one and press Save; the new name is
      what they sign messages with everywhere.</p>
    <div class="body"><div class="staff">${people}</div></div>
  </section>`
}

function wireTeam() {
  const said = (slug, text) => {
    const el = document.querySelector(`[data-said="${slug}"]`)
    if (el) el.textContent = text
  }
  for (const b of document.querySelectorAll('[data-save]')) {
    b.onclick = async () => {
      const slug = b.dataset.save
      const card = b.closest('.person')
      const args = { p_slug: slug }
      for (const f of card.querySelectorAll('[data-f]')) args[f.dataset.f] = f.value
      b.disabled = true
      said(slug, 'Saving…')
      try {
        await act('staff_update', args)
        said(slug, 'Saved.')
      } catch (e) {
        // The server refuses a two-word name (0079) and says so in words. Shown
        // verbatim because "first names only" is the rule Grant asked for and a
        // generic failure would read as a bug.
        said(slug, e.message)
      }
      b.disabled = false
    }
  }
  for (const b of document.querySelectorAll('[data-retire]')) {
    b.onclick = async () => {
      b.disabled = true
      try {
        await act('staff_retire', { p_slug: b.dataset.retire, p_active: b.dataset.to === 'true' })
        show('staff')
      } catch (e) {
        said(b.dataset.retire, e.message)
        b.disabled = false
      }
    }
  }
}

function usage(d) {

  const block = (title, prov, note, rows) => `

  const t = (n, label) => `<div class="tile"><b>${n}</b><span>${esc(label)}</span></div>`

  const inf = d.inference

  const nb = d.notebook

  const models = (d.models || []).map((m) =>
    `<li><div class="row"><span class="t">${esc(m.model_id)}</span>

      ${x.leases_expired ? `<div class="m">${x.leases_expired} lease(s) expired — nobody is carrying these</div>` : ''}
    </li>`).join('')

  return `
    ${block('Inference', inf.provenance, inf.note,
      t(inf.calls_30d, 'calls, 30d') + t('$' + Number(inf.cost_usd_30d).toFixed(2), 'spent, 30d'))}
    ${block('Queue', q.provenance, '', t(q.in_flight, 'in flight') + t(q.max_concurrent, 'max'))}
    ${block('Voice notes', tts.provenance, tts.note,
      t(tts.characters_this_month.toLocaleString(), 'chars this month') +
      t((tts.monthly_free_allowance / 1000000) + 'M', 'free allowance'))}

      <div class="body">${delivery ? `<ul>${delivery}</ul>` : '<div class="empty">Nothing sent yet.</div>'}</div></section>`

/* --- sparklines ---------------------------------------------------------
   Inline SVG, no library. A single series, so: no legend (the heading names
   it), no end-marker (the headline number is the direct label), 2px stroke,
   recessive everything else.

   The hover layer is not optional — an SVG chart on a page IS interactive, and
   a shape with no way to ask "what was that day" is a decoration. Pointer
   events cover mouse and touch alike, which is why this uses `pointermove`
   rather than `mousemove`: on a phone the second one never fires.
*/
function sparkline(points, format) {
  const W = 300, H = 44, PADY = 4
  if (!points.length) return '<div class="empty">No data yet.</div>'
  const values = points.map((p) => Number(p[1]))
  // A series that is entirely zero has no shape, and drawing it as a flat line
  // along the baseline is worse than drawing nothing: it looks like data. Say
  // what is true instead.
  if (values.every((v) => v === 0)) {
    return `<div class="meta" style="padding:12px 0 4px">Nothing in the last ${points.length} days.</div>`
  }
  const max = Math.max(...values, 0)
  const min = Math.min(...values, 0)
  const span = max - min || 1
  const x = (i) => (points.length === 1 ? W / 2 : (i / (points.length - 1)) * W)
  const y = (v) => H - PADY - ((v - min) / span) * (H - PADY * 2)

  const line = values.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('')
  const area = `${line}L${W},${H}L0,${H}Z`
  const last = values[values.length - 1]
  const total = values.reduce((a, b) => a + b, 0)

  // A <title> makes the shape available to a screen reader, and the <details>
  // below is the table view the same reader can actually work with.
  const summary = `${points.length} days, ${format(min)} to ${format(max)}, latest ${format(last)}`

  const rows = points
    .slice()
    .reverse()
    .map((p) => `<tr><td>${esc(p[0])}</td><td>${esc(format(Number(p[1])))}</td></tr>`)
    .join('')

  return `
    <div class="sparkwrap">
      <svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"
           role="img" aria-label="${esc(summary)}"
           data-points='${esc(JSON.stringify(points))}' data-fmt="${esc(format.name || 'plain')}">
        <title>${esc(summary)}</title>
        <path class="area" d="${area}"></path>
        <!-- vector-effect, because preserveAspectRatio="none" stretches the
             viewBox horizontally and takes the stroke width with it: the line
             renders thin and uneven without this. Visible only once rendered,
             which is why the method says to look at it. -->
        <path class="line" d="${line}" vector-effect="non-scaling-stroke"></path>
        <line class="cross" x1="0" y1="0" x2="0" y2="${H}"></line>
        <circle class="dot" r="4" cx="0" cy="0"></circle>
      </svg>
      <div class="tip"></div>
    </div>
    <details class="values"><summary>Show the numbers (${points.length} days, ${format(total)} total)</summary>
      <table><tbody>${rows}</tbody></table></details>`
}

const FORMATS = {
  money: (v) => '$' + Number(v).toFixed(2),
  plain: (v) => String(Math.round(Number(v))),
}

/** Wire the crosshair. Pointer events, so a finger works as well as a mouse. */
function armSparklines(root) {
  for (const svg of root.querySelectorAll('svg.spark')) {
    const points = JSON.parse(svg.dataset.points)
    const fmt = FORMATS[svg.dataset.fmt] || FORMATS.plain
    const tip = svg.parentElement.querySelector('.tip')
    const cross = svg.querySelector('.cross')
    const dot = svg.querySelector('.dot')
    const W = 300, H = 44, PADY = 4
    const values = points.map((p) => Number(p[1]))
    const max = Math.max(...values, 0), min = Math.min(...values, 0)
    const span = max - min || 1

    const move = (event) => {
      const box = svg.getBoundingClientRect()
      const ratio = Math.min(Math.max((event.clientX - box.left) / box.width, 0), 1)
      const i = Math.round(ratio * (points.length - 1))
      const vx = points.length === 1 ? W / 2 : (i / (points.length - 1)) * W
      const vy = H - PADY - ((values[i] - min) / span) * (H - PADY * 2)
      cross.setAttribute('x1', vx); cross.setAttribute('x2', vx)
      dot.setAttribute('cx', vx); dot.setAttribute('cy', vy)
      svg.classList.add('on')
      tip.textContent = points[i][0] + ' · ' + fmt(values[i])
      tip.style.left = (ratio * box.width) + 'px'
      tip.style.top = ((vy / H) * box.height) + 'px'
      tip.classList.add('on')
    }
    const clear = () => { svg.classList.remove('on'); tip.classList.remove('on') }
    svg.addEventListener('pointermove', move)
    svg.addEventListener('pointerdown', move)
    svg.addEventListener('pointerleave', clear)
    svg.addEventListener('pointercancel', clear)
  }
}

/* --- remembered layout --------------------------------------------------
   §25 asks for collapse and reorder to be remembered. Kept in localStorage
   rather than in Postgres, deliberately: this is a per-DEVICE preference — the
   phone wants Needs You first and the desktop wants everything visible — and
   syncing it would make one device's tidy-up change the other's.
*/
const LAYOUT = 'hq.layout'
const layout = () => { try { return JSON.parse(localStorage.getItem(LAYOUT) || '{}') } catch { return {} } }
const saveLayout = (l) => { try { localStorage.setItem(LAYOUT, JSON.stringify(l)) } catch { /* private mode */ } }

function applyLayout(main, view) {
  const state = layout()[view] || {}
  const cards = [...main.querySelectorAll('.card[data-card]')]
  // Order first, then collapse: reordering a collapsed card must not expand it.
  const order = state.order || []
  for (const key of [...order].reverse()) {
    const card = cards.find((c) => c.dataset.card === key)
    if (card) main.prepend(card)
  }
  for (const card of cards) {
    if ((state.collapsed || []).includes(card.dataset.card)) card.classList.add('collapsed')
  }
}

function armLayout(main, view) {
  const persist = () => {
    const all = layout()
    all[view] = {
      order: [...main.querySelectorAll('.card[data-card]')].map((c) => c.dataset.card),
      collapsed: [...main.querySelectorAll('.card.collapsed[data-card]')].map((c) => c.dataset.card),
    }
    saveLayout(all)
  }
  for (const card of main.querySelectorAll('.card[data-card]')) {
    const heading = card.querySelector('h2')
    if (heading) {
      heading.title = 'Tap to collapse'
      heading.onclick = () => { card.classList.toggle('collapsed'); persist() }
    }
    const handle = card.querySelector('.drag')
    if (!handle) continue
    handle.onclick = (e) => {
      // Move up on tap. Drag-and-drop on a phone fights the scroll gesture, and
      // a control that only works with a mouse is not a mobile-first control.
      e.stopPropagation()
      const previous = card.previousElementSibling
      if (previous && previous.classList.contains('card')) { main.insertBefore(card, previous); persist() }
    }
  }
}

function trends(d) {
  const chart = (key, title, series, format, unit) => {
    const values = series.map((p) => Number(p[1]))
    const latest = values[values.length - 1] ?? 0
    const total = values.reduce((a, b) => a + b, 0)
    return `<section class="card" data-card="${key}"><span class="drag" title="Move up">⌃</span>
      <h2>${esc(title)}</h2>

    </section>
    ${chart('t-jobs', 'Jobs completed', d.jobs_completed, FORMATS.plain)}

function connections(d) {
  /*
    Grant asked for "a list of all the services being connected to with a green
    or red LED according to whether it's working".

    Three things this does that a plain green dot would not, each because the
    plain version would eventually mislead:

    1. **Age, on every row and once at the top.** Green means "working"; what it
       can honestly mean is "working when the prober last looked". A status that
       stops depending on the thing it reports, and stays green while doing so,
       is this project's recurring defect wearing a UI. Anything older than six
       hours goes amber and says so.
    2. **A word beside every colour.** Roughly one man in twelve cannot tell
       this red from this green.
    3. **Problems first.** Sorted by the database, so a broken row is at the top
       where it is read rather than alphabetically buried between two healthy
       ones.
  */
  const rows = d.rows || []
  const STALE_MINUTES = 6 * 60

  if (rows.length === 0) {
    return `<section class="card wide"><h2>Connections</h2><div class="body">
      <div class="empty">Nothing has been probed yet. Run <code>npm run inventory</code>.</div>
    </div></section>`
  }

  /*
    `attested` gets a neutral lamp, not a green one. Green here means "a probe
    reached it and it answered"; Backblaze is used by a GitHub Action and not by
    this process, so its status is Grant saying so. Painting those the same
    colour is how an indicator stops depending on the thing it indicates — the
    row said "Backblaze · Working" in green before this existed, on a status no
    program had ever checked.
  */
  const lamp = (state, stale) => {
    if (stale) return 'warn'
    return { ok: 'ok', dead: 'bad', missing: '', parked: '', unknown: 'warn', attested: '' }[state] ?? ''
  }
  const word = (state, stale) => {
    if (stale) return 'Unchecked'
    return { ok: 'Working', dead: 'Not working', missing: 'Not set up',
             parked: 'Parked', unknown: 'Unknown', attested: 'Confirmed by hand' }[state] ?? state
  }

  const oldest = Math.max(...rows.map((r) => Number(r.age_minutes) || 0))
  const anyStale = oldest > STALE_MINUTES

  const list = rows.map((r) => {
    const stale = (Number(r.age_minutes) || 0) > STALE_MINUTES
    return `<div class="conn">
      <span class="lamp ${lamp(r.state, stale)}" aria-hidden="true"></span>
      <span class="who">
        <b>${esc(r.service)}</b>
        <span>${esc(r.credential)}${r.owner ? ' · ' + esc(r.owner) : ''}</span>
      </span>
      <span class="st">
        <b class="${stale ? 'stale' : ''}">${esc(word(r.state, stale))}</b>
        ${esc(r.detail || '')}
        ${r.action ? '<span style="display:block">' + esc(r.action) + '</span>' : ''}
      </span>
    </div>`
  }).join('')

  const working = rows.filter((r) => r.state === 'ok').length
  const trusted = rows.filter((r) => r.state === 'attested').length
  const broken = rows.filter((r) => r.state === 'dead').length

  return `
    <section class="card wide" data-card="connections">
      <span class="drag" title="Move up">⌃</span>
      <h2>Connections${anyStale ? '<span class="est">STALE</span>' : ''}</h2>
      <div class="body">
        <div class="tiles">
          <div class="tile"><b>${working}</b><span>probed working</span></div>
          <div class="tile"><b>${broken}</b><span>not working</span></div>
          <div class="tile"><b>${trusted}</b><span>taken on trust</span></div>
        </div>
        <div style="margin-top:12px">${list}</div>
        <div class="meta" style="margin-top:10px">
          Last checked ${esc(ago(d.checked_at))}. A light says what the prober found when
          it last ran, not what is true this second — run <code>npm run inventory</code>
          to refresh. A grey light reading “Confirmed by hand” was never probed at all.
        </div>
      </div>
    </section>`
}

function projects(list) {
  /*
    Grant: "the idea with this entire project is that it's customizable and
    theoretically I could give the repo to somebody else and they could run it
    for their own projects." So nothing about a project is baked in, and this
    is where it stops needing a terminal.

    A project cannot be created without a source, here as in the database
    (0067): a project attached to nothing has nothing to read and nowhere to
    write. The form says so rather than letting the server refuse it.

  const rows = Array.isArray(list) ? list : []

  const attachments = (p) => (p.attachments || []).map((a) =>
    `<div class="conn">

     </div>`).join('') || '<div class="empty">Nothing attached.</div>'

  const channels = (p) => (p.channels || []).length === 0

    : (p.channels || []).map((c) => `<span class="pill">#${esc(c.name)}</span>`).join(' ')

  const cards = rows.map((p) => `
    <section class="card" data-card="project-${esc(p.slug)}">
      <span class="drag" title="Move up">⌃</span>
      <h2>${esc(p.name)}</h2>
      <div class="body">

        <div class="addrow">

            <option value="notion">Notion</option>

          </select>
          <input data-ref="${esc(p.slug)}" placeholder="Paste the Notion link or notebook id">
          <select data-role="${esc(p.slug)}">
            <option value="source">reads from</option>
            <option value="home">writes to</option>
          </select>
          <button class="mini" data-attach="${esc(p.slug)}">Attach</button>

  return cards + `
    <section class="card" data-card="new-project">

        </div>
        <div class="meta" style="margin-top:8px">
          A project needs at least one source. There is nothing to read or write
          without one, so this will not create one in isolation.
        </div>
        <div class="err" id="np-err" hidden></div>
      </div>
    </section>`
}


function output(list) {
  /*
    Grant: "once they're created, see if you can pull them into our store
    project and display the results as a link within both Slack and Telegram."
    Both of those happen when the artifact lands. This is the third place — the
    one you come back to a week later, when the message has scrolled away.

    A failed generation stays on the list rather than being hidden. Google
    fails a slide deck roughly as often as it makes one, and a list that shows
    only successes teaches you that everything worked.
  */
  const rows = Array.isArray(list) ? list : []
  if (rows.length === 0) {
    return `<section class="card wide"><h2>Output</h2>
      <div class="empty">Nothing made yet. Ask the team for an audio overview or a
      slide deck, in Slack or Telegram, and it will appear here with its link.</div>
    </section>`
  }
  const LAMP = { ready: 'ok', generating: 'warn', failed: 'bad', abandoned: 'bad' }
  const SAID = {
    ready: 'ready', generating: 'still making it', failed: 'failed', abandoned: 'gave up watching',
  }
  const item = (a) => `
    <div class="conn">
      <span class="lamp ${LAMP[a.state] || ''}" aria-hidden="true"></span>
      <span class="who">
        <b>${a.url ? `<a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.title || a.kind)}</a>` : esc(a.title || a.kind)}</b>
        <span>${esc(a.kind)} · ${esc(a.project || '')}${a.detail ? ' · ' + esc(a.detail) : ''}</span>
      </span>
      <span class="st">${esc(SAID[a.state] || a.state)}</span>
    </div>`
  return `<section class="card wide"><h2>Output</h2>
    <p class="meta">What the notebook has made. Opens in Google.</p>
    ${rows.map(item).join('')}
  </section>`
}

function settings(d) {
  /*
    Two halves, and the difference between them is the point.

    LIVE is a set of facts about the database this page is talking to. It is
    not editable, because a text box that appears to move a database and does
    not is worse than no text box at all.

    SETTINGS are declared intent: where the tooling should connect next time,
    where backups go, whether the calendar is in service. Editing one changes
    what the next run reads. Six keys, allow-listed in the database (0077), so
    the page cannot reach the job lease or the autonomy level.
  */
  const live = d.live || {}
  const settings = d.settings || {}
  const editable = d.editable || []

  const fact = (label, value) =>
    `<div class="conn"><span class="who"><b>${esc(String(value ?? '—'))}</b><span>${esc(label)}</span></span></div>`

  const field = (key) => {
    const row = settings[key] || {}
    const value = row.value
    const isBool = typeof value === 'boolean'
    const control = isBool
      ? `<select data-setting="${esc(key)}">
           <option value="true"${value ? ' selected' : ''}>on</option>
           <option value="false"${value ? '' : ' selected'}>off</option>
         </select>`
      : `<input data-setting="${esc(key)}" value="${esc(String(value ?? ''))}" autocomplete="off">`
    return `<label class="fld"><span>${esc(key)}</span>${control}
      <em>${esc(row.description || '')}</em></label>`
  }

  const nb = d.notebook || {}
  // Every sentence says whose count it is. Google publishes no usage API, and a
  // figure here that did not say so would be read as theirs within a week —
  // after which a refusal at half our number reads as our bug.
  const meter = nb.window_ceiling === undefined ? '' : `
    <section class="card"><h2>Notebook allowance</h2>
      <p class="meta">Our own count of what we have spent, not Google's — they
        publish no usage API.
        ${nb.ceiling_is_measured ? 'The ceiling below was measured from a refusal.' : 'The ceiling below is still an estimate.'}</p>
      ${fact('used in this ' + nb.window_hours + '-hour window', nb.window_spent + ' of ' + nb.window_ceiling)}
      ${fact('used this week', nb.week_spent + ' of ' + nb.week_ceiling)}
      ${nb.blocked_until ? fact('Google refused until', new Date(nb.blocked_until).toLocaleString()) : ''}
      ${nb.window_resets_at ? fact('window frees up', new Date(nb.window_resets_at).toLocaleString()) : ''}
    </section>`

  const g = d.google || {}
  const step = (done, text) =>
    `<div class="conn"><span class="lamp ${done ? 'ok' : ''}" aria-hidden="true"></span>` +
    `<span class="who"><b>${text}</b></span>` +
    `<span class="st">${done ? 'done' : 'to do'}</span></div>`

  // Ordered the way he has to do them: the console first, because the client id
  // and the redirect URI have to exist over there before anything here works.
  const google = `
    <section class="card"><h2>Google</h2>
      <p class="meta">Calendar needs an OAuth client from your own Google Cloud project.
        Four steps, once.</p>
      ${step(true, '1. Create an OAuth client (type: Web application) at console.cloud.google.com')}
      ${step(g.client_id ? true : false, '2. Paste the client ID below')}
      ${step(g.has_secret ? true : false, '3. Paste the client secret below')}
      ${step(g.has_refresh_token ? true : false, '4. Press Connect and approve it')}

      <label class="fld"><span>Authorised redirect URI — paste this INTO Google</span>
        <input readonly value="${esc(g.redirect_uri || '')}" onclick="this.select()">
        <em>Must match to the character, or the consent screen refuses before you see it.</em>
      </label>
      <label class="fld"><span>google.client_id</span>
        <input data-setting="google.client_id" value="${esc(g.client_id || '')}" autocomplete="off">
        <em>Public by design — it appears in every authorization URL.</em>
      </label>
      <label class="fld"><span>Client secret</span>
        <input id="gsecret" type="password" placeholder="${g.has_secret ? '•••••••• already stored — paste again to replace' : 'GOCSPX-…'}" autocomplete="off">
        <em>Stored in the vault. This page can write it and can never read it back.</em>
      </label>
      <div class="row">
        <button id="save-google">Save secret</button>
        <a class="mini" href="${esc(API.replace('/hq-api', '/google-oauth/start'))}" target="_blank" rel="noopener">Connect Google →</a>
        <span id="google-said" class="m">${g.has_refresh_token ? 'Connected.' : ''}</span>
      </div>
    </section>`

  return `
    ${meter}
    ${google}
    <section class="card"><h2>This database</h2>
      <p class="meta">Facts, not fields. Nothing here is editable, because editing it would not move anything.</p>
      ${fact('database', live.database)}
      ${fact('server', live.server)}
      ${fact('on disk', live.size)}
      ${fact('tables', live.tables)}
    </section>
    <section class="card"><h2>Where things should live</h2>
      <p class="meta">Declared, not live. Changing one tells the next run where to look.</p>
      <div id="fields">${editable.map(field).join('')}</div>
      <div class="row"><button id="save-settings">Save</button>
        <span id="settings-said" class="m"></span></div>
    </section>`
}

function wireSettings() {
  const gsaid = document.getElementById('google-said')
  const gsave = document.getElementById('save-google')
  if (gsave !== null) {
    gsave.onclick = async () => {
      const box = document.getElementById('gsecret')
      if (!box.value.trim()) { gsaid.textContent = 'Nothing to save.'; return }
      gsave.disabled = true
      gsaid.textContent = 'Saving…'
      try {
        await act('set_google_secret', { p_secret: box.value.trim() })
        box.value = ''
        gsaid.textContent = 'Saved. Now press Connect.'
      } catch (e) {
        // Shown verbatim: the server refuses anything not starting GOCSPX-,
        // and the commonest mistake is pasting the client ID in here.
        gsaid.textContent = e.message
      }
      gsave.disabled = false
    }
  }

  const said = document.getElementById('settings-said')
  const save = document.getElementById('save-settings')
  if (save === null) return
  save.onclick = async () => {
    save.disabled = true
    said.textContent = 'Saving…'
    try {
      // One call per changed key rather than a batch. There are six of them,
      // and a partial batch failure would leave the page unable to say which
      // half went in.
      for (const el of document.querySelectorAll('[data-setting]')) {
        await act('set_setting', { p_key: el.dataset.setting, p_value: String(el.value) })
      }
      said.textContent = 'Saved.'
    } catch (e) {
      said.textContent = 'Not saved: ' + e.message
    }
    save.disabled = false
  }
}


/*
  Talk to Team.

  §22's scenario A ends in a conversation, and Grant settled §12's "optional
  premium" against §22's completion criterion with three words: *"Voice is
  required."*

  ## Why the browser does the listening

  §12 describes server-minted ephemeral credentials and WebRTC, which is the
  OpenAI Realtime shape — and `voice-token` already mints those. It also bills
  per minute against an account Grant has parked. The browser's own recogniser
  costs nothing, runs on the device, and reaches the same endpoint, so the
  canonical layer is identical either way and the transport is a swap rather
  than a rewrite.

  What is genuinely lost: barge-in. With a Realtime session you interrupt and it
  stops; here it finishes its sentence. Named rather than glossed, because it is
  the difference Grant will notice first.

  ## Why the transcript is shown before it acts

  Grant, about the bots misunderstanding him: *"probably good idea that he
  confirms he understands and spits back what I want before going ahead."* The
  recogniser is the one part of this chain that can be confidently wrong, so
  what it heard is on screen in his own words, and the reply underneath it.
*/
const SPEECH = window.SpeechRecognition || window.webkitSpeechRecognition || null

function talk() {
  if (SPEECH === null) {
    return `<section class="card wide"><h2>Talk to team</h2><div class="body">
      <p>This browser cannot listen. Speech recognition is available in Safari on
      iPhone and iPad, and in Chrome on a desktop — open
      <b>ai-team-hq.vercel.app</b> in one of those.</p>
      <p class="meta">Nothing else on this page needs it, and a voice note sent to any
      of the Telegram bots does the same job without a browser at all.</p>
    </div></section>`
  }
  return `<section class="card wide" data-card="talk"><h2>Talk to team</h2><div class="body">
      <div class="talkwrap">
        <button id="mic" class="mic" aria-live="polite">Talk</button>
        <div class="talkstate" id="talkstate">Press and speak. It stops when you stop.</div>
      </div>
      <div id="turns" class="turns"></div>
    </div></section>`
}

/*
  One turn: listen, show, send, speak.

  Deliberately one turn per press rather than an always-on microphone. A page
  that listens continuously on a phone in a pocket is a page that files
  instructions nobody gave, and §5's dedupe index would not save us from a
  recogniser hearing the television.
*/
function wireTalk() {
  const mic = document.getElementById('mic')
  if (mic === null) return
  const state = document.getElementById('talkstate')
  const turns = document.getElementById('turns')
  // One session per visit to this view. It groups the turns of a conversation
  // in `origin_ref`, which is what conversation memory reads.
  const session = 's' + Math.random().toString(36).slice(2, 12)
  let listening = false

  const show = (who, text, cls) => {
    const el = document.createElement('div')
    el.className = 'turn ' + (cls || '')
    el.innerHTML = `<b>${esc(who)}</b><span>${esc(text)}</span>`
    turns.prepend(el)
  }

  const say = (text) => {
    // Best effort. A browser that will not speak still shows every word, so a
    // silent reply is a degraded experience rather than a lost one.
    try {
      const u = new SpeechSynthesisUtterance(text)
      u.rate = 1.02
      window.speechSynthesis.cancel()
      window.speechSynthesis.speak(u)
    } catch (e) { /* shown on screen regardless */ }
  }

  const send = async (said) => {
    state.textContent = 'Thinking…'
    try {
      const r = await fetch(API.replace(/\/hq-api$/, '/voice') + '/turn', {
        method: 'POST',
        headers: {
          Authorization: 'Bearer ' + (localStorage.getItem(KEY) || ''),
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({ said, session }),
      })
      const body = await r.json()
      if (!r.ok) throw new Error(body.error || ('The server returned ' + r.status))
      show('The team', body.speak, body.did === 'delegated' ? 'delegated' : '')
      say(body.speak)
      state.textContent =
        body.did === 'delegated'
          ? 'Put to the team — the answer comes back in Slack and Telegram.'
          : 'Press and speak.'
    } catch (e) {
      show('The team', 'I could not reach the office: ' + e.message, 'bad')
      state.textContent = 'Press and speak.'
    }
  }

  mic.onclick = () => {
    if (listening) return
    const rec = new SPEECH()
    rec.lang = 'en-GB'
    rec.interimResults = false
    // One utterance. `continuous` on iOS Safari behaves inconsistently and a
    // microphone that never closes is the failure mode described above.
    rec.continuous = false
    rec.maxAlternatives = 1

    listening = true
    mic.classList.add('on')
    mic.textContent = 'Listening'
    state.textContent = 'Listening — speak now.'

    rec.onresult = (event) => {
      const said = String(event.results[0][0].transcript || '').trim()
      if (said === '') return
      show('You', said)
      send(said)
    }
    rec.onerror = (event) => {
      state.textContent =
        event.error === 'not-allowed'
          ? 'The microphone was refused. Allow it for this site and press Talk again.'
          : 'It did not catch that (' + event.error + '). Press Talk and try again.'
    }
    rec.onend = () => {
      listening = false
      mic.classList.remove('on')
      mic.textContent = 'Talk'
    }
    rec.start()
  }
}

const VIEWS = { talk, overview, trends, staff, activity, usage, connections, projects, output, settings }

/*
  The Projects tab's buttons.
  
  Wired after render rather than with inline handlers, because the markup is
  built from server data and an onclick attribute in a template string is an
  injection waiting for a project named after a quote character.
*/
function wireProjects() {
  const fail = (e) => { const box = document.getElementById('np-err'); if (box) { box.textContent = e.message; box.hidden = false } else { alert(e.message) } }

  for (const b of document.querySelectorAll('[data-attach]')) {
    b.onclick = async () => {
      const slug = b.dataset.attach
      const conn = document.querySelector(`[data-conn="${slug}"]`).value
      const ref = document.querySelector(`[data-ref="${slug}"]`).value.trim()
      const role = document.querySelector(`[data-role="${slug}"]`).value
      if (!ref) return
      b.disabled = true
      try {
        // A home must say what it is the home for. Notion stores documents and
        // NotebookLM generates artifacts — Grant's own distinction — so the
        // kind follows the connector rather than asking a question with one
        // sensible answer.
        await act('attach', { p_slug: slug, p_connector: conn, p_ref: ref, p_role: role,
                              p_kind: role === 'home' ? (conn === 'notion' ? 'document' : 'artifact') : null })
        show('projects')
      } catch (e) { fail(e); b.disabled = false }
    }
  }

  for (const b of document.querySelectorAll('[data-detach]')) {
    b.onclick = async () => {
      // No confirmation: detaching disables a row and keeps every document the
      // connector fed (ADR-0013). It is undone by attaching again.
      b.disabled = true
      try { await act('detach', { p_attachment_id: b.dataset.detach }); show('projects') }
      catch (e) { fail(e); b.disabled = false }
    }
  }

  for (const b of document.querySelectorAll('[data-rename]')) {
    b.onclick = async () => {
      const next = prompt('New name for this project', b.dataset.name)
      if (!next || next === b.dataset.name) return
      try { await act('rename_project', { p_slug: b.dataset.rename, p_name: next }); show('projects') }
      catch (e) { fail(e) }
    }
  }

  const go = document.getElementById('np-go')
  if (go) {
    go.onclick = async () => {
      const name = document.getElementById('np-name').value.trim()
      const ref = document.getElementById('np-ref').value.trim()
      const conn = document.getElementById('np-conn').value
      const box = document.getElementById('np-err')
      box.hidden = true
      if (!name || !ref) { box.textContent = 'A name and a source are both required.'; box.hidden = false; return }
      go.disabled = true
      try { await act('create_project', { p_name: name, p_connector: conn, p_ref: ref }); show('projects') }
      catch (e) { fail(e); go.disabled = false }
    }
  }
}

/*
  The hint under each card heading, inserted after render.

  After, and from a map, so that a view function stays a view function: adding a
  card does not oblige anyone to write documentation for it in the same breath,
  and a card whose heading changes loses its hint rather than keeping a wrong
  one. Idempotent, because `show` re-renders the whole view on every visit.
*/
function explain(main) {
  for (const card of main.querySelectorAll('.card')) {
    const heading = card.querySelector('h2')
    if (heading === null || card.querySelector('.hint') !== null) continue
    // A card that already introduces itself is left alone. Four of them do —
    // the notebook meter, Google, the database facts, the settings form — and
    // the first version put a second, near-identical sentence above each.
    if (heading.nextElementSibling?.classList.contains('meta') === true) continue
    // The heading WITHOUT its badge. Two cards append an `.est` chip — STALE on
    // Connections, AS OF … on the diary — and `textContent` glues it to the
    // title, so "Connections" became "ConnectionsSTALE" and lost its hint at
    // exactly the moment the card needed explaining most.
    const label = [...heading.childNodes]
      .filter((n) => !(n.nodeType === 1 && n.classList.contains('est')))
      .map((n) => n.textContent)
      .join('')
    const hint = HINTS[label.trim().toLowerCase()]
    if (hint === undefined) continue
    const p = document.createElement('p')
    p.className = 'hint'
    p.textContent = hint
    heading.after(p)
  }
}

async function show(section) {
  for (const b of document.querySelectorAll('nav button')) {
    b.setAttribute('aria-current', String(b.dataset.tab === section))
  }
  const guide = GUIDE[section]
  const lede = document.getElementById('lede')
  if (lede) {
    lede.innerHTML = guide === undefined ? '' : `
      <h2>${esc(guide.title)}</h2>
      <p>${esc(guide.what)}</p>
      <p class="todo">${esc(guide.todo)}</p>`
  }
  const main = document.getElementById('main')
  main.innerHTML = '<div class="empty">Loading…</div>'
  try {
    // Talk fetches nothing: it has no state of its own, and its state lives in
    // the conversation. `load('talk')` would ask hq-api for a section that does
    // not exist and get a 400 — which is exactly how the tab/section mismatch
    // above was found the first time.
    const data = section === 'talk' ? {} : await load(section)
    main.innerHTML = VIEWS[section](data)
    if (section === 'talk') wireTalk()
    if (section === 'projects') wireProjects()
    if (section === 'settings') wireSettings()
    if (section === 'staff') wireTeam()
    explain(main)
    armSparklines(main)
    applyLayout(main, section)
    armLayout(main, section)
    document.getElementById('stamp').textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
  } catch (e) {
    if (e.message === 'unauthorized') return
    // Plain language, and never the raw error object. §25: no raw JSON or debug
    // detail in normal workflow — a stack trace on a phone helps nobody.
    main.innerHTML = `<section class="card wide"><div class="err">Could not load this. ${esc(e.message)}</div></section>`
  }
}

function start() {
  shell('overview')
  show('overview')
  // Refresh on return rather than on a timer: a phone in a pocket polling every
  // thirty seconds is a battery cost for data nobody is looking at.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      const active = document.querySelector('nav button[aria-current="true"]')
      if (active) show(active.dataset.tab)
    }
  })
}

if (localStorage.getItem(KEY)) start()
else gate()
</script>
</body>
</html>
