<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Studio — Agentic Team HQ</title>
<!-- Self-hosted: see fonts/fonts.css. Not only faster — the build sandbox
     cannot reach Google Fonts, so every screenshot was showing the fallback
     and typography could not be judged at all (#22). -->
<link rel="stylesheet" href="./fonts/fonts.css">
<link rel="stylesheet" href="./tokens.css">
<link rel="stylesheet" href="./skins.css">
<link rel="stylesheet" href="./studio.css">
</head>
<body>
<div id="root" class="shell"></div>
<!--
  The team, in writing, without leaving what you are doing (#103).

  OUTSIDE #root, like the settings and the viewer, because render() replaces
  everything inside #root on every navigation — a conversation living in there
  would lose its scroll position, its draft and its in-flight request the
  moment you changed section. Grant asked for it to remain accessible without
  obstructing navigation, and that is a structural requirement rather than a
  styling one.
-->
<div class="dock" id="dock" hidden></div>
<div class="viewer" id="settings" hidden></div>
<div class="viewer" id="viewer" hidden></div>
<script type="module" src="./app.js"></script>
</body>
</html>
