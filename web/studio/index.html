<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Team HQ — Agentic Team</title>
<!-- Self-hosted: see fonts/fonts.css. Not only faster — the build sandbox
     cannot reach Google Fonts, so every screenshot was showing the fallback
     and typography could not be judged at all (#22). -->
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/skins.css">
<link rel="stylesheet" href="/studio.css">
<!--
  Team HQ's own stylesheets. Team HQ is what this page renders at every
  address (ADR-0051); the older studio is kept at /classic.

  Loaded on every page and SCOPED to [data-experience="basecamp"] on the root
  element, which app.js sets only on that branch. One link rather than an
  injected stylesheet: a style sheet added at navigation time paints one frame
  late, and the flash is on the experimental experience's first impression.
  Last in the chain so its own scope wins inside itself, and scoped throughout
  so it cannot reach the default studio at all.
-->
<link rel="stylesheet" href="/bc/tokens.css">
<link rel="stylesheet" href="/bc/bc.css">
<!--
  The two composition experiments. Loaded after bc.css so its phone block
  wins on source order; scoped to the experiment, so it cannot reach the
  default Team HQ.
-->
<link rel="stylesheet" href="/bc/compose.css">
<link rel="stylesheet" href="/bc/calendar.css">
<link rel="stylesheet" href="/bc/docs.css">
<link rel="stylesheet" href="/bc/settings.css">
<link rel="stylesheet" href="/bc/account.css">
<link rel="stylesheet" href="/bc/activity.css">
<link rel="stylesheet" href="/settings-ui.css">
<link rel="stylesheet" href="/bc/stone.css">
<link rel="stylesheet" href="/bc/polish.css">
<link rel="stylesheet" href="/bc/refine.css">
<link rel="stylesheet" href="/bc/identity.css">
<link rel="stylesheet" href="/bc/ux-quick.css">
</head>
<body>
<div id="root" class="shell"></div>
<!--
  The team, in writing, without leaving what you are doing (#103).

  OUTSIDE #root, like the settings and the viewer, because render() replaces
  everything inside #root on every navigation — a conversation living in there
  would lose its scroll position, its draft and its in-flight request the
  moment you changed section. Grant asked for it to remain accessible without
  obstructing navigation, and that is a structural requirement rather than a
  styling one.
-->
<aside class="dock" id="dock" aria-label="The team: conversation with the team" hidden></aside>
<!--
  The way back (#118). Outside #root for the same reason the dock is: render()
  replaces everything inside it after every write, which is precisely when this
  exists, and moving between tabs while deciding whether to undo is normal.
-->
<div class="undobar" id="undobar" role="status" hidden></div>
<div class="viewer" id="settings" hidden></div>
<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Document" hidden></div>
<!--
  Drop a file onto a project (#126). OUTSIDE #root, like everything else that
  must survive a render: a drag that begins before a repaint and ends after it
  would otherwise land on a node that no longer exists.
-->
<div class="droplayer" id="droplayer" aria-hidden="true" hidden>
  <div class="dropcard">
    <b>Drop it here</b>
    <span class="t-meta">It joins this project's documents, and the team can read it.</span>
  </div>
</div>
<!--
  THE EXPERIMENT TALKS TO ITS OWN COPY OF THE GATEWAY.

  This branch's gateway source is ahead of main and behind the backend branch,
  so deploying it over the shared one would drop somebody else's work. The
  experiment runs its own deployment of the same file instead, and picks it by
  HOSTNAME - so the identical page served at the real address is untouched and
  the default Team HQ cannot be affected by anything this branch deploys.

  Temporary by construction: when the two copies are one file again this block
  and the slug go together. ADR-0043.
-->
<!--
  WHICH OFFICE THIS DEPLOYMENT BELONGS TO.

  `config.js` is generated -- `npm run config:site` writes it, and both deploy
  paths run that before uploading. It is NOT in the repository, deliberately:
  a committed default is one person's office shipped to everybody who clones
  this, and six modules used to carry exactly that. See `backend.js`.

  A 404 here is not an error. It means nothing has configured this copy, the
  globals stay undefined, and `backend.js` resolves to the empty string so the
  page can say the true thing rather than ask a guessed address.

  It is loaded as a CLASSIC script so it runs before the module below, which is
  deferred by definition.
-->
<script src="/config.js"></script>
<script>
  /*
    Keep this build's static files on the device, so a returning visit does not download them again (sw.js says why). The version
    in the address makes each release its own cache. The page works without it, so a failure here is ignored.
  */
  if ('serviceWorker' in navigator && window.HQ_VERSION) {
    navigator.serviceWorker.register('/sw.js?v=' + encodeURIComponent(window.HQ_VERSION)).catch(function () { /* works without it */ })
  }
</script>
<script>
  /*
    The list's first two requests, started now rather than when the modules have loaded: on a cold page that was about four seconds
    of waiting before anything was asked. Only with a token already stored in this browser; data.js uses them only when the token is
    the one it holds and the answer is good, and otherwise asks afresh (so a stale token cannot sign anybody out).
  */
  (function () {
    try {
      var stored = JSON.parse(localStorage.getItem('hq.session') || 'null')
      var token = stored && typeof stored.access_token === 'string' ? stored.access_token : ''
      if (token === '' || !window.HQ_API) return
      var headers = { authorization: 'Bearer ' + token }
      var studio = fetch(window.HQ_API + '?section=studio', { headers: headers })
      var projects = fetch(window.HQ_API + '?section=projects', { headers: headers })
      studio.catch(function () { /* data.js asks again */ })
      projects.catch(function () { /* data.js asks again */ })
      window.hqEarly = { token: token, studio: studio, projects: projects }
    } catch (e) { /* storage blocked: the page asks when its modules are ready, as before */ }
  })()
</script>
<script>
  /*
    ALWAYS THE LATEST VERSION. This page was loaded from a build; the server's config.js names the newest one. When they
    differ (a release was deployed while this tab was open, or an old copy was restored from cache), reload once so the
    person gets the current design. The check runs on load and whenever a backgrounded tab comes back to the front. A
    session key stops a reload loop if the server itself is out of step.
  */
  (function () {
    var running = window.HQ_VERSION || ''
    function newest() {
      return fetch('/config.js', { cache: 'no-store' })
        .then(function (r) { return r.text() })
        .then(function (text) {
          var m = /HQ_VERSION = window\.HQ_VERSION \|\| '([^']+)'/.exec(text)
          return m ? m[1] : ''
        })
    }
    /* A reload throws away anything typed and not yet sent, so the guard waits while any field holds words. */
    function holdingWords() {
      var el = document.activeElement
      if (el && (el.tagName === 'TEXTAREA' || el.tagName === 'INPUT') && String(el.value || '').trim() !== '') return true
      return Array.prototype.some.call(document.querySelectorAll('textarea, input[type="text"], input[type="email"]'), function (f) {
        return String(f.value || '').trim() !== ''
      })
    }
    function check() {
      if (running === '') return
      newest().then(function (version) {
        if (version === '' || version === running) return
        if (holdingWords()) return /* checked again later, when the words are sent or cleared */
        var key = 'hq.reloaded.' + version
        try {
          if (sessionStorage.getItem(key)) return
          sessionStorage.setItem(key, '1')
        } catch (e) { /* storage blocked: at most one reload per check, which is still correct */ }
        location.reload()
      }).catch(function () { /* offline: keep the page you have */ })
    }
    check()
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible') check()
    })
    /* A tab left open for a long time still finds a release, once every two minutes while it is in front. */
    setInterval(function () {
      if (document.visibilityState === 'visible') check()
    }, 120000)
  })()
</script>
<script>
  /*
    The experiment runs its own copies of the gateway and the voice function
    under different slugs, so that the default Team HQ cannot be affected by
    anything this branch deploys (ADR-0043). Derived from whatever `config.js`
    named, never written down again -- the base belongs to the deployment and
    only the SLUG belongs to this branch.

    Temporary by construction: when the two copies are one function again, this
    block and the slugs go together.
  */
  /*
    AND ONLY WHEN config.js NAMED THE SHARED GATEWAY.

    This block exists to keep a basecamp deployment off the default Team HQ's
    function. A deployment that has already been told which slug to use -- an
    integration preview, say -- has been told deliberately, and overwriting it
    here would point the thing being proved at the thing it is being compared
    with. So it acts on the DEFAULT and stands aside for anything else.
  */
  if (location.hostname.indexOf('agentic-team-hq-basecamp') === 0
      && typeof window.HQ_API === 'string' && /\/hq-api$/.test(window.HQ_API)) {
    const base = window.HQ_API.replace(/\/[^/]*$/, '')
    window.HQ_API = base + '/hq-api-basecamp'
    window.HQ_SIGNIN = base + '/signin'
    window.HQ_VOICE = base + '/voice-basecamp'
  }
</script>
<!--
  WHEN THE PAGE CANNOT START. If a script or stylesheet does not arrive (a dropped connection, a proxy that cuts a transfer, a
  captive portal) the module graph never runs and the person is left with a blank page and no way to know why. Eight seconds
  after the page has loaded, if nothing has been drawn, say so, name the files that failed, and offer a reload. It tells and waits
  for a press: it retries nothing and hides nothing, and the app's own first draw replaces this notice.
-->
<script>
  (function () {
    var failed = []
    window.addEventListener('error', function (e) {
      var t = e.target
      if (t && t !== window && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) {
        failed.push(String(t.src || t.href || '').replace(location.origin, ''))
      }
    }, true)
    function check() {
        var root = document.getElementById('root')
        if (!root || root.childElementCount > 0) return
        /* A failed import is reported against the entry script, so name what the browser's own timing says answered with an error. */
        try {
          performance.getEntriesByType('resource').forEach(function (r) {
            if (r.responseStatus >= 400 && r.name.indexOf(location.origin) === 0) {
              var n = r.name.replace(location.origin, '')
              if (failed.indexOf(n) < 0) failed.push(n)
            }
          })
        } catch (e) {}
        if (failed.length > 1) failed = failed.filter(function (n) { return n !== '/app.js' })
        var box = document.createElement('div')
        box.setAttribute('role', 'alert')
        box.setAttribute('data-boot-notice', '')
        box.style.cssText = 'max-width:34rem;margin:18vh auto 0;padding:0 1.25rem;font:16px/1.5 system-ui,sans-serif;color:CanvasText'
        var h = document.createElement('h1')
        h.style.cssText = 'font-size:1.25rem;margin:0 0 .5rem'
        h.textContent = failed.length > 0 ? 'Team HQ could not finish loading' : 'Team HQ is taking longer than usual to start'
        var p = document.createElement('p')
        p.style.cssText = 'margin:0 0 1rem'
        p.textContent = failed.length > 0
          ? 'Part of the page did not arrive (' + failed.slice(0, 3).join(', ') + '), usually a dropped or interrupted connection. Nothing has been lost.'
          : 'Your connection may be slow or interrupted. Nothing has been lost.'
        var b = document.createElement('button')
        b.type = 'button'
        b.textContent = 'Reload'
        b.style.cssText = 'font:inherit;min-height:44px;padding:0 1.25rem;border-radius:8px;border:1px solid currentColor;background:transparent;color:inherit;cursor:pointer'
        b.addEventListener('click', function () { location.reload() })
        box.appendChild(h); box.appendChild(p); box.appendChild(b)
        if (document.querySelector('[data-boot-notice]')) return
        root.appendChild(box)
    }
    /* Eight seconds after the page has loaded, or twenty after it began (a hung transfer keeps `load` from ever firing). */
    window.addEventListener('load', function () { setTimeout(check, 8000) })
    setTimeout(check, 20000)
  })()
</script>
<script type="module" src="/app.js"></script>
</body>
</html>
