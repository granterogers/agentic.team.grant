name: Secrets doctor

# Diagnostic only. Reports which secret and variable NAMES this repository's
# workflows can actually see, and never a value.
#
# Exists because "I added them" and "the workflow cannot see them" were both
# true at once, three runs in a row. GitHub has four places a name/value pair
# can land, and `secrets.X` only resolves two of them:
#
#   Repository secrets      -> visible to secrets.X            ✅
#   Organization secrets    -> visible to secrets.X             ✅
#   ENVIRONMENT secrets     -> ONLY when the job declares `environment:`  ⚠️
#   Repository VARIABLES    -> visible as vars.X, never secrets.X          ⚠️
#
# The last two are the usual explanation, and neither produces an error — the
# reference silently resolves to an empty string.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - name: Report what this workflow can see
        env:
          SECRET_KEYS: ${{ toJSON(secrets) }}
          VAR_KEYS: ${{ toJSON(vars) }}
        run: |
          # Only key names are printed. Values are never echoed, and GitHub
          # masks them in logs regardless.
          echo "## Secrets visible to this workflow" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$SECRET_KEYS" | jq -r 'keys[]' | sort >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          echo "## Variables visible to this workflow" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$VAR_KEYS" | jq -r 'keys[]' | sort >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          echo "### Verdict per required name" >> "$GITHUB_STEP_SUMMARY"
          echo "| name | as a secret | as a variable |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for n in SUPABASE_DB_URL SUPABASE_ACCESS_TOKEN \
                   BACKUP_S3_ENDPOINT BACKUP_S3_REGION BACKUP_S3_BUCKET \
                   BACKUP_S3_ACCESS_KEY_ID BACKUP_S3_SECRET_ACCESS_KEY; do
            s=$(echo "$SECRET_KEYS" | jq -r --arg n "$n" 'has($n)')
            v=$(echo "$VAR_KEYS"    | jq -r --arg n "$n" 'has($n)')
            [ "$s" = "true" ] && s='✅ present' || s='—'
            [ "$v" = "true" ] && v='⚠️ HERE, but a variable not a secret' || v='—'
            echo "| \`$n\` | $s | $v |" >> "$GITHUB_STEP_SUMMARY"
          done

          # Also to stdout, so it is readable from the API without the summary.
          echo "SECRET NAMES:"; echo "$SECRET_KEYS" | jq -r 'keys[]' | sort
          echo "VARIABLE NAMES:"; echo "$VAR_KEYS" | jq -r 'keys[]' | sort
