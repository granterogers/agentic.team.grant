name: CI

#
# ─────────────────────────────────────────────────────────────────────────────
# AUTOMATIC TRIGGERS REMOVED — 2026-09-08
#
# Grant: *"stop using github actions completely please, find another way to do
# thing... for any process."* He had used 1,800 of the account's 2,000 monthly
# minutes, and the spending was mine: a five-minute worker cron and a ten-minute
# sync cron between them made 432 runs a day.
#
# Every schedule and every push trigger in this repository is gone. What each
# workflow did now runs somewhere free, or is written down in
# `.github/workflows/README.md` as a decision waiting on Grant. `workflow_dispatch`
# is deliberately left in place: a workflow that cannot be run by hand is a
# workflow nobody can fall back to, and a button nobody presses costs nothing.
# ─────────────────────────────────────────────────────────────────────────────
#
# CI in particular: the checks still run, on every change, in the session that
# makes the change — `npm run lint && npm run typecheck && npm run test &&
# npm run check:migrations && npm run check:secrets` before every push. That is
# strictly earlier feedback than CI gave; what is lost is the independent second
# opinion on a machine that is not mine, which is a real loss and a cheap one to
# accept while the budget is the binding constraint.
on:
  workflow_dispatch:
  # The office asking for a run, under the ceiling in `public.ci_runs` (#17).
  #
  # `repository_dispatch` and not `workflow_dispatch` because the only GitHub
  # credential this office holds carries contents and nothing else — probed,
  # not assumed: every /actions/ endpoint answers 403. This is still on demand
  # only. No schedule and no push trigger has come back.
  repository_dispatch:
    types: [run-ci]

# A newer push to the same ref makes the older run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# ONE job, not five.
#
# The checks used to be a four-way matrix plus a separate secret scan, on the
# reasoning that every check should report independently so one failure cannot
# hide the others. That reasoning is still sound and it is not worth what it
# costs: GitHub bills per JOB and rounds each one up to a whole minute, so a
# push that does eight seconds of linting was charged five minutes. Grant hit
# 90% of the account's 2,000 monthly minutes, and this was a large part of it.
#
# The independence is kept by `continue-on-error` on each step plus a final
# gate: every check still runs even when an earlier one fails, every result is
# still visible by name in the log, and the job still fails if any of them did.
# What is lost is five separate green ticks in the PR view. What is gained is
# roughly a fifth of the bill.
jobs:
  verify:
    name: checks
    runs-on: ubuntu-latest
    steps:
      # What the ledger charges this job, measured by the job itself.
      #
      # The office cannot read GitHub's billing: that needs actions:read and
      # the dispatch token has no Actions scope at all. It does not need to —
      # GitHub bills per JOB rounded up to the minute, so the job is the only
      # thing that knows the real figure, and it knows it exactly.
      - name: note when this job started
        run: echo "CI_BEGAN=$(date -u +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - id: lint
        continue-on-error: true
        run: npm run lint

      - id: typecheck
        continue-on-error: true
        run: npm run typecheck

      - id: test
        continue-on-error: true
        run: npm run test

      - id: migrations
        continue-on-error: true
        run: npm run check:migrations

      # Deliberately given no secrets. The scan compares tracked files against
      # the environment it runs in, so handing it credentials would be the one
      # way to make it leak them. It needs no npm install either.
      - id: secrets
        continue-on-error: true
        run: python3 scripts/secret-scan.py

      # The gate. Named results, then a non-zero exit if any of them failed —
      # `continue-on-error` marks a step's outcome without failing the job, so
      # without this the job would be green with a red step in it, which is the
      # worst of both.
      - name: Results
        run: |
          fail=0
          for check in lint typecheck test migrations secrets; do
            case "$check" in
              lint)       r='${{ steps.lint.outcome }}' ;;
              typecheck)  r='${{ steps.typecheck.outcome }}' ;;
              test)       r='${{ steps.test.outcome }}' ;;
              migrations) r='${{ steps.migrations.outcome }}' ;;
              secrets)    r='${{ steps.secrets.outcome }}' ;;
            esac
            if [ "$r" = "success" ]; then echo "✅ $check"; else echo "❌ $check ($r)"; fail=1; fi
          done
          exit "$fail"

      # Tell the office what this cost, whatever happened above.
      #
      # `if: always()` because a failed run costs exactly what a passing one
      # does, and a ceiling that only counts successes is wrong in the
      # expensive direction.
      #
      # Only when the office asked. A run Grant started by hand from the
      # Actions tab has no reservation to settle, and posting against a null
      # id would be a row describing nothing.
      #
      # The body is built in a FILE, never inline: CLAUDE.md records an Issue
      # body whose backticks the shell expanded and executed.
      - name: report the minutes to the office
        if: always() && github.event_name == 'repository_dispatch'
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: baujwlzcziasnfhhkchg
          CI_RUN_ID: ${{ github.event.client_payload.ci_run_id }}
          CI_OUTCOME: ${{ job.status }}
        run: |
          if [ -z "$CI_RUN_ID" ]; then
            echo "no ci_run_id in the payload - nothing to report"
            exit 0
          fi
          MINUTES=$(( ( $(date -u +%s) - CI_BEGAN + 59 ) / 60 ))
          echo "this job took about ${MINUTES} minute(s), outcome ${CI_OUTCOME}"
          MINUTES="$MINUTES" python3 - <<'PY' > /tmp/ci-report.json
          import json, os, re, uuid
          # The id arrives in an event payload, so it is parsed as a uuid
          # rather than pasted into SQL. It is the office's own dispatch today;
          # a value going into a statement is validated anyway.
          run_id = str(uuid.UUID(os.environ["CI_RUN_ID"]))
          outcome = re.sub(r"[^a-z]", "", os.environ.get("CI_OUTCOME", "").lower())[:20]
          sql = (
              f"select app.ci_report('{run_id}'::uuid, "
              f"{int(os.environ['MINUTES'])}, 'checks {outcome}')"
          )
          print(json.dumps({"query": sql}))
          PY
          curl -sS -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data @/tmp/ci-report.json \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            | head -c 300
          echo
