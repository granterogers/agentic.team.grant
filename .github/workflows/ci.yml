name: CI

#
# ─────────────────────────────────────────────────────────────────────────────
# AUTOMATIC TRIGGERS REMOVED — 2026-09-08
#
# Grant: *"stop using github actions completely please, find another way to do
# thing... for any process."* He had used 1,800 of the account's 2,000 monthly
# minutes, and the spending was mine: a five-minute worker cron and a ten-minute
# sync cron between them made 432 runs a day.
#
# Every schedule and every push trigger in this repository is gone. What each
# workflow did now runs somewhere free, or is written down in
# `.github/workflows/README.md` as a decision waiting on Grant. `workflow_dispatch`
# is deliberately left in place: a workflow that cannot be run by hand is a
# workflow nobody can fall back to, and a button nobody presses costs nothing.
# ─────────────────────────────────────────────────────────────────────────────
#
# CI in particular: the checks still run, on every change, in the session that
# makes the change — `npm run lint && npm run typecheck && npm run test &&
# npm run check:migrations && npm run check:secrets` before every push. That is
# strictly earlier feedback than CI gave; what is lost is the independent second
# opinion on a machine that is not mine, which is a real loss and a cheap one to
# accept while the budget is the binding constraint.
on:
  workflow_dispatch:

# A newer push to the same ref makes the older run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# ONE job, not five.
#
# The checks used to be a four-way matrix plus a separate secret scan, on the
# reasoning that every check should report independently so one failure cannot
# hide the others. That reasoning is still sound and it is not worth what it
# costs: GitHub bills per JOB and rounds each one up to a whole minute, so a
# push that does eight seconds of linting was charged five minutes. Grant hit
# 90% of the account's 2,000 monthly minutes, and this was a large part of it.
#
# The independence is kept by `continue-on-error` on each step plus a final
# gate: every check still runs even when an earlier one fails, every result is
# still visible by name in the log, and the job still fails if any of them did.
# What is lost is five separate green ticks in the PR view. What is gained is
# roughly a fifth of the bill.
jobs:
  verify:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - id: lint
        continue-on-error: true
        run: npm run lint

      - id: typecheck
        continue-on-error: true
        run: npm run typecheck

      - id: test
        continue-on-error: true
        run: npm run test

      - id: migrations
        continue-on-error: true
        run: npm run check:migrations

      # Deliberately given no secrets. The scan compares tracked files against
      # the environment it runs in, so handing it credentials would be the one
      # way to make it leak them. It needs no npm install either.
      - id: secrets
        continue-on-error: true
        run: python3 scripts/secret-scan.py

      # The gate. Named results, then a non-zero exit if any of them failed —
      # `continue-on-error` marks a step's outcome without failing the job, so
      # without this the job would be green with a red step in it, which is the
      # worst of both.
      - name: Results
        run: |
          fail=0
          for check in lint typecheck test migrations secrets; do
            case "$check" in
              lint)       r='${{ steps.lint.outcome }}' ;;
              typecheck)  r='${{ steps.typecheck.outcome }}' ;;
              test)       r='${{ steps.test.outcome }}' ;;
              migrations) r='${{ steps.migrations.outcome }}' ;;
              secrets)    r='${{ steps.secrets.outcome }}' ;;
            esac
            if [ "$r" = "success" ]; then echo "✅ $check"; else echo "❌ $check ($r)"; fail=1; fi
          done
          exit "$fail"
