name: Worker

# Drain the job queue, every few minutes.
#
# ## Why this exists
#
# Until 2026-09-06 every caller of the job engine was a verification suite that
# enqueued its own work and drained it in the same process. That was enough
# while the only things enqueueing were tests. It stopped being enough the
# moment Grant could enqueue: he messages a staff bot, or asks ChatGPT for an
# audio overview, the job goes to `queued`, and nothing on earth picks it up.
#
# A queue with no consumer is a queue that looks like it is working — which is
# worse than one that is visibly broken, because the request was accepted.
#
# ## Why five minutes
#
# Grant is talking to these bots. A reply that lands ten minutes later is a
# reply he has stopped waiting for, and the whole point of a bot per role is
# that it feels like messaging a colleague. Five is a compromise with Actions
# cron, which is best-effort and can be delayed under load; anything tighter
# would be a promise the scheduler does not make.
#
# `npm run work` is also safe to run by hand while iterating, and does one pass.
#
# ─────────────────────────────────────────────────────────────────────────────
# AUTOMATIC TRIGGERS REMOVED — 2026-09-08
#
# Grant: *"stop using github actions completely please, find another way to do
# thing... for any process."* He had used 1,800 of the account's 2,000 monthly
# minutes, and the spending was mine: a five-minute worker cron and a ten-minute
# sync cron between them made 432 runs a day.
#
# Every schedule and every push trigger in this repository is gone. What each
# workflow did now runs somewhere free, or is written down in
# `.github/workflows/README.md` as a decision waiting on Grant. `workflow_dispatch`
# is deliberately left in place: a workflow that cannot be run by hand is a
# workflow nobody can fall back to, and a button nobody presses costs nothing.
# ─────────────────────────────────────────────────────────────────────────────
on:
  workflow_dispatch:
  # The Telegram webhook POSTs this the instant a VOICE note lands.
  #
  # Typed messages never come this way: the Edge worker answers those in the
  # time one model call takes. Voice needs a runner because transcription runs
  # faster-whisper in a subprocess, and the edge runtime has neither Python nor
  # subprocesses — it reports `can_transcribe: false` about itself, and 0125
  # stops it claiming a job it would only fail.
  #
  # This exists because the cron above is a wish. It says every five minutes and
  # over the fourteen hours before Grant complained it ran six times; GitHub
  # documents schedules as best-effort and drops frequent ones first.
  # `repository_dispatch` is not a schedule and starts a run in seconds.
  #
  # NOTE, learned by testing it: `repository_dispatch` only starts workflows
  # that exist on the DEFAULT BRANCH. The API accepted the POST with a 204 and
  # started nothing, because this trigger was only on the feature branch at the
  # time. A 204 means "your event was accepted", never "a run began" — so the
  # fast path for voice notes is inert until this file is merged to the default
  # branch, and the cron is what carries them until then.
  repository_dispatch:
    types: [voice-note]

concurrency:
  # Never two workers at once. The engine would survive it — `dequeue_job`
  # leases, and two workers racing collide on the lease rather than doing the
  # same job twice — but a second runner adds nothing and costs minutes.
  group: worker
  cancel-in-progress: false

permissions:
  contents: read

# A person dispatches this workflow, which is the intent src/safety/production-gate.ts asks for (docs/production-access-guard.md).
env:
  ALLOW_PRODUCTION_CHECKS: '1'
  ALLOW_PRODUCTION_WRITES: '1'

jobs:
  work:
    runs-on: ubuntu-latest
    # Longer than any single job's lease, so a runner is never killed while the
    # database still believes it holds one. The recovery sweep would reclaim it
    # on the next tick, but a job that has to be reclaimed every run is a job
    # that never finishes.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: |
          npm ci
          # Pinned for the same reason the sync pins it: the notebook adapter is
          # the highest-risk dependency here (§7), and an unattended job
          # silently upgrading it is how an undocumented RPC change arrives at
          # 3am instead of in a diff.
          pip install --quiet "notebooklm-py==0.8.2"
          # Voice notes are transcribed on this runner and nowhere else. The
          # three audio-capable free models OpenRouter offers are all closed to
          # us — two gated to their vendor's harness, one refused by our own
          # `data_collection: deny` — and a voice note is the last thing to
          # relax that for. Pinned for the same reason as the line above.
          pip install --quiet "faster-whisper==1.1.1"

      # ~460MB for small.en, downloaded from Hugging Face on first use. Cached
      # because fetching it on every run is both slow and rude, and because a
      # rate-limited download would surface as "the bot ignored my voice note".
      #
      # The key names the model. It has to: base.en was cached under the old
      # key, and leaving the key alone while changing the model would restore
      # the wrong weights and quietly undo the fix — a cache hit on the thing
      # that was measured to be wrong.
      - name: Cache the speech model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-en-v1

      - name: Work
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          # `|| ...` and not a bare secret reference. An unset GitHub secret
          # interpolates to the EMPTY STRING, and every call site writes
          # `process.env.SUPABASE_PROJECT_REF ?? '<ref>'`, which does not fire on
          # empty. So an unset secret overrode the default with nothing, the URL
          # became /v1/projects//database/query, and thirty consecutive nightly
          # syncs died on a 404 that named no cause. The executor now refuses an
          # empty ref out loud (0102's sibling change); this stops it arising.
          # The project ref is not a secret — it is the default in 82 source
          # files already.
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || 'baujwlzcziasnfhhkchg' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: npm run work
