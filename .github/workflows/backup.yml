name: Backup and restore rehearsal

# Supabase Free provides NO backups at all, so this is not a nicety — it is the
# only copy. And per §16 a backup feature is incomplete until restoration is
# tested, so the rehearsal runs on the same schedule as the dump rather than
# once by hand.
#
# This lives in Actions because it is the only place it CAN live: pg_dump speaks
# the Postgres wire protocol and has no HTTPS mode, while a Claude Code session
# has no non-443 TCP egress at all (ADR-0007).

on:
  schedule:
    # 03:17 UTC. Off the hour because every cron on the hour contends with
    # every other cron on the hour.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      skip_upload:
        description: 'Dump and rehearse the restore without uploading'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

env:
  PGVERSION: '17'

jobs:
  backup:
    name: dump and upload
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.dump.outputs.name }}
    steps:
      # ONE Actions secret, not seven.
      #
      # The session's egress policy refuses the GitHub Actions secrets API
      # (403), so Claude cannot write repository secrets and every one is a
      # manual step — three runs failed on the same six names. The credentials
      # now live in Supabase Vault instead, which is where §15 puts credentials
      # for the deployed runtime anyway. `npm run bootstrap:backup-credentials`
      # loads them; this reads them back.
      - name: Check the one required secret is present
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            {
              echo "### Missing Actions secret"
              echo
              echo 'Add \`SUPABASE_ACCESS_TOKEN\` under Settings → Secrets and variables → Actions.'
              echo "Every other credential is read from Supabase Vault at runtime."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::SUPABASE_ACCESS_TOKEN is not set"
            exit 1
          fi
          echo "SUPABASE_ACCESS_TOKEN present; everything else comes from the vault"

      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Load backup credentials from the vault
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npm run --silent backup:credentials

      # ubuntu-latest ships postgresql-client 16, and pg_dump refuses a server
      # newer than itself. Supabase runs 17.6, so the matching client is not
      # optional.
      - name: Install postgresql-client ${{ env.PGVERSION }}
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-${PGVERSION}

          # Use the VERSIONED binary, not whatever /usr/bin/pg_dump resolves to.
          # ubuntu-latest already ships postgresql-client-16, and installing 17
          # alongside it does not repoint /usr/bin/pg_dump — which is a wrapper
          # that picks the default cluster version. The install step succeeded
          # and pg_dump still aborted with "server version mismatch: server 17.6,
          # pg_dump 16.15".
          PGBIN="/usr/lib/postgresql/${PGVERSION}/bin"
          if [ ! -x "$PGBIN/pg_dump" ]; then
            echo "::error::$PGBIN/pg_dump is missing after installing postgresql-client-${PGVERSION}"
            exit 1
          fi
          echo "PGBIN=$PGBIN" >> "$GITHUB_ENV"
          "$PGBIN/pg_dump" --version

      - name: Resolve the session-pooler connection
        id: conn
        env:
          # SUPABASE_DB_PASSWORD was put into the environment by the vault step.
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          URI="$(npm run --silent backup:connection)"
          # Mask before the value is used anywhere, so a later failure cannot
          # print it. Actions masks it in every subsequent log line.
          echo "::add-mask::$URI"
          echo "uri=$URI" >> "$GITHUB_OUTPUT"

      - name: Capture a manifest and the role list of the source
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          npm run --silent backup:manifest > manifest.json
          cat manifest.json

          # The dump's GRANT statements name roles, and psql aborts on the first
          # one missing from the target. Deriving the list from the source beats
          # enumerating it: there are 15, the set changes as Supabase evolves,
          # and each omission costs a whole run to find. Learned the slow way —
          # this restore failed on `public` existing, then on supabase_admin
          # not existing, one role per run.
          npm run --silent backup:roles > roles.sql
          wc -l roles.sql

      - name: pg_dump
        id: dump
        run: |
          NAME="aiteamhq-$(date -u +%Y%m%dT%H%M%SZ)"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

          # Only our own schemas. Supabase owns auth, storage, realtime and
          # extensions; dumping them produces a restore that fails on roles and
          # extensions this project does not control, and none of it is ours to
          # back up.
          #
          # Privileges and owners are KEPT deliberately: the restore rehearsal
          # has to prove the REVOKEs and RLS came back, and --no-privileges
          # would quietly throw away the thing being tested.
          "$PGBIN/pg_dump" "${{ steps.conn.outputs.uri }}" \
            --schema=public \
            --schema=app \
            --format=plain \
            --no-comments \
            --quote-all-identifiers \
            --file="$NAME.sql"

          gzip -9 "$NAME.sql"
          sha256sum "$NAME.sql.gz" | tee "$NAME.sha256"
          ls -lh "$NAME.sql.gz"

          # A dump far smaller than expected is a dump of nothing. Failing here
          # is much better than discovering it during a real restore.
          SIZE=$(stat -c%s "$NAME.sql.gz")
          if [ "$SIZE" -lt 2048 ]; then
            echo "::error::dump is only $SIZE bytes — refusing to treat this as a backup"
            exit 1
          fi

      # Handed to the rehearsal job. This is also a second, independent copy for
      # 90 days, which costs nothing.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.dump.outputs.name }}
          path: |
            ${{ steps.dump.outputs.name }}.sql.gz
            ${{ steps.dump.outputs.name }}.sha256
            manifest.json
            roles.sql
          retention-days: 90
          if-no-files-found: error

      - name: Upload to offsite storage
        if: inputs.skip_upload != true
        env:
          AWS_ACCESS_KEY_ID: ${{ env.BACKUP_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.BACKUP_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ env.BACKUP_S3_REGION }}
          ENDPOINT: ${{ env.BACKUP_S3_ENDPOINT }}
          BUCKET: ${{ env.BACKUP_S3_BUCKET }}
          NAME: ${{ steps.dump.outputs.name }}
        run: |
          for f in "$NAME.sql.gz" "$NAME.sha256" manifest.json roles.sql; do
            dest="$BUCKET/$(date -u +%Y/%m)/$NAME/$(basename "$f")"
            aws s3 cp "$f" "s3://$dest" --endpoint-url "$ENDPOINT" --only-show-errors
            echo "uploaded s3://$dest"
          done

      - name: Prune backups older than 30 days
        if: inputs.skip_upload != true
        env:
          AWS_ACCESS_KEY_ID: ${{ env.BACKUP_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.BACKUP_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ env.BACKUP_S3_REGION }}
          ENDPOINT: ${{ env.BACKUP_S3_ENDPOINT }}
          BUCKET: ${{ env.BACKUP_S3_BUCKET }}
        run: |
          # The free tier is 10 GB and the bucket keeps all versions by default,
          # so unbounded nightly accumulation would eventually fill it and
          # backups would start failing quietly — the worst way for a backup to
          # break. Pruning here is the code half; a bucket lifecycle rule is the
          # belt to this braces.
          CUTOFF=$(date -u -d '30 days ago' +%Y-%m-%dT%H:%M:%SZ)
          echo "pruning objects last modified before $CUTOFF"
          aws s3api list-objects-v2 --bucket "$BUCKET" --endpoint-url "$ENDPOINT" \
            --query "Contents[?LastModified<'$CUTOFF'].Key" --output text \
            | tr '\t' '\n' | grep -v '^$' > to-delete.txt || true
          COUNT=$(wc -l < to-delete.txt)
          echo "$COUNT object(s) to delete"
          while read -r key; do
            [ -z "$key" ] && continue
            aws s3 rm "s3://$BUCKET/$key" --endpoint-url "$ENDPOINT" --only-show-errors
          done < to-delete.txt

  restore-rehearsal:
    name: restore into a fresh database and verify
    needs: backup
    runs-on: ubuntu-latest

    # A real, empty PostgreSQL 17 — the "fresh project" §16 asks for, except
    # ephemeral and free. Restoring into the source project would prove nothing
    # and risk everything.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: rehearsal
          POSTGRES_DB: rehearsal
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.backup.outputs.artifact }}

      - name: Verify the dump's checksum before trusting it
        run: |
          sha256sum -c "${{ needs.backup.outputs.artifact }}.sha256"

      - run: sudo apt-get install -y -qq postgresql-client

      - name: Prepare the target as a genuinely empty database
        env:
          PGPASSWORD: rehearsal
        run: |
          # A real disaster recovery restores into an EMPTY database. A
          # rehearsal that merges into pre-existing objects is not rehearsing
          # that, and its row counts would no longer prove they came from the
          # dump. PostgreSQL 15+ dumps CREATE SCHEMA public explicitly, so the
          # stock container's own public schema has to go first.
          psql -h localhost -U postgres -d rehearsal -v ON_ERROR_STOP=1 \
            -c 'drop schema if exists public cascade'

          # Roles, generated from the source rather than guessed. This step is
          # kept rather than engineered away: a real restore into a replacement
          # project needs exactly it, so the rehearsal should include it.
          psql -h localhost -U postgres -d rehearsal -v ON_ERROR_STOP=1 -q -f roles.sql
          echo "roles created"

          # A stand-in for Supabase Vault.
          #
          # THIS IS WHY EVERY RUN OF THIS WORKFLOW FAILED FOR TWELVE NIGHTS.
          # `public.credential_health` is a view over `vault.secrets`, the dump
          # faithfully contains it, and stock PostgreSQL has no vault — so the
          # restore aborted on that one statement and the verification below
          # never ran at all.
          #
          # This is not a stub that makes a check pass on a fake. The real
          # target of a restore is a NEW SUPABASE PROJECT, which has the vault
          # extension; the rehearsal container did not, so it was failing to
          # represent the target rather than finding a fault in the dump. The
          # row-count assertions afterwards are untouched.
          #
          # What it deliberately does NOT do is fake vault CONTENTS. The dump is
          # --schema=public --schema=app, so the secrets are not in it and never
          # were. `verify:restore` says so out loud rather than leaving it to be
          # discovered during a real recovery.
          psql -h localhost -U postgres -d rehearsal -v ON_ERROR_STOP=1 -q <<'SQL'
            create schema if not exists vault;
            create table if not exists vault.secrets (
              id uuid primary key default gen_random_uuid(),
              name text unique, description text, secret text,
              created_at timestamptz default now(), updated_at timestamptz default now()
            );
            create or replace view vault.decrypted_secrets as
              select id, name, description, secret as decrypted_secret, created_at, updated_at
              from vault.secrets;
          SQL
          echo "vault stand-in created (schema only — the dump carries no secrets)"

      - name: Restore
        env:
          PGPASSWORD: rehearsal
        run: |
          gunzip -c "${{ needs.backup.outputs.artifact }}.sql.gz" > restore.sql
          wc -l restore.sql
          # ON_ERROR_STOP so a half-restore cannot be mistaken for a restore.
          psql -h localhost -U postgres -d rehearsal -v ON_ERROR_STOP=1 -q -f restore.sql

      - name: Verify the restore
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGDATABASE: rehearsal
          PGPASSWORD: rehearsal
          MANIFEST: manifest.json
        run: npm run --silent verify:restore | tee restore-report.md

      - uses: actions/upload-artifact@v4
        with:
          name: restore-report-${{ needs.backup.outputs.artifact }}
          path: restore-report.md
          retention-days: 90

  notify:
    name: page on failure
    needs: [backup, restore-rehearsal]
    # Only when something actually broke. `always()` so it still runs after a
    # failed job, `contains(...)` so a green night is silent — a pager that
    # fires nightly is a pager that gets muted.
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Page Grant
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          npm run --silent backup:notify -- \
            "dump=${{ needs.backup.result }} · restore rehearsal=${{ needs['restore-rehearsal'].result }}" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
