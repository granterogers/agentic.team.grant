name: Vault export

# The vault, encrypted, to Grant's phone — weekly.
#
# The nightly `pg_dump` is `--schema=public --schema=app`. Supabase Vault lives
# in `vault` and is excluded, correctly: a backup carrying decryptable secrets
# offsite would be a worse problem than the one it solves. The consequence is
# that a restore produces a working database with an EMPTY vault, and every
# secret has to be re-entered by hand.
#
# `npm run vault:export` closes that, and until this workflow existed it closed
# it only when someone remembered — so a secret added on Tuesday was in no
# export until somebody ran a command. That is a backup that depends on memory,
# which is not a backup.
#
# Weekly rather than nightly on purpose: each run puts an encrypted copy of
# every credential in a Telegram chat, and seven of those a week is seven
# copies to delete rather than one. Secrets change rarely; the export is cheap
# to run by hand the moment one does.
#
# ─────────────────────────────────────────────────────────────────────────────
# AUTOMATIC TRIGGERS REMOVED — 2026-09-08
#
# Grant: *"stop using github actions completely please, find another way to do
# thing... for any process."* He had used 1,800 of the account's 2,000 monthly
# minutes, and the spending was mine: a five-minute worker cron and a ten-minute
# sync cron between them made 432 runs a day.
#
# Every schedule and every push trigger in this repository is gone. What each
# workflow did now runs somewhere free, or is written down in
# `.github/workflows/README.md` as a decision waiting on Grant. `workflow_dispatch`
# is deliberately left in place: a workflow that cannot be run by hand is a
# workflow nobody can fall back to, and a button nobody presses costs nothing.
# ─────────────────────────────────────────────────────────────────────────────
on:
  workflow_dispatch:

concurrency:
  group: vault-export
  cancel-in-progress: false

permissions:
  contents: read

# A person dispatches this workflow, which is the intent src/safety/production-gate.ts asks for (docs/production-access-guard.md).
env:
  ALLOW_PRODUCTION_CHECKS: '1'
  ALLOW_PRODUCTION_WRITES: '1'

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Export
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          # `|| ...` and not a bare secret reference. An unset GitHub secret
          # interpolates to the EMPTY STRING, and every call site writes
          # `process.env.SUPABASE_PROJECT_REF ?? '<ref>'`, which does not fire on
          # empty. So an unset secret overrode the default with nothing, the URL
          # became /v1/projects//database/query, and thirty consecutive nightly
          # syncs died on a 404 that named no cause. The executor now refuses an
          # empty ref out loud (0102's sibling change); this stops it arising.
          # The project ref is not a secret — it is the default in 82 source
          # files already.
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || 'baujwlzcziasnfhhkchg' }}
        # The script prints no secret and no passphrase — both go to Telegram,
        # in separate messages — so this log is safe to read.
        run: npm run vault:export
