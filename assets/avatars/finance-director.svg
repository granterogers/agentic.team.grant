<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Illustrated portrait for finance-director">
  <defs>
    <radialGradient id="bgfinancedirector" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#fdf0ee"/><stop offset="100%" stop-color="#f3cfc8"/>
    </radialGradient>
    <clipPath id="clipfinancedirector"><circle cx="128" cy="128" r="128"/></clipPath>
  </defs>
  <g clip-path="url(#clipfinancedirector)">
    <rect width="256" height="256" fill="url(#bgfinancedirector)"/>

    <!-- neck first, then body, then collar. The reverse order put the collar
         under the neck and produced a pale wedge where clothing should be. -->
    <path fill="#6f4222" d="M110 164h36v40c0 9-8 14-18 14s-18-5-18-14z"/>
    <path fill="#4a4468" d="M40 256c0-44 34-64 88-64s88 20 88 64z"/>
    <path fill="#000000" fill-opacity="0.09" d="M40 256c0-44 34-64 88-64v64z"/>
    <path fill="#000000" fill-opacity="0.13" d="M104 200c8 14 16 22 24 26 8-4 16-12 24-26l6 4c-9 18-19 28-30 33-11-5-21-15-30-33z"/><path fill="none" stroke="#efe9e0" stroke-opacity="0.42" stroke-width="6" d="M100 199c9 13 18 20 28 20s19-7 28-20"/>

    <!-- head -->
    <ellipse cx="128" cy="120" rx="49" ry="57" fill="#8d5a34"/>
    <!-- Soft edge shading. Written first as a filled half-ellipse over the
         right side of the face, which rendered as a hard vertical seam down
         the middle of every portrait - the kind of thing that is invisible in
         the path data and unmissable in a contact sheet. -->
    <ellipse cx="152" cy="126" rx="30" ry="52" fill="#6f4222" fill-opacity="0.22"/>
    <ellipse cx="128" cy="168" rx="30" ry="14" fill="#6f4222" fill-opacity="0.16"/>
    <!-- ears -->
    <ellipse cx="79" cy="124" rx="9" ry="13" fill="#8d5a34"/>
    <ellipse cx="177" cy="124" rx="9" ry="13" fill="#6f4222"/>

    <path fill="#12100f" d="M74 118c0-34 24-58 54-58s54 24 54 58c0 22-4 38-8 46-3-8-4-24-4-40-14 8-30 12-42 12s-28-4-42-12c0 16-1 32-4 40-4-8-8-24-8-46z"/>

    <!-- brows -->
    <path stroke="#12100f" stroke-width="5" stroke-linecap="round" fill="none" d="M104 110c5-4 14-4 19 0"/>
    <path stroke="#12100f" stroke-width="5" stroke-linecap="round" fill="none" d="M133 110c5-4 14-4 19 0"/>
    <!-- eyes -->
    <ellipse cx="113" cy="124" rx="7" ry="8" fill="#ffffff"/>
    <ellipse cx="143" cy="124" rx="7" ry="8" fill="#ffffff"/>
    <circle cx="114" cy="125" r="4" fill="#2a2118"/>
    <circle cx="144" cy="125" r="4" fill="#2a2118"/>

    <!-- Beard before the mouth, so the mouth stays visible. The other way
         round, a beard swallowed the whole lower face.
         Two small sideburn accents were removed after rasterising at 512px:
         they read as connected shading at 150px and as floating dark shards at
         full size. Worth the note because it is the second time these have
         only been wrong at a size nobody was looking at. -->
    <path fill="#12100f" fill-opacity="0.95" d="M92 154c2 8 4 14 7 19 7 14 18 22 29 22s22-8 29-22c3-5 5-11 7-19 1 12 0 21-4 29-7 15-19 24-32 24s-25-9-32-24c-4-8-5-17-4-29z"/>

    <!-- nose and mouth -->
    <path stroke="#6f4222" stroke-width="4" stroke-linecap="round" fill="none" d="M128 130v12l-6 4"/>
    <path stroke="#c08074" stroke-width="4" stroke-linecap="round" fill="none" d="M117 158c7 6 15 6 22 0"/>

    <g fill="none" stroke="#3a3a3a" stroke-width="4" stroke-opacity="0.85">
             <rect x="98" y="112" width="30" height="24" rx="9"/>
             <rect x="130" y="112" width="30" height="24" rx="9"/>
             <path d="M128 122h2"/><path d="M98 120l-14 4"/><path d="M160 120l14 4"/>
           </g>
  </g>
</svg>
