<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Illustrated portrait for chief-of-staff">
  <defs>
    <radialGradient id="bgchiefofstaff" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#eceaf0"/><stop offset="100%" stop-color="#d2cdd9"/>
    </radialGradient>
    <clipPath id="clipchiefofstaff"><circle cx="128" cy="128" r="128"/></clipPath>
  </defs>
  <g clip-path="url(#clipchiefofstaff)">
    <rect width="256" height="256" fill="url(#bgchiefofstaff)"/>

    <!-- neck first, then body, then collar. The reverse order put the collar
         under the neck and produced a pale wedge where clothing should be. -->
    <path fill="#eabf98" d="M110 164h36v40c0 9-8 14-18 14s-18-5-18-14z"/>
    <path fill="#6b3f52" d="M40 256c0-44 34-64 88-64s88 20 88 64z"/>
    <path fill="#000000" fill-opacity="0.09" d="M40 256c0-44 34-64 88-64v64z"/>
    <path fill="#000000" fill-opacity="0.13" d="M104 200c8 14 16 22 24 26 8-4 16-12 24-26l6 4c-9 18-19 28-30 33-11-5-21-15-30-33z"/><path fill="none" stroke="#efe9e0" stroke-opacity="0.42" stroke-width="6" d="M100 199c9 13 18 20 28 20s19-7 28-20"/>

    <!-- head -->
    <ellipse cx="128" cy="120" rx="49" ry="57" fill="#ffd9b8"/>
    <!-- Soft edge shading. Written first as a filled half-ellipse over the
         right side of the face, which rendered as a hard vertical seam down
         the middle of every portrait - the kind of thing that is invisible in
         the path data and unmissable in a contact sheet. -->
    <ellipse cx="152" cy="126" rx="30" ry="52" fill="#eabf98" fill-opacity="0.22"/>
    <ellipse cx="128" cy="168" rx="30" ry="14" fill="#eabf98" fill-opacity="0.16"/>
    <!-- ears -->
    <ellipse cx="79" cy="124" rx="9" ry="13" fill="#ffd9b8"/>
    <ellipse cx="177" cy="124" rx="9" ry="13" fill="#eabf98"/>

    <g fill="#2b1b14"><path d="M80 110c0-30 22-52 48-52s48 22 48 52c0 5-1 9-3 12-4-18-16-30-31-34-16-4-38 0-52 12-6 5-9 10-10 16-3-2-4-6-4-6z"/><circle cx="128" cy="42" r="16"/></g>

    <!-- brows -->
    <path stroke="#2b1b14" stroke-width="5" stroke-linecap="round" fill="none" d="M104 110c5-4 14-4 19 0"/>
    <path stroke="#2b1b14" stroke-width="5" stroke-linecap="round" fill="none" d="M133 110c5-4 14-4 19 0"/>
    <!-- eyes -->
    <ellipse cx="113" cy="124" rx="7" ry="8" fill="#ffffff"/>
    <ellipse cx="143" cy="124" rx="7" ry="8" fill="#ffffff"/>
    <circle cx="114" cy="125" r="4" fill="#2a2118"/>
    <circle cx="144" cy="125" r="4" fill="#2a2118"/>

    <!-- Beard before the mouth, so the mouth stays visible. The other way
         round, a beard swallowed the whole lower face.
         Two small sideburn accents were removed after rasterising at 512px:
         they read as connected shading at 150px and as floating dark shards at
         full size. Worth the note because it is the second time these have
         only been wrong at a size nobody was looking at. -->
    

    <!-- nose and mouth -->
    <path stroke="#eabf98" stroke-width="4" stroke-linecap="round" fill="none" d="M128 130v12l-6 4"/>
    <path stroke="#8d4f43" stroke-width="4" stroke-linecap="round" fill="none" d="M117 158c7 6 15 6 22 0"/>

    
  </g>
</svg>
